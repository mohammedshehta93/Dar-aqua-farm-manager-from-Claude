async function photoSendToAI(){
  if(!_photoState.imageB64){ toast('⚠️ ارفع صورة أولاً'); return; }
  _photoState.status = 'reading';
  _photoState.parsed = null;
  show('photo-entry');

  var farm    = _photoState.farm;
  var mode    = _photoState.mode;
  var allUnits= allUnitNames().filter(function(u){ return u.startsWith(farm+'.'); });

  // Build prompt based on sheet type
  var prompt = '';
  if(mode==='feeding'){
    prompt = 'This is a fish feeding log sheet from a fish farm. ';
    prompt += 'Extract ALL feeding data. The sheet has columns: Tank (like 1.1, 1.2, etc or S1.1), meal at 8am, meal at 12pm, meal at 4pm (in kg), feed Size (pellet size like 1m,2m,3m), and dead (mortality count). ';
    prompt += 'The farm prefix is "'+farm+'" so tank "1.1" = unit "'+farm+'.S01T01" or map to the closest unit. Use this unit list as reference: '+allUnits.slice(0,20).join(',')+'. ';
    prompt += 'Return ONLY a JSON object with this exact structure, no markdown, no explanation: ';
    prompt += '{"rows":[{"tank":"F1.S01T01","meal8":1.2,"meal12":1.2,"meal4":1.2,"size":"3m","dead":0},...]}. ';
    prompt += 'If a value is blank or dashes, use null. Include ALL rows visible in the sheet.';
  } else if(mode==='sampling'){
    prompt = 'This is a fish sampling sheet. Extract tank/unit numbers and for each: sample count (number of fish weighed), total weight (grams), average weight per fish (grams), and any notes. ';
    prompt += 'Farm prefix "'+farm+'". Return ONLY JSON: {"rows":[{"tank":"F1.S01T01","sampleCount":30,"totalWt":9500,"avgWt":316.7,"notes":""},...]}';
  } else if(mode==='wq'){
    prompt = 'This is a water quality log sheet. Extract per tank: temperature (°C), dissolved oxygen DO (mg/L), pH, salinity (ppt), ammonia NH3 (mg/L), and notes. ';
    prompt += 'Farm prefix "'+farm+'". Return ONLY JSON: {"rows":[{"tank":"F1.S01T01","temp":28.5,"do":6.2,"ph":7.8,"salinity":0,"ammonia":0.02,"notes":""},...]}';
  }

  try{
    // Use sample capability (works in published artifact, no CSP issues)
    // Use Netlify AI proxy (works on GitHub Pages via candid-naiad)
    var sample = null; // Not using claude.use on GitHub Pages

    // Convert base64 to Blob for image input
    var b64 = _photoState.imageB64;
    var byteStr = atob(b64);
    var arr = new Uint8Array(byteStr.length);
    for(var i=0;i<byteStr.length;i++) arr[i]=byteStr.charCodeAt(i);
    var imgBlob = new Blob([arr], {type:'image/jpeg'});

    // Call Anthropic API directly (key stored in settings)
    var apiKey = getSettings().anthropicKey || '';
    if(!apiKey) throw new Error('ادخل Anthropic API Key في Control Center → الإعدادات');
    var aiResp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 2000,
        messages: [{ role: 'user', content: [
          { type: 'image', source: { type: 'base64', media_type: _photoState.imageType||'image/jpeg', data: _photoState.imageB64 }},
          { type: 'text',  text: prompt }
        ]}]
      })
    });
    if(!aiResp.ok) throw new Error('Anthropic API error: ' + aiResp.status);
    var aiData = await aiResp.json();
    var text = (aiData.content && aiData.content[0]) ? aiData.content[0].text : '';

    // Clean and parse JSON
    text = text.replace(/```json/g,'').replace(/```/g,'').trim();
    // Extract JSON if wrapped in text
    var jsonMatch = text.match(/\{[\s\S]*\}/);
    if(jsonMatch) text = jsonMatch[0];
    var parsed = JSON.parse(text);

    // Map tank numbers to full unit names
    if(parsed && parsed.rows){
      parsed.rows = parsed.rows.map(function(row){
        if(row.tank && !row.tank.startsWith(farm+'.')){
          var parts = String(row.tank).split('.');
          if(parts.length===2){
            var sec  = 'S'+String(parseInt(parts[0])).padStart(2,'0');
            var tnk  = 'T'+String(parseInt(parts[1])).padStart(2,'0');
            var match = allUnits.find(function(u){return u.indexOf(sec)>=0&&u.indexOf(tnk)>=0;});
            row.tank = match || (farm+'.'+sec+'.'+tnk);
          }
        }
        return row;
      });
    }

    _photoState.parsed = parsed;
    _photoState.status = 'review';
    _photoState.imageB64 = ''; // clear immediately
  }catch(err){
    _photoState.status = 'error';
    _photoState.errMsg = err.message || 'خطأ غير معروف';
    _photoState.imageB64 = '';
  }
  show('photo-entry');
}

function photoSaveAll(){
  var parsed = _photoState.parsed;
  if(!parsed||!parsed.rows||!parsed.rows.length){ toast('⚠️ لا توجد بيانات'); return; }
  var date = _photoState.date;
  var saved = 0;
  var mode  = _photoState.mode;

  parsed.rows.forEach(function(row){
    if(row.skip) return;
    if(!row.tank) return;

    if(mode==='feeding'){
      var meals = [
        {t:'8:00',  kg:parseFloat(row.meal8)||0},
        {t:'12:00', kg:parseFloat(row.meal12)||0},
        {t:'16:00', kg:parseFloat(row.meal4)||0},
      ];
      meals.forEach(function(m){
        if(m.kg>0){
          addTX({type:'feeding', date:date, unit:row.tank, kg:m.kg, meal:m.t, feed:row.size||'', notes:'Photo Entry'});
          saved++;
        }
      });
      // Mortality
      var dead = parseInt(row.dead)||0;
      if(dead>0){
        addTX({type:'mortality', date:date, unit:row.tank, count:dead, cause:'Photo Entry', notes:''});
        saved++;
      }
    } else if(mode==='sampling'){
      var cnt = parseInt(row.sampleCount)||0;
      var tw  = parseFloat(row.totalWt)||0;
      var avg = cnt>0&&tw>0 ? tw/cnt : parseFloat(row.avgWt)||0;
      if(avg>0){
        addTX({type:'sampling', date:date, unit:row.tank, avgWt:avg, sampleCount:cnt, totalWt:tw, notes:'Photo Entry'});
        saved++;
      }
    } else if(mode==='wq'){
      addTX({type:'water_quality', date:date, unit:row.tank,
        temp:parseFloat(row.temp)||null, do:parseFloat(row.do)||null,
        ph:parseFloat(row.ph)||null, salinity:parseFloat(row.salinity)||null,
        ammonia:parseFloat(row.ammonia)||null, notes:'Photo Entry'});
      saved++;
    }
  });

  _photoState.savedCount = saved;
  _photoState.status = 'done';
  _photoState.parsed = null;
  show('photo-entry');
  toast('✅ تم حفظ '+saved+' سجل بنجاح');
}

  _photoState.parsed = null;

async function aiSendQuestion(){
  var el=document.getElementById('ai-question');
  if(!el) return;
  var question=(el.value||'').trim();
  if(!question) return;
  el.value='';

  var chatEl=document.getElementById('ai-chat-history');
  if(!chatEl) return;

  // Add user message
  _aiHistory.push({role:'user',content:question});
  chatEl.innerHTML='';
  _aiHistory.forEach(function(m){
    var isUser=m.role==='user';
    chatEl.innerHTML+='<div style="display:flex;justify-content:'+(isUser?'flex-end':'flex-start')+'">';
    chatEl.innerHTML+='<div style="max-width:85%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.6;background:'+(isUser?'var(--teal)':'var(--paper)')+';color:'+(isUser?'#fff':'var(--ink)')+'">'+m.content+'</div></div>';
  });

function soColToggle(colId,checked){
  var COLS_KEY='daracqua_so_cols_v1';var saved;

function feedSaveAll(){
  var date=document.getElementById('fd-date').value;
  var liveRs=_txLiveRows().filter(function(r){return(r.fishNo||0)>0&&(farmFilter==='all'||r.farm===farmFilter);});
  
  // Collect all feeding entries first
  var entries = [];
  liveRs.forEach(function(r){
    var el=document.getElementById('fd-kg-'+r.unit); var kg=parseFloat(el?el.value:0)||0; if(kg<=0)return;
    var feed=(document.getElementById('fd-feed-'+r.unit)||{}).value||'';
    var meal=(document.getElementById('fd-meal-'+r.unit)||{}).value||'صباح';
    var notes=(document.getElementById('fd-notes-'+r.unit)||{}).value||'';
    entries.push({unit:r.unit, kg:kg, feed:feed, meal:meal, notes:notes});
  });
  
  if(!entries.length){ toast('⚠️ لا توجد بيانات للحفظ'); return; }
  
  // Check inventory - group by feed type
  var byFeed = {};
  entries.forEach(function(e){
    var t = e.feed||'';
    if(!byFeed[t]) byFeed[t] = {kg:0, units:[]};
    byFeed[t].kg += e.kg;
    byFeed[t].units.push(e.unit);
  });
  
  // Check if inventory tracking is active (inventory has items)
  var hasInventory = getFeedInv().length > 0;
  
  if(hasInventory){
    // Validate all feed types have sufficient stock
    var errors = [];
    Object.keys(byFeed).forEach(function(feedType){
      if(!feedType){ errors.push('بعض الوحدات بدون نوع علف'); return; }
      var check = checkFeedAvailable(feedType, byFeed[feedType].kg);
      if(!check.ok) errors.push(feedType+': '+check.msg);
    });
    
    if(errors.length){
      toast('❌ '+errors[0]);
      return; // Block saving if inventory insufficient
    }
  }
  
  // Save all TX entries
  var saved = 0;
  entries.forEach(function(e){
    addTX({type:'feeding', date:date, unit:e.unit, kg:e.kg, feed:e.feed, meal:e.meal, notes:e.notes});
    saved++;
  });
  
  // Deduct from inventory per feed type
  if(hasInventory){
    Object.keys(byFeed).forEach(function(feedType){
      if(!feedType) return;
      var totalKg = byFeed[feedType].kg;
      var units   = byFeed[feedType].units;
      deductFeedFromInventory(feedType, totalKg, date, units.join(', '));
    });
  }
  
  toast('✅ تم حفظ '+saved+' وحدة · '+date+(hasInventory?' · تم خصم العلف من المخزون':''));
  _feedSheetDate=date; show('tx-feeding');
}

function renderTxSampling(){
  var today=new Date().toISOString().slice(0,10);

  var liveRs=_txLiveRows().filter(function(r){return(r.fishNo||0)>0&&(farmFilter==='all'||r.farm===farmFilter);});
  var latestSamp={};
  getTX().filter(function(t){return t.type==='sampling';}).sort(function(a,b){return a.date>b.date?1:-1;}).forEach(function(t){if(!latestSamp[t.unit])latestSamp[t.unit]=t;});
  var h='';
  h+='<div class="ph"><div><h2>🔬 Sampling</h2><p style="font-size:11px;color:var(--muted)">'+savedDate+'</p></div>';

h+='<input type="date" id="sp-date" value="'+savedDate+'" onclick="try{this.showPicker()}catch(e){}" onchange="sheetChangeDate(\'samp\',this.value)" style="border:2px solid var(--teal);border-radius:10px;padding:9px 20px;font:inherit;font-size:14px;font-weight:700;color:var(--deep);background:#fff;cursor:pointer;min-width:170px;box-shadow:0 2px 6px rgba(0,0,0,.1);-webkit-appearance:none;appearance:none"/>';

  h+='</div></div>';

  h+='<div style="background:#edf4f1;display:grid;grid-template-columns:140px 90px 80px 70px 70px 70px 1fr;gap:0;border-bottom:2px solid var(--line);padding:9px 0;font-size:10px;font-weight:700;text-transform:uppercase;color:var(--muted)">';
  ['UNIT','AVG WT(g)','SAMPLE N','PREV WT','DAYS','SGR','NOTES'].forEach(function(c){h+='<div style="padding:0 8px">'+c+'</div>';});
  h+='</div>';
  liveRs.forEach(function(r,idx){
    var ls=latestSamp[r.unit];var bg=idx%2===0?'#fff':'#fafdfb';
    var prevWt=ls?ls.avgWt:(r.avgWt||0);
    h+='<div style="background:'+bg+';display:grid;grid-template-columns:140px 90px 80px 70px 70px 70px 1fr;gap:0;border-bottom:1px solid var(--line);align-items:center;min-height:38px">';
    h+='<div style="padding:0 8px;font-weight:700;font-size:12px;color:var(--teal)">'+r.unit+'</div>';
    h+='<div style="padding:4px 5px"><input type="number" class="sh-inp" id="sp-wt-'+r.unit+'" data-unit="'+r.unit+'" data-prev="'+prevWt+'" data-days="'+daysSince+'" placeholder="g" min="0" step="0.1" style="width:82px" oninput="sampCalcSGR(this)"/></div>';
    h+='<div style="padding:4px 5px"><input type="number" class="sh-inp" id="sp-n-'+r.unit+'" placeholder="30" min="1" style="width:65px"/></div>';
    var daysSince=ls?Math.max(1,Math.floor((new Date(_sampSheetDate||new Date().toISOString().slice(0,10))-new Date(ls.date))/86400000)):'—';
    h+='<div style="padding:0 8px;font-size:11px;color:var(--muted)">'+n(prevWt,1)+'</div>';
    h+='<div style="padding:0 8px;font-size:11px;color:var(--muted)">'+daysSince+'</div>';
    h+='<div style="padding:0 8px;font-size:12px;font-weight:700" id="sp-sgr-'+r.unit+'">—</div>';
    h+='<div style="padding:4px 5px"><input class="sh-inp-text" id="sp-notes-'+r.unit+'" placeholder="ملاحظات" style="width:100%"/></div>';
    h+='</div>';
  });
  h+='</div>';return h;
}

function sampCalcSGR(inputEl){
  var unit   = inputEl.dataset.unit;
  var prevWt = parseFloat(inputEl.dataset.prev)||0;
  var days   = parseFloat(inputEl.dataset.days)||0;
  var newWt  = parseFloat(inputEl.value)||0;
  var sgrEl  = document.getElementById('sp-sgr-'+unit);
  if(!sgrEl) return;
  if(!newWt||!prevWt||!days){ sgrEl.textContent='—'; sgrEl.style.color='var(--muted)'; return; }
  var sgr   = computeSGR(prevWt, newWt, days);
  var color = sgr>=1?'var(--green)':sgr>=0.5?'var(--amber)':'var(--red)';
  sgrEl.textContent = sgr.toFixed(3)+'%/day';
  sgrEl.style.color = color;
}

function sampSaveAll(){
  var date=document.getElementById('sp-date').value;
  var liveRs=_txLiveRows().filter(function(r){return(r.fishNo||0)>0&&(farmFilter==='all'||r.farm===farmFilter);});
  var saved=0;
  var latestSamp={};getTX().filter(function(t){return t.type==='sampling';}).sort(function(a,b){return a.date>b.date?1:-1;}).forEach(function(t){if(!latestSamp[t.unit])latestSamp[t.unit]=t;});
  liveRs.forEach(function(r){
    var el=document.getElementById('sp-wt-'+r.unit);var avgWt=parseFloat(el?el.value:0)||0;if(!avgWt)return;
    var sampleN=parseInt((document.getElementById('sp-n-'+r.unit)||{}).value)||0;
    var notes=(document.getElementById('sp-notes-'+r.unit)||{}).value||'';
    var biomass=(r.fishNo||0)*avgWt/1000;var sgr=0,fcr=0,daysSinceLast=0,feedSinceLast=0;
    var ls=latestSamp[r.unit];
    if(ls){
      daysSinceLast=Math.max(1,Math.floor((new Date(date)-new Date(ls.date))/86400000));
      sgr=computeSGR(ls.avgWt,avgWt,daysSinceLast);
      feedSinceLast=getTX().filter(function(t){return t.unit===r.unit&&t.type==='feeding'&&t.date>=ls.date&&t.date<=date;}).reduce(function(s,t){return s+(t.kg||0);},0);
      var wg=(avgWt-ls.avgWt)/1000*(r.fishNo||0);if(wg>0&&feedSinceLast>0)fcr=feedSinceLast/wg;
    }
    addTX({type:'sampling',date:date,unit:r.unit,avgWt:avgWt,sampleN:sampleN,biomass:biomass,sgr:sgr,fcr:fcr,daysSinceLast:daysSinceLast,feedSinceLast:feedSinceLast,notes:notes});saved++;
  });
  toast('✅ تم حفظ '+saved+' عينة');show('tx-sampling');
}

function getFarmList(){
  var farms = {'all': isAr?'كل المزارع':'All Farms'};
  var seen = {};
  var reg = getFarmsRegistry(); // {farmId: label}

  // 1. From RAW data
  RAW.forEach(function(r){ if(r.farm && !seen[r.farm]){ seen[r.farm]=1; } });

  // 2. From custom units — use stored farm field, NOT derived from name
  getFarmUnits().forEach(function(u){
    var fid = u.farm || '';
    // Only use prefix derivation if name clearly follows F#. pattern
    if(!fid && u.name && /^F\d+\./.test(u.name)){
      fid = u.name.match(/^(F\d+)/)[1];
    }
    if(fid && !seen[fid]){ seen[fid]=1; }
  });

  // 3. From farm registry (manually defined farms)
  Object.keys(reg).forEach(function(fid){ seen[fid]=1; });

  // Build sorted list with labels from registry
  Object.keys(seen).sort().forEach(function(fid){
    farms[fid] = reg[fid] || fid;
  });
  return farms;
}

// Count units per farm (RAW + custom)
function farmUnitCount(fid){
  if(fid==='all') return RAW.length + getFarmUnits().length;
  var rawCount = RAW.filter(function(r){return r.farm===fid;}).length;
  var customCount = getFarmUnits().filter(function(u){
    var uf = u.farm || (/^F\d+\./.test(u.name||'') ? (u.name.match(/^(F\d+)/)||['',''])[1] : '');
    return uf===fid;
  }).length;
  return rawCount + customCount;
}

  });
}

// returns true | false (token rejected) | 'network'
async function sbRefreshToken(force){
  var s = getSession();
  if(!s || !s.refresh_token) return false;
  if(!force && s.expires_at && Date.now() < s.expires_at - 60000){ SB_TOKEN = s.access_token; return true; }
  if(_refreshPromise) return _refreshPromise;
  _refreshPromise = (async function(){
    try{
      var d = await sbAuth('token?grant_type=refresh_token', {refresh_token: s.refresh_token});
      var cur = getSession() || s;
      cur.access_token  = d.access_token;
      cur.refresh_token = d.refresh_token || cur.refresh_token;
      cur.expires_at    = Date.now() + (d.expires_in || 3600) * 1000;
      setSession(cur);
      SB_TOKEN = cur.access_token;
      return true;
    }catch(e){
      return (e instanceof TypeError) ? 'network' : false;
    }finally{
      setTimeout(function(){ _refreshPromise = null; }, 0);
    }
  })();
  return _refreshPromise;
}

async function sbFetch(path, opts){
  var cfg = getSettings();
  var url = (SB_URL || cfg.sbUrl || '').replace(/\/+$/, '');
  var key = SB_KEY || cfg.sbKey || '';
  if(!url || !key) throw new Error('Supabase not configured');
  opts = opts || {};
  if(SB_TOKEN) await sbRefreshToken(false);
  function doFetch(){
    var extra = opts.headers || {};
    var hdrs = {'Content-Type':'application/json', 'apikey':key, 'Authorization':'Bearer ' + (SB_TOKEN || key)};
    var prefer = ['return=representation'];
    Object.keys(extra).forEach(function(k){
      if(k.toLowerCase() === 'prefer') prefer.push(extra[k]); else hdrs[k] = extra[k];
    });
    hdrs['Prefer'] = prefer.join(',');
    return fetch(url + '/rest/v1/' + path, Object.assign({}, opts, {headers: hdrs}));
  }
  var resp = await doFetch();
  if(resp.status === 401 && SB_TOKEN){
    var r = await sbRefreshToken(true);
    if(r === true) resp = await doFetch();
    else if(r === false){ handleSessionExpired(); throw new Error('انتهت الجلسة — سجل دخول تاني'); }
  }
  if(!resp.ok){
    var e = await resp.json().catch(function(){ return {}; });
    throw new Error(e.message || e.details || e.hint || ('SB ' + resp.status));
  }
  var t = await resp.text();
  return t ? JSON.parse(t) : [];
}

async function loadMyProfile(uid){
  try{
    var rows = await sbFetch('profiles?id=eq.' + encodeURIComponent(uid) + '&select=*');
    return {ok:true, profile: rows[0] || null};
  }catch(e){
    if(e instanceof TypeError) return {ok:false, network:true};
    var m = String(e.message || '').toLowerCase();
    if(m.indexOf('profiles') >= 0 || m.indexOf('schema cache') >= 0 || m.indexOf('does not exist') >= 0){
      return {ok:false, missingTable:true};
    }
    return {ok:false, error:e.message};
  }
}

  setTimeout(function(){ _expiredHandled = false; }, 3000);
}

// Restores cached session instantly (works offline)
async function restoreSession(){
  var s = getSession();
  if(!s || !s.user) return false;
  if(!s.refresh_token){ clearSession(); return false; } // old-format session → fresh login once
  currentUser = s.user; currentUserRole = s.role || 'viewer';
  SB_TOKEN = s.access_token; _legacyAuth = !!s.legacy;
  updateUserUI();
  return true;
}

// Background re-check: token + profile still valid
async function revalidateSession(){
  var s = getSession();
  if(!s) return;
  var r = await sbRefreshToken(false);
  if(r === 'network') return;
  if(r === false){ handleSessionExpired(); return; }
  var cur = getSession() || s;
  var acc = await resolveAccess(cur);
  if(acc.network) return;
  if(!acc.ok){ forceLogout(); toast('⛔ ' + acc.msg); return; }
  setSession(cur);
  currentUserRole = cur.role; _legacyAuth = !!cur.legacy;
  updateUserUI(); applyNavPerms();
  if(!canAccessView(currentView)) show(homeView());
}

function updateUserUI(){
  var badge = document.getElementById('user-badge');
  if(!badge) return;
  if(currentUser){
    var s = getSession() || {};
    var labels = {admin:'أدمن', manager:'مدير', engineer:'مهندس', worker:'عامل', viewer:'مشاهد'};
    var nm = s.name || (currentUser.email || '').split('@')[0];
    badge.innerHTML = '<span style="font-size:10px;opacity:.7">' + (labels[currentUserRole] || 'مستخدم') + '</span> <strong>' + daEsc(nm) + '</strong>'
      + (_legacyAuth ? ' <span title="أكمل إعداد الأمان" style="color:#fbbf24">⚠️</span>' : '');
    badge.onclick = function(){ show('account'); };
  }else{
    badge.innerHTML = '🔑 دخول';
    badge.onclick = function(){ show('login-page'); };
  }
}

async function sendRecoveryEmail(email){
  var redirect = location.origin + location.pathname;
  var r = await fetch(SB_URL + '/auth/v1/recover?redirect_to=' + encodeURIComponent(redirect), {
    method:'POST', headers:{'Content-Type':'application/json', 'apikey':SB_KEY}, body: JSON.stringify({email:email})
  });
  if(!r.ok){
    var d = await r.json().catch(function(){ return {}; });
    throw new Error(d.msg || d.error_description || d.message || ('recover ' + r.status));
  }
}

async function doForgotPassword(){
  var email = daVal('auth-email').trim();
  if(!email){ toast('⚠️ اكتب إيميلك في الخانة الأول'); return; }
  try{ await sendRecoveryEmail(email); toast('📧 لو الإيميل مسجل، هيوصلك رابط إعادة تعيين'); }
  catch(e){ toast('❌ ' + e.message); }
}

function daParseAuthHash(){
  var raw = (location.hash || '').replace(/^#/, '');
  if(!raw || raw.indexOf('=') < 0) return false;
  var p = {};
  raw.split('&').forEach(function(kv){
    var i = kv.indexOf('=');
    if(i > 0) p[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1).replace(/\+/g, ' '));
  });
  var clean = function(){ try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){} };
  if(p.error || p.error_description){
    clean();
    setTimeout(function(){ toast('❌ الرابط منتهي أو غير صالح — اطلب رابط جديد'); }, 400);
    return false;
  }
  if(p.type === 'recovery' && p.access_token){ _recoveryToken = p.access_token; clean(); return true; }
  return false;
}

async function setPasswordWithToken(token, pass){
  var r = await fetch(SB_URL + '/auth/v1/user', {
    method:'PUT',
    headers:{'Content-Type':'application/json', 'apikey':SB_KEY, 'Authorization':'Bearer ' + token},
    body: JSON.stringify({password:pass})
  });
  if(!r.ok){
    var d = await r.json().catch(function(){ return {}; });
    throw new Error(d.msg || d.error_description || d.message || ('update ' + r.status));
  }
}

function daCheckNewPass(p1, p2){
  if(p1.length < 6){ toast('⚠️ كلمة السر 6 حروف على الأقل'); return false; }
  if(p1 !== p2){ toast('⚠️ كلمتين السر مش متطابقين'); return false; }
  return true;
}

async function doResetPassword(){
  var p1 = daVal('rp-pass1'), p2 = daVal('rp-pass2');
  if(!daCheckNewPass(p1, p2)) return;
  try{

    _recoveryToken = null;
    toast('✅ تم تغيير كلمة السر — سجل دخول');
    show('login-page');

async function adminAddUser(){
  if(currentUserRole !== 'admin') return;
  var name = daVal('um-name').trim(), email = daVal('um-email').trim().toLowerCase();
  var pass = daVal('um-pass'), role = daVal('um-role') || 'worker';
  var perms = readPerms('perm-');
  if(!email || !pass){ toast('⚠️ البريد وكلمة السر مطلوبين'); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ toast('⚠️ البريد مش صحيح'); return; }
  if(pass.length < 6){ toast('⚠️ كلمة السر 6 حروف على الأقل'); return; }
  if(!SB_FARM_ID){ toast('⚠️ لازم تكون متصل بـ Supabase الأول'); return; }
  var btn = document.getElementById('um-add-btn');
  if(btn){ btn.disabled = true; btn.textContent = '⏳ جاري الإنشاء...'; }
  try{
    var r = await fetch(SB_URL + '/auth/v1/signup', {
      method:'POST', headers:{'Content-Type':'application/json', 'apikey':SB_KEY},
      body: JSON.stringify({email:email, password:pass, data:{full_name:name}})
    });
    var d = await r.json().catch(function(){ return {}; });
    if(!r.ok){
      var m = d.msg || d.error_description || d.message || ('signup ' + r.status);
      if(/already|registered|exists/i.test(m)) m = 'البريد ده مسجل قبل كده';
      throw new Error(m);
    }
    var u = d.user || d;
    if(!u || !u.id) throw new Error('تعذر إنشاء الحساب');
    if(Array.isArray(u.identities) && u.identities.length === 0) throw new Error('البريد ده مسجل قبل كده');
    await sbFetch('profiles', {method:'POST', body: JSON.stringify({
      id:u.id, email:email, name:name || email.split('@')[0], role:role, perms:perms, farm_id:SB_FARM_ID, active:true
    })});
    var needsConfirm = !(d.access_token || d.session);
    toast('✅ تم إنشاء حساب ' + email + (needsConfirm ? ' — لازم يأكد من بريده الأول' : ''));
    ['um-name','um-email','um-pass'].forEach(function(id){ var e = document.getElementById(id); if(e) e.value = ''; });
    adminLoadUsers();
  }catch(e){
    toast('❌ ' + ((e instanceof TypeError) ? 'تعذر الاتصال' : e.message));
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = '➕ إنشاء الحساب'; }
  }
}

async function adminToggleActive(id){

// ── storage: IndexedDB (no 5000 cap, no silent quota loss) ──
var TX_IDB = {db:null};
var _idbTimer = null, _idbPendingArr = null;
function txIdbOpen(){
  return new Promise(function(res){
    try{
      var rq = indexedDB.open('daraqua', 1);
      rq.onupgradeneeded = function(){ var db = rq.result; if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv'); };
      rq.onsuccess = function(){ TX_IDB.db = rq.result; res(true); };
      rq.onerror = function(){ res(false); };
    }catch(e){ res(false); }
  });
}
function idbGet(key){
  return new Promise(function(res){
    if(!TX_IDB.db) return res(null);
    try{ var g = TX_IDB.db.transaction('kv','readonly').objectStore('kv').get(key);
      g.onsuccess = function(){ res(g.result === undefined ? null : g.result); }; g.onerror = function(){ res(null); };
    }catch(e){ res(null); }
  });
}
function idbPutNow(key, val){
  return new Promise(function(res){
    if(!TX_IDB.db) return res(false);
    try{ var tx = TX_IDB.db.transaction('kv','readwrite'); tx.objectStore('kv').put(val, key);
      tx.oncomplete = function(){ res(true); }; tx.onerror = function(){ res(false); }; tx.onabort = function(){ res(false); };
    }catch(e){ res(false); }
  });
}
function idbFlush(){ if(_idbTimer){ clearTimeout(_idbTimer); _idbTimer = null; } if(_idbPendingArr){ var a = _idbPendingArr; _idbPendingArr = null; return idbPutNow('tx', a); } return Promise.resolve(true); }
document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'hidden') idbFlush(); });
window.addEventListener('pagehide', function(){ idbFlush(); });

async function txStoreInit(){
  var ok = await txIdbOpen();
  if(!ok){ console.warn('IndexedDB unavailable — localStorage fallback'); return; }
  var stored = await idbGet('tx');
  var ls = null; try{ ls = JSON.parse(localStorage.getItem(TX_KEY) || 'null'); }catch(e){}
  var arr = Array.isArray(stored) ? stored : [];
  if(Array.isArray(ls) && ls.length){
    var have = {}; arr.forEach(function(t){ have[t.id] = 1; });
    ls.forEach(function(t){ if(t && !have[t.id]) arr.push(t); });
  }
  _txCache = arr; _txMem = arr;
  var saved = await idbPutNow('tx', arr);
  if(saved){ try{ localStorage.removeItem(TX_KEY); }catch(e){} }
}

// _txMem is the authoritative in-memory store when IndexedDB is active.
// Legacy code sets _txCache = null to "reload from localStorage" — that must never drop data.
var _txMem = null;
function getTX(){
  if(TX_IDB.db && _txMem) return _txMem;
  if(_txCache) return _txCache;
  try{ _txCache = JSON.parse(localStorage.getItem(TX_KEY) || '[]'); return _txCache || []; }catch(e){ return []; }
}
function saveTX(arr){
  _txCache = arr;
  if(TX_IDB.db){
    _txMem = arr;
    _idbPendingArr = arr;
    if(!_idbTimer) _idbTimer = setTimeout(function(){ _idbTimer = null; idbFlush(); }, 150);
    return;
  }
  try{ localStorage.setItem(TX_KEY, JSON.stringify(arr)); }
  catch(e){
    console.warn('saveTX failed:', e);
    if(!window._txQuotaWarned){ window._txQuotaWarned = true; try{ toast('⚠️ مساحة المتصفح امتلت — البيانات بتترفع للسحابة بس'); }catch(_){} }
  }
}
function addTX(obj){
  var arr = getTX();
  obj.id = obj.id || (Date.now() + '_' + Math.random().toString(36).slice(2,6));
  obj.ts = obj.ts || new Date().toISOString();
  arr.push(obj);
  if(!TX_IDB.db && arr.length > 5000) arr.splice(0, arr.length - 5000);
  saveTX(arr);
  if(sbReady && SB_FARM_ID) _txUpsertOne(obj);
  return obj;
}

// ── feed inventory: stock = purchases − actual feeding TX ──
// (old code subtracted a negative number, so feeding INCREASED stock)
var _invMemo = {k:'', v:null};
function _invState(){
  var inv = getFeedInv(), tx = getTX();
  var key = inv.length + '|' + tx.length + '|' + (tx.length ? tx[tx.length-1].id : '') + '|' + (inv.length ? inv[inv.length-1].id : '');
  if(_invMemo.k === key && _invMemo.v) return _invMemo.v;
  var by = {};
  inv.forEach(function(e){
    var t = e.feedType || ''; if(!t) return;
    var kind = e.txType || e.entryType || 'purchase';
    if(kind === 'usage' || kind === 'out') return;          // legacy auto-deductions — usage now comes from feeding TX
    var b = by[t] = by[t] || {feedType:t, purchased:0, adjust:0, used:0, first:null};
    var kg = parseFloat(e.kg) || 0;
    if(kind === 'adjustment') b.adjust += kg; else b.purchased += Math.abs(kg);
    var d = String(e.date || '').slice(0,10);
    if(d && (!b.first || d < b.first)) b.first = d;
  });
  tx.forEach(function(t){
    if(t.type !== 'feeding' || !t.feed || !by[t.feed]) return;
    var b = by[t.feed];
    if(b.first && String(t.date||'') < b.first) return;
    b.used += parseFloat(t.kg) || 0;
  });
  Object.keys(by).forEach(function(k){ by[k].balance = by[k].purchased + by[k].adjust - by[k].used; });
  _invMemo = {k:key, v:by};
  return by;
}
function getFeedBalance(feedType){ var b = _invState()[feedType]; return b ? Math.max(0, b.balance) : 0; }
function getFeedBalanceSummary(){
  var s = _invState();
  return Object.keys(s).sort().map(function(k){ var b = s[k];
    return {feedType:k, purchased:+b.purchased.toFixed(2), used:+b.used.toFixed(2), balance:+b.balance.toFixed(2)}; });
}
function getAvailableFeedTypes(){ var s = _invState(); return Object.keys(s).filter(function(k){ return s[k].balance > 0; }).sort(); }

// ── validation rules ──
var _valCache = {t:0, map:{}};
function daLiveMap(){
  if(Date.now() - _valCache.t < 1500) return _valCache.map;
  var m = {}; _txLiveRows().forEach(function(r){ m[r.unit] = r; });
  _valCache = {t:Date.now(), map:m};
  return m;
}
function daExpectedDailyFeed(r){
  try{ var c = getSettings(r.farm); return (r.biomass||0) * getSFRAdjusted(r.avgWt||0, r.farm, c.waterTemp||28, c.waterDO||7) / 100; }
  catch(e){ return 0; }
}
function validateTX(t){
  var msgs = [], level = 'ok';
  function warn(m){ msgs.push('⚠️ '+m); if(level === 'ok') level = 'warn'; }
  function block(m){ msgs.push('⛔ '+m); level = 'block'; }
  var today = daToday();
  if(t.date){
    if(t.date > daAddDays(today, 1)) block('التاريخ في المستقبل ('+t.date+')');
    else if(t.date < daAddDays(today, -60)) warn('التاريخ أقدم من 60 يوم ('+t.date+')');
  }
  var r = t.unit ? daLiveMap()[t.unit] : null;
  var fish = r ? (r.fishNo||0) : 0;
  switch(t.type){
    case 'feeding':
      var kg = parseFloat(t.kg) || 0;
      if(kg <= 0){ block('كمية العلف لازم تكون أكبر من صفر'); break; }
      if(kg > 300) warn(kg+' كجم في إدخال واحد — رقم كبير جداً');
      if(r){
        var exp = daExpectedDailyFeed(r);
        var same = getTX().filter(function(x){ return x.type === 'feeding' && x.unit === t.unit && x.date === t.date; });
        var dayTot = same.reduce(function(s, x){ return s + (parseFloat(x.kg)||0); }, 0) + kg;
        if(exp > 0.05 && dayTot > exp * 2) warn('علف اليوم للوحدة '+dayTot.toFixed(1)+' كجم — أكتر من ضعف المتوقع ('+exp.toFixed(1)+' كجم)');
        if(t.meal && same.some(function(x){ return x.meal === t.meal; })) warn('وجبة "'+t.meal+'" متسجلة قبل كده لنفس اليوم');
      }
      break;
    case 'mortality':
      var c = parseInt(t.count) || 0;
      if(c <= 0){ block('عدد النفوق لازم يكون أكبر من صفر'); break; }
      if(fish > 0 && c > fish) block('النفوق ('+c+') أكبر من عدد السمك في الوحدة ('+fish+')');
      else if(fish > 0 && c > Math.max(20, fish * 0.05)) warn('نفوق '+c+' = '+(c/fish*100).toFixed(1)+'% من الوحدة في يوم واحد');
      break;
    case 'sampling':
      var w = parseFloat(t.avgWt) || 0;
      if(w <= 0){ block('متوسط الوزن لازم يكون أكبر من صفر'); break; }
      if(r && r.avgWt > 0){
        if(w < r.avgWt * 0.85) warn('الوزن نزل '+((1 - w/r.avgWt)*100).toFixed(0)+'% عن آخر وزن ('+r.avgWt.toFixed(0)+'g)');
        if(w > r.avgWt * 2.5) warn('الوزن '+w+'g أكتر من 2.5 ضعف آخر وزن ('+r.avgWt.toFixed(0)+'g) — اتأكد من الرقم');
      }
      break;
    case 'water_quality':
      var lim = {temp:[5,45,'الحرارة'], do:[0,25,'الأكسجين'], ph:[3,12,'pH'], ammonia:[0,50,'الأمونيا']};
      Object.keys(lim).forEach(function(k){
        if(t[k] === null || t[k] === undefined || t[k] === '') return;
        var v = parseFloat(t[k]); if(isNaN(v)) return;
        if(v < lim[k][0] || v > lim[k][1]) block(lim[k][2]+' = '+v+' — قيمة مستحيلة، غالباً غلط في الكتابة');
      });
      break;
    case 'harvesting':
      var hn = parseInt(t.fishNo) || 0;
      if(fish > 0 && hn > fish) block('عدد الحصاد ('+hn+') أكبر من عدد السمك ('+fish+')');
      var wd = getActiveWithdrawal(t.unit, t.date || today);
      if(wd) block('الوحدة في فترة سحب ('+wd.product+') لحد '+wd.until+' — ممنوع الحصاد');
      break;
    case 'transfer_out':
      var tn = parseInt(t.fishNo) || 0;
      if(fish > 0 && tn > fish) block('عدد النقل ('+tn+') أكبر من عدد السمك ('+fish+')');
      break;
  }
  return {level:level, msgs:msgs};
}

// ── audit stamp + validation gate on every new transaction ──
var _txHeld = [], _txHeldTimer = null;
var _addTXCore = addTX;
addTX = function(obj){
  if(!obj) return obj;
  if(currentUser){
    if(!obj.by) obj.by = currentUser.email;
    if(!obj.byName) obj.byName = (getSession() || {}).name || '';
    if(!obj.byRole) obj.byRole = currentUserRole;
  }
  if(!obj.at) obj.at = new Date().toISOString();
  if(obj.byRole === 'worker' && !obj.status) obj.status = 'pending';
  if(obj._skipValidation){ delete obj._skipValidation; return _addTXCore(obj); }
  var v = validateTX(obj);
  if(v.level === 'ok') return _addTXCore(obj);
  _txHeld.push({obj:obj, v:v});
  if(!_txHeldTimer) _txHeldTimer = setTimeout(showTxReviewModal, 60);
  return obj;
};

function showTxReviewModal(){
  _txHeldTimer = null;
  if(!_txHeld.length) return;
  var held = _txHeld.slice(); _txHeld = [];
  window._txHeldNow = held;
  var warnN = held.filter(function(x){ return x.v.level === 'warn'; }).length, blockN = held.length - warnN;
  var old = document.getElementById('tx-review-modal'); if(old) old.remove();
  var d = document.createElement('div'); d.id = 'tx-review-modal';
  d.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';
  var h = '<div style="background:#fff;color:#111;max-width:640px;width:100%;max-height:85vh;overflow:auto;border-radius:14px;padding:20px;direction:rtl">';
  h += '<div style="font-size:17px;font-weight:800;margin-bottom:4px">⚠️ '+held.length+' إدخال محتاج مراجعة قبل الحفظ</div>';
  h += '<div style="font-size:12px;color:#64748b;margin-bottom:14px">باقي الإدخالات اتحفظت عادي. '
    + (blockN ? '⛔ المرفوض مش هيتحفظ — صححه وادخله تاني. ' : '')
    + (warnN ? '⚠️ التحذيرات تقدر تحفظها لو متأكد، وهتتعلّم للمراجعة.' : '') + '</div>';
  held.forEach(function(x){
    var t = x.obj;
    h += '<div style="border:1px solid #e2e8f0;border-inline-start:4px solid '+(x.v.level === 'block' ? '#dc2626' : '#f59e0b')+';border-radius:8px;padding:10px;margin-bottom:8px">';
    h += '<div style="font-weight:700">'+(DA_TYPE[t.type] || daEsc(t.type))+' · '+daEsc(t.unit||'')+' · '+daEsc(t.date||'')+' — '+txSummary(t)+'</div>';
    h += '<div style="font-size:12px;margin-top:4px;line-height:1.7">'+x.v.msgs.map(daEsc).join('<br>')+'</div></div>';
  });
  h += '<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">';
  if(warnN) h += '<button id="txr-save" class="savebtn" style="width:auto;padding:10px 18px" onclick="txReviewSave()">✅ احفظ التحذيرات ('+warnN+')</button>';
  h += '<button id="txr-cancel" onclick="txReviewClose()" style="padding:10px 18px;border:1px solid #e2e8f0;background:#fff;border-radius:8px;font:inherit;cursor:pointer">'+(warnN ? '❌ متحفظش' : 'تمام')+'</button></div></div>';
  d.innerHTML = h;
  document.body.appendChild(d);
}
function txReviewClose(){ var m = document.getElementById('tx-review-modal'); if(m) m.remove(); window._txHeldNow = null; }
function txReviewSave(){
  var held = window._txHeldNow || [], n = 0;
  held.forEach(function(x){
    if(x.v.level !== 'warn') return;
    var t = x.obj; t.flagged = true; t.flagMsg = x.v.msgs.join(' · ');
    if(!t.status) t.status = 'pending';
    t._skipValidation = true; addTX(t); n++;
  });
  txReviewClose();

// ── edits keep history ──
function updateTX(id, changes){
  var arr = getTX(), t = null;
  for(var i = 0; i < arr.length; i++){ if(arr[i].id === id){ t = arr[i]; break; } }
  if(!t) return null;
  t.history = t.history || [];
  var meta = ['reviewedBy','reviewedAt','status','flagged','reviewedByName'];
  Object.keys(changes).forEach(function(k){
    if(String(t[k]) === String(changes[k])) return;
    if(meta.indexOf(k) < 0) t.history.push({f:k, from:t[k], to:changes[k], by:currentUser ? currentUser.email : '', at:new Date().toISOString()});
    t[k] = changes[k];
  });
  t.ts = new Date().toISOString();
  saveTX(arr);
  if(sbReady && SB_FARM_ID) _txUpsertOne(t);
  return t;
}

// ── deletes: engineers+ only, logged ──
var DEL_LOG_KEY = 'daracqua_audit_deletes_v1';
var _deleteTXCore = deleteTX;
deleteTX = function(id){
  if(currentUser && ['admin','manager','engineer'].indexOf(currentUserRole) < 0){ toast('⛔ الحذف للمهندس أو المدير بس'); return; }

      log.unshift({at:new Date().toISOString(), by:currentUser ? currentUser.email : '', tx:t});

// ── realtime: also pull edits made on other devices ──
function startRealtimeSync(){
  if(_realtimeInterval) return;
  _realtimeInterval = setInterval(async function(){
    if(!sbReady || !SB_FARM_ID || !navigator.onLine) return;
    try{
      var last = localStorage.getItem('daracqua_last_sync') || '2000-01-01T00:00:00Z';
      var since = new Date(new Date(last).getTime() - 5*60000).toISOString();   // 5-min overlap for clock skew
      var stamp = new Date().toISOString();
      var rows = await sbFetch('transactions?farm_id=eq.'+SB_FARM_ID+'&ts=gt.'+encodeURIComponent(since)+'&order=ts.asc&limit=500');
      localStorage.setItem('daracqua_last_sync', stamp);
      if(!rows || !rows.length) return;
      var local = getTX(), idx = {};
      local.forEach(function(t, i){ idx[t.id] = i; });
      var added = 0, updated = 0;
      rows.forEach(function(r){
        var d = r.data; if(!d || !d.id) return;
        if(idx[d.id] === undefined){ local.push(d); idx[d.id] = local.length - 1; added++; }
        else if((d.ts || '') > (local[idx[d.id]].ts || '')){ local[idx[d.id]] = d; updated++; }
      });
      if(added || updated){
        saveTX(local);
        if(added) toast('🔄 '+added+' معاملة جديدة من مستخدم آخر');
        if(['dashboard','site-overview','review-queue','audit-log'].indexOf(currentView) >= 0) show(currentView, true);
      }
    }catch(e){}
  }, 30000);
}

// ══════════════════════════════════════════════════════════
//  GROWTH PROJECTION (shared by RAS / forecast / supply plan)
// ══════════════════════════════════════════════════════════
var DA_BAND_SGR = [[50, 3.0], [150, 2.0], [300, 1.2], [1e9, 0.8]];   // default %/day by weight class
function daDefaultSGR(w){ for(var i = 0; i < DA_BAND_SGR.length; i++) if(w < DA_BAND_SGR[i][0]) return DA_BAND_SGR[i][1]; return 0.8; }
function daGrowthMaps(){
  var sgr = {}, mort = {}, since = daAddDays(daToday(), -30);
  getTX().forEach(function(t){
    if(t.type === 'sampling' && parseFloat(t.sgr) > 0 && (!sgr[t.unit] || t.date > sgr[t.unit].date)) sgr[t.unit] = {date:t.date, v:parseFloat(t.sgr)};
    if(t.type === 'mortality' && t.date >= since) mort[t.unit] = (mort[t.unit] || 0) + (parseInt(t.count) || 0);
  });
  return {sgr:sgr, mort:mort};
}
function daUnitSGR(r, maps){
  var s = maps.sgr[r.unit] ? maps.sgr[r.unit].v : 0;
  if(!(s > 0)) s = daDefaultSGR(r.avgWt || 0);
  return Math.min(5, Math.max(0.2, s));
}
function daUnitMort(r, maps){ var f = r.fishNo || 0; return f > 0 ? Math.min(0.01, (maps.mort[r.unit] || 0) / f / 30) : 0; }
// observed median SGR per weight class (falls back to defaults)
function daBandSGRObserved(maps){
  var buckets = DA_BAND_SGR.map(function(){ return []; });
  _txLiveRows().forEach(function(r){
    var s = maps.sgr[r.unit]; if(!s) return;
    for(var i = 0; i < DA_BAND_SGR.length; i++) if((r.avgWt||0) < DA_BAND_SGR[i][0]){ buckets[i].push(s.v); break; }
  });
  return DA_BAND_SGR.map(function(b, i){
    var a = buckets[i].filter(function(v){ return v > 0.1 && v < 6; }).sort(function(x, y){ return x - y; });
    return [b[0], a.length >= 3 ? a[Math.floor(a.length/2)] : b[1]];
  });
}
function daDaysToWeight(w0, w1, bands){
  if(w0 >= w1) return 0;
  var days = 0, w = Math.max(0.1, w0), lo = 0;
  for(var i = 0; i < bands.length && w < w1; i++){
    var hi = bands[i][0];
    if(w >= hi){ lo = hi; continue; }
    var end = Math.min(hi, w1);
    days += Math.log(end / w) / (bands[i][1] / 100);
    w = end; lo = hi;
  }
  return Math.ceil(days);
}
function daProject(r, days, o){
  var out = [], w = r.avgWt || 0, n = r.fishNo || 0, done = false;
  for(var d = 1; d <= days; d++){
    if(done){ out.push({d:d, wt:w, fish:0, bio:0, feed:0}); continue; }
    w = w * Math.exp(o.sgr / 100); n = n * (1 - o.mort);
    var sfr = 0; try{ sfr = getSFRAdjusted(w, r.farm, o.temp, o.doVal); }catch(e){}
    var bio = n * w / 1000;
    if(o.targetWt && w >= o.targetWt){ done = true; out.push({d:d, wt:w, fish:n, bio:bio, feed:0, harvest:true}); continue; }
    out.push({d:d, wt:w, fish:n, bio:bio, feed:bio * sfr / 100});
  }
  return out;
}
function daWater(farm){ var c = getSettings(farm); return {temp:c.waterTemp || 28, doVal:c.waterDO || 7}; }

// ══════════════════════════════════════════════════════════
//  PHASE 3 — RAS LOAD (TAN, O2, CO2, alkalinity)
// ══════════════════════════════════════════════════════════
var RAS_KEY = 'daracqua_ras_v1';
function daRasCfg(){
  var c = {}; try{ c = JSON.parse(localStorage.getItem(RAS_KEY) || '{}'); }catch(e){}
  return {protein: c.protein || 32, o2: c.o2 || 0.45, capacity: c.capacity || {}};
}
function daRasCompute(days){
  var cfg = daRasCfg(), maps = daGrowthMaps(), today = daToday();
  var farms = {};
  _txLiveRows().filter(function(r){ return (r.fishNo||0) > 0; }).forEach(function(r){
    var f = farms[r.farm] = farms[r.farm] || {farm:r.farm, units:0, bio:0, planned:0, actual:0, proj:[]};
    f.units++; f.bio += r.biomass || 0;
    f.planned += daExpectedDailyFeed(r);
    var wtr = daWater(r.farm);
    daProject(r, days || 14, {sgr:daUnitSGR(r, maps), mort:daUnitMort(r, maps), temp:wtr.temp, doVal:wtr.doVal}).forEach(function(p, i){
      f.proj[i] = (f.proj[i] || 0) + p.feed;
    });
  });
  getTX().forEach(function(t){
    if(t.type === 'feeding' && t.date === today && t.unit){ var fid = t.unit.split('.')[0]; if(farms[fid]) farms[fid].actual += parseFloat(t.kg) || 0; }
  });
  return Object.keys(farms).sort().map(function(k){
    var f = farms[k];
    f.feed = Math.max(f.planned, f.actual);
    f.tan = f.feed * cfg.protein / 100 * 0.092;          // kg TAN/day
    f.o2fish = f.feed * cfg.o2; f.o2nit = f.tan * 4.57; f.o2 = f.o2fish + f.o2nit;
    f.co2 = f.o2fish * 1.375;
    f.alk = f.tan * 7.14; f.bicarb = f.alk * 1.68;
    f.cap = parseFloat(cfg.capacity[k]) || 0;             // g TAN/day
    f.loadPct = f.cap > 0 ? f.tan * 1000 / f.cap * 100 : 0;
    f.projTan = f.proj.map(function(x){ return x * cfg.protein / 100 * 0.092 * 1000; });
    f.overDay = -1;
    if(f.cap > 0) for(var i = 0; i < f.projTan.length; i++) if(f.projTan[i] > f.cap * 0.9){ f.overDay = i + 1; break; }
    return f;
  });
}
function rasSaveCfg(){
  var cfg = daRasCfg();
  cfg.protein = parseFloat(daVal('ras-protein')) || 32;
  cfg.o2 = parseFloat(daVal('ras-o2')) || 0.45;
  daFarms().forEach(function(f){ cfg.capacity[f] = parseFloat(daVal('ras-cap-'+f)) || 0; });
  try{ localStorage.setItem(RAS_KEY, JSON.stringify(cfg)); }catch(e){}
  toast('✅ اتحفظت إعدادات الـ RAS'); show('ras-load', true);
}

  h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px">';
  h += '<div class="field"><label>بروتين العلف %</label>'+daInp('ras-protein', cfg.protein, 'type="number" step="0.5"')+'</div>';

  daFarms().forEach(function(f){ h += '<div class="field"><label>سعة فلتر '+daEsc(f)+' (جم TAN/يوم)</label>'+daInp('ras-cap-'+f, cfg.capacity[f] || '', 'type="number" placeholder="مثلاً 1500"')+'</div>'; });
  h += '</div><button class="savebtn" style="width:auto;padding:8px 18px;margin-top:10px" onclick="rasSaveCfg()">💾 حفظ</button></div>';
  data.forEach(function(f){
    var col = f.cap <= 0 ? 'var(--muted)' : f.loadPct >= 100 ? 'var(--red)' : f.loadPct >= 85 ? 'var(--amber)' : 'var(--green)';
    h += '<div class="card" style="margin-bottom:14px;border-top:4px solid '+col+'">';
    h += '<div class="card-title">🏭 '+daEsc(f.farm)+' — '+f.units+' وحدة · '+(f.bio/1000).toFixed(2)+' طن</div>';
    h += daGrid([
      daKpi('🌾','علف/يوم (التصميم)', f.feed.toFixed(1)+' كجم', 'var(--deep)', 'مخطط '+f.planned.toFixed(1)+' · فعلي النهارده '+f.actual.toFixed(1)),
      daKpi('☣️','TAN', (f.tan*1000).toFixed(0)+' جم/يوم', col, f.cap > 0 ? f.loadPct.toFixed(0)+'% من سعة الفلتر' : 'حدد سعة الفلتر'),
      daKpi('💨','أكسجين مطلوب', f.o2.toFixed(1)+' كجم/يوم', 'var(--teal)', 'سمك '+f.o2fish.toFixed(1)+' + نترتة '+f.o2nit.toFixed(1)),
      daKpi('🫧','CO₂ ناتج', f.co2.toFixed(1)+' كجم/يوم', 'var(--deep)'),
      daKpi('🧂','بيكربونات صوديوم', f.bicarb.toFixed(1)+' كجم/يوم', 'var(--amber)', 'لتعويض '+f.alk.toFixed(1)+' كجم قلوية')
    ], 140);
    if(f.cap > 0){
      var mx = Math.max.apply(null, f.projTan.concat([f.cap])) || 1;
      h += '<div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px">📈 TAN المتوقع — 14 يوم (الخط = 90% من السعة)</div>';

}

var PLAN_KEY = 'daracqua_plan_v1';
function daPlanCfg(){
  var c = {}; try{ c = JSON.parse(localStorage.getItem(PLAN_KEY) || '{}'); }catch(e){}
  return {
    bands: c.bands || [{max:50, label:'1mm', inv:''}, {max:150, label:'2mm', inv:''}, {max:100000, label:'3mm', inv:''}],
    horizon: c.horizon || 30, bagKg: c.bagKg || 25, safety: c.safety || 7, lead: c.lead || 7,
    weekly: c.weekly || 0, targetWt: c.targetWt || (getSettings().harvestTargetWt || 450),
    fryWt: c.fryWt || 5, survival: c.survival || 85
  };
}
function daSavePlan(c){ try{ localStorage.setItem(PLAN_KEY, JSON.stringify(c)); }catch(e){} }
function daFeedForecast(cfg){
  cfg = cfg || daPlanCfg();
  var maps = daGrowthMaps(), H = cfg.horizon;
  var bands = cfg.bands.map(function(b){ return {max:b.max, label:b.label, inv:b.inv, daily:new Array(H).fill(0)}; });
  daRows().forEach(function(r){
    var w = daWater(r.farm);
    daProject(r, H, {sgr:daUnitSGR(r, maps), mort:daUnitMort(r, maps), temp:w.temp, doVal:w.doVal, targetWt:cfg.targetWt}).forEach(function(p){
      if(!p.feed) return;
      for(var i = 0; i < bands.length; i++) if(p.wt < bands[i].max || i === bands.length - 1){ bands[i].daily[p.d - 1] += p.feed; break; }
    });
  });
  bands.forEach(function(b){
    b.total = b.daily.reduce(function(s, x){ return s + x; }, 0);
    b.avg7 = b.daily.slice(0, 7).reduce(function(s, x){ return s + x; }, 0) / 7;
    b.weeks = [0, 1, 2, 3].map(function(k){ return b.daily.slice(k*7, k*7+7).reduce(function(s, x){ return s + x; }, 0); });
    b.stock = b.inv ? getFeedBalance(b.inv) : null;
    b.cover = (b.stock !== null && b.avg7 > 0) ? b.stock / b.avg7 : null;
    var need = b.total + b.avg7 * cfg.safety;
    b.order = b.stock === null ? Math.ceil(need / cfg.bagKg) * cfg.bagKg : Math.max(0, Math.ceil((need - b.stock) / cfg.bagKg) * cfg.bagKg);
    b.orderBy = b.cover === null ? null : daAddDays(daToday(), Math.max(0, Math.floor(b.cover - cfg.lead)));
  });
  return bands;
}

  c.bands = c.bands.map(function(b, i){ return {max: parseFloat(daVal('ff-max-'+i)) || b.max, label: daVal('ff-lbl-'+i) || b.label, inv: daVal('ff-inv-'+i)}; });

}

function spSave(){
  var c = daPlanCfg();
  c.weekly = parseFloat(daVal('sp-weekly')) || 0; c.targetWt = parseFloat(daVal('sp-target')) || 450;
  c.fryWt = parseFloat(daVal('sp-fry')) || 5; c.survival = Math.min(100, Math.max(10, parseFloat(daVal('sp-surv')) || 85));
  daSavePlan(c); toast('✅ اتحفظ'); show('supply-plan', true);
}
function daSupplyPlan(c){
  var maps = daGrowthMaps(), bands = daBandSGRObserved(maps), W = 16, today = daToday();
  var weeks = []; for(var i = 0; i < W; i++) weeks.push({i:i, start:daAddDays(today, i*7), kg:0, units:[]});
  var later = 0;
  daRows().forEach(function(r){
    var days = daDaysToWeight(r.avgWt || 0, c.targetWt, bands);
    var m = daUnitMort(r, maps), fish = (r.fishNo || 0) * Math.pow(1 - m, days), kg = fish * c.targetWt / 1000;
    var wk = Math.floor(days / 7);
    if(wk < W){ weeks[wk].kg += kg; weeks[wk].units.push(r.unit); } else later += kg;
  });
  var growDays = daDaysToWeight(c.fryWt, c.targetWt, bands), growWeeks = Math.ceil(growDays / 7);
  var sugg = [];
  if(c.weekly > 0) weeks.forEach(function(w){
    var gap = c.weekly - w.kg; if(gap <= c.weekly * 0.1) return;
    if(w.i < growWeeks) sugg.push({week:w, gap:gap, late:true});
    else sugg.push({week:w, gap:gap, stockDate:daAddDays(w.start, -growDays), fry:Math.ceil(gap / (c.targetWt/1000) / (c.survival/100))});
  });
  return {weeks:weeks, later:later, growDays:growDays, growWeeks:growWeeks, sugg:sugg, bands:bands};
}

  });
  return best;
}

function daExtraAlerts(){

  daRows().forEach(function(r){

  });
  daRasCompute(14).forEach(function(f){
    if(f.cap > 0 && f.loadPct >= 90) out.push({level:f.loadPct >= 100 ? 'critical' : 'warn', icon:'🧪', title:'حمل الفلتر الحيوي', unit:'', section:f.farm, msg:f.farm+': الأمونيا '+f.loadPct.toFixed(0)+'% من سعة الفلتر'});

  });
  var c = daPlanCfg();
  if(c.bands.some(function(b){ return b.inv; })){
    daFeedForecast(c).forEach(function(b){
      if(b.cover !== null && b.cover < c.lead + 2) out.push({level:b.cover < c.lead ? 'critical' : 'warn', icon:'📦', title:'مخزون العلف', unit:'', section:'', msg:'علف '+b.label+' يكفي '+b.cover.toFixed(1)+' يوم — مدة التوريد '+c.lead+' يوم'});

}

var TENANT_KEY = 'daracqua_tenant';
var DA_KEEP_KEYS = {'daracqua_session_v1':1, 'daracqua_theme':1, 'daracqua_tenant':1};
var DA_SYNC_PREFIXES = ['daracqua_settings_v2','daracqua_farms_registry_v1','daracqua_farm_units_v1','daracqua_so_cols_v1',
  'daracqua_ras_v1','daracqua_plan_v1','daracqua_notif_enabled','daracqua_logs_v2'];
function daIsSyncedKey(k){ return DA_SYNC_PREFIXES.some(function(p){ return String(k).indexOf(p) === 0; }); }

// ── per-farm settings live in the cloud (shared by all devices of the farm) ──
var _lsSetRaw = Storage.prototype.setItem, _lsRemoveRaw = Storage.prototype.removeItem;
var _settingsPushTimer = null, _settingsPulling = false;
Storage.prototype.setItem = function(k, v){
  _lsSetRaw.call(this, k, v);
  if(this === window.localStorage && !_settingsPulling && daIsSyncedKey(k)) daScheduleSettingsPush();
};
Storage.prototype.removeItem = function(k){
  _lsRemoveRaw.call(this, k);
  if(this === window.localStorage && !_settingsPulling && daIsSyncedKey(k)) daScheduleSettingsPush();
};
function daScheduleSettingsPush(){ if(_settingsPushTimer) clearTimeout(_settingsPushTimer); _settingsPushTimer = setTimeout(daPushSettings, 1500); }
async function daPushSettings(){
  _settingsPushTimer = null;
  if(!sbReady || !SB_FARM_ID || !currentUser) return;
  var data = {};
  for(var i = 0; i < localStorage.length; i++){ var k = localStorage.key(i); if(daIsSyncedKey(k)) data[k] = localStorage.getItem(k); }
  try{ await sbFetch('farm_settings', {method:'POST', headers:{'Prefer':'resolution=merge-duplicates'}, body: JSON.stringify({farm_id:SB_FARM_ID, data:data, ts:new Date().toISOString()})}); }
  catch(e){ console.warn('settings push:', e.message); }
}
async function daPullSettings(){
  if(!SB_FARM_ID) return;
  var rows = await sbFetch('farm_settings?farm_id=eq.' + encodeURIComponent(SB_FARM_ID) + '&select=data');
  if(!rows.length){ daScheduleSettingsPush(); return; }
  var d = rows[0].data || {};
  _settingsPulling = true;
  try{ Object.keys(d).forEach(function(k){ if(daIsSyncedKey(k)) localStorage.setItem(k, d[k]); }); }
  finally{ _settingsPulling = false; }
  _unitsCache = null;
}

function daSetRAW(list){ RAW.length = 0; (list || []).forEach(function(u){ if(u && u.unit) RAW.push(u); }); _valCache = {t:0, map:{}}; }
async function daLoadUnitsCache(){ var u = await idbGet('units'); if(Array.isArray(u)) daSetRAW(u); }
function daPersistUnitsLocal(){ return idbPutNow('units', RAW.map(function(u){ return Object.assign({}, u); })); }

// ── device isolation: data of one farm never leaks into another ──
async function daWipeLocalTenant(){
  if(_settingsPushTimer){ clearTimeout(_settingsPushTimer); _settingsPushTimer = null; }
  var keys = []; for(var i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i));
  keys.forEach(function(k){ if(String(k).indexOf('daracqua_') === 0 && !DA_KEEP_KEYS[k]) _lsRemoveRaw.call(localStorage, k); });
  _txCache = null; _txMem = []; _unitsCache = null; _feedInvCache = null;
  _invMemo = {k:'', v:null}; _valCache = {t:0, map:{}};

  if(TX_IDB.db){ _idbPendingArr = null; if(_idbTimer){ clearTimeout(_idbTimer); _idbTimer = null; } await idbPutNow('tx', []); await idbPutNow('units', []); }
}
async function daEnsureTenant(fid){

// ── access: licence check + platform owner flag ──
async function resolveAccess(sess){
  var md = (sess.user && sess.user.user_metadata) || {};
  var pr = await loadMyProfile(sess.user.id);
  if(pr.ok){
    if(!pr.profile) return {ok:false, msg:'حسابك مش مفعّل — تواصل مع الأدمن'};
    if(pr.profile.active === false) return {ok:false, msg:'حسابك موقوف — تواصل مع الأدمن'};
    sess.role = pr.profile.role || 'viewer';
    sess.perms = Array.isArray(pr.profile.perms) ? pr.profile.perms : [];
    sess.name = pr.profile.name || md.full_name || '';
    sess.farm_id = pr.profile.farm_id || null;
    sess.legacy = false;
    if(!sess.farm_id) return {ok:false, msg:'حسابك مش مربوط بمزرعة — تواصل مع الأدمن'};
    var fr = null;
    try{ fr = await sbFetch('farms?id=eq.' + encodeURIComponent(sess.farm_id) + '&select=*'); }
    catch(e){ if(e instanceof TypeError) return {ok:false, network:true, msg:'تعذر الاتصال بالسيرفر'}; }
    if(fr){
      var f = fr[0];
      if(!f || f.active === false || (f.expires_at && f.expires_at < daToday())) return {ok:false, msg:'اشتراك المزرعة موقوف أو انتهى — تواصل مع مزود الخدمة'};
      sess.farm_name = f.name || ''; sess.farm_expires = f.expires_at || null;
    }
    try{ sess.platform = (await sbFetch('rpc/am_platform_admin', {method:'POST', body:'{}'})) === true; }catch(e){ sess.platform = false; }
    return {ok:true};
  }
  if(pr.missingTable){
    sess.role = 'admin'; sess.perms = []; sess.name = md.full_name || ''; sess.farm_id = null; sess.legacy = true; sess.platform = false;
    return {ok:true};
  }
  if(pr.network) return {ok:false, network:true, msg:'تعذر الاتصال بالسيرفر'};
  return {ok:false, msg: pr.error || 'تعذر التحقق من الصلاحيات'};
}

async function doLogin(){
  var email = daVal('auth-email').trim().toLowerCase();
  var pass = daVal('auth-pass');
  if(!email || !pass){ toast('⚠️ ادخل الإيميل وكلمة السر'); return; }
  var btn = document.getElementById('auth-btn');
  if(btn){ btn.disabled = true; btn.textContent = '⏳ جاري الدخول...'; }
  try{
    var data = await sbAuth('token?grant_type=password', {email:email, password:pass});
    var u = data.user || {};
    var sess = {access_token:data.access_token, refresh_token:data.refresh_token,
      expires_at: Date.now() + (data.expires_in || 3600) * 1000,
      user:{id:u.id, email:u.email || email, user_metadata:u.user_metadata || {}}};
    SB_TOKEN = sess.access_token; setSession(sess);
    var acc = await resolveAccess(sess);
    if(!acc.ok){ SB_TOKEN = null; clearSession(); throw new Error(acc.msg); }
    setSession(sess);
    await daEnsureTenant(sess.farm_id);
    currentUser = sess.user; currentUserRole = sess.role; _legacyAuth = !!sess.legacy;
    try{ await sbFetch('rpc/touch_login', {method:'POST', body:'{}'}); }catch(e){}
    updateUserUI();
    show(homeView());
    toast('✅ أهلاً ' + (sess.name || sess.user.email.split('@')[0]));
    startCloudSync();
  }catch(err){
    var msg = (err instanceof TypeError) ? 'تعذر الاتصال — اتأكد من الإنترنت' : err.message;
    if(/invalid login|invalid_grant|credentials/i.test(msg)) msg = 'الإيميل أو كلمة السر غلط';
    toast('❌ ' + msg);
    if(btn){ btn.disabled = false; btn.textContent = '🔑 دخول'; }
  }
}

async function doLogout(skipConfirm){
  var q = []; try{ q = getOfflineQueue(); }catch(e){}
  if(q.length && sbReady){ try{ await syncOfflineQueue(); q = getOfflineQueue(); }catch(e){} }
  if(!skipConfirm){
    var msg = q.length ? '⚠️ فيه ' + q.length + ' عملية لسه متزامنتش مع السحابة وهتضيع لو خرجت. تخرج برضه؟' : 'تسجيل خروج؟';
    if(!confirm(msg)) return;
  }
  try{ await idbFlush(); }catch(e){}

}

async function startCloudSync(){

    var safe = function(fn){ try{ return Promise.resolve(fn()).catch(function(e){ console.warn(e); }); }catch(e){ return Promise.resolve(); } };
    await safe(daPullSettings);
    await safe(loadUnitsFromCloud);
    await Promise.all([safe(loadTXFromSB), safe(loadFeedInvFromSB), safe(loadSnapshotsFromSB)]);

  }catch(e){ console.warn('cloud sync:', e.message); _cloudStarted = false; }

function daPad(n){ return (n < 10 ? '0' : '') + n; }
function daParseDate(v){
  if(v === null || v === undefined || v === '') return '';
  if(typeof v === 'number' && v > 20000 && v < 80000) return new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10);
  var s = String(v).trim(), m;
  if((m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) return m[1] + '-' + daPad(+m[2]) + '-' + daPad(+m[3]);
  if((m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/))) return m[3] + '-' + daPad(+m[2]) + '-' + daPad(+m[1]);
  return null;
}

function daSheetRows(wb, def){
  var name = wb.SheetNames.filter(function(n){ var l = n.toLowerCase(); return def.match.some(function(m){ return l.indexOf(m) >= 0; }); })[0];
  if(!name) return null;
  var aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:''});
  if(!aoa.length) return {name:name, rows:[]};
  var labels = {}; def.cols.forEach(function(c){ labels[c[0]] = c[0]; labels[c[1]] = c[0]; });
  var keys = aoa[0].map(function(hd){
    var s = String(hd).replace(/\*/g, '').trim();
    var k = s.split('|')[0].trim().toLowerCase();
    if(labels[k]) return labels[k];
    var ar = (s.split('|')[1] || '').trim();
    return labels[ar] || labels[s] || null;
  });
  var rows = [];
  for(var i = 1; i < aoa.length; i++){
    var r = aoa[i], o = {_row: i + 1}, any = false;
    keys.forEach(function(k, j){ if(!k) return; var v = r[j]; if(v !== '' && v !== null && v !== undefined){ o[k] = v; any = true; } });
    if(any) rows.push(o);
  }
  return {name:name, rows:rows};
}
function daParseImport(wb){

  function err(sheet, row, msg){ out.errors.push(sheet + ' — صف ' + row + ': ' + msg); }
  var us = daSheetRows(wb, DA_IMPORT.units), seen = {};
  if(us) us.rows.forEach(function(r){
    var unit = String(r.unit || '').trim();
    if(!unit) return err(us.name, r._row, 'اسم الوحدة فاضي');
    if(seen[unit]) return err(us.name, r._row, 'الوحدة "' + unit + '" متكررة');
    var d = daParseDate(r.start_date), fish = parseInt(r.fish_no, 10), wt = parseFloat(r.avg_wt), vol = parseFloat(r.volume) || 10;
    if(!d) return err(us.name, r._row, 'تاريخ التخزين مش صحيح');
    if(d > maxDate) return err(us.name, r._row, 'تاريخ التخزين في المستقبل');
    if(!(fish > 0)) return err(us.name, r._row, 'عدد السمك لازم يكون رقم أكبر من صفر');
    if(!(wt > 0)) return err(us.name, r._row, 'متوسط الوزن لازم يكون رقم أكبر من صفر');

    var site = String(r.site || (unit.indexOf('.') > 0 ? unit.split('.')[0] : 'F1')).trim();
    var sec = String(r.section || (/T\d+$/i.test(unit) ? unit.replace(/T\d+$/i, '') : site)).trim();
    var bio = fish * wt / 1000;
    out.units.push({unit:unit, farm:site, section:sec, batch:String(r.batch || ''), species:String(r.species || 'Silver Tilapia'),
      hatchery:String(r.hatchery || ''), startDate:d, fishNo:fish, startWt:wt, avgWt:wt, biomass:bio, density:bio / vol, volume:vol,
      mortality:0, survival:100, feedKg:0, alarm:false, warn:false});
  });
  var known = {}; RAW.forEach(function(u){ known[u.unit] = u; }); out.units.forEach(function(u){ known[u.unit] = u; });
  out.units.forEach(function(u){ if(RAW.some(function(x){ return x.unit === u.unit; })) out.warnings.push('الوحدة ' + u.unit + ' موجودة — بياناتها هتتحدث'); });
  var seq = 0, occ = {};

    var unit = String(r.unit || '').trim(), d = daParseDate(r.date);
    if(!unit || !known[unit]){ err(sheet, r._row, 'الوحدة "' + unit + '" مش موجودة في شيت الوحدات'); return null; }
    if(!d){ err(sheet, r._row, 'التاريخ مش صحيح'); return null; }
    if(d > maxDate){ err(sheet, r._row, 'التاريخ في المستقبل'); return null; }
    var key = type + '|' + unit + '|' + d; occ[key] = (occ[key] || 0) + 1;

      ts: new Date(Date.parse(d + 'T00:00:00Z') + 43200000 + (seq++)).toISOString(), source:'import', status:'approved'}, who, extra);
    out.tx.push(t); return t;
  }
  var fs_ = daSheetRows(wb, DA_IMPORT.feeding);
  if(fs_) fs_.rows.forEach(function(r){ var kg = parseFloat(r.kg); if(!(kg > 0)) return err(fs_.name, r._row, 'الكمية لازم تكون أكبر من صفر');
    mk('feeding', r, {kg:kg, feed:String(r.feed_type || ''), meal:String(r.meal || '')}, fs_.name); });
  var ms = daSheetRows(wb, DA_IMPORT.mortality);
  if(ms) ms.rows.forEach(function(r){ var c = parseInt(r.count, 10); if(!(c > 0)) return err(ms.name, r._row, 'العدد لازم يكون أكبر من صفر');
    mk('mortality', r, {count:c, cause:String(r.cause || '')}, ms.name); });
  var ws = daSheetRows(wb, DA_IMPORT.water);
  if(ws) ws.rows.forEach(function(r){
    var vals = {}, ok = false, bad = false, lim = {temp:[5,45], do:[0,25], ph:[3,12], ammonia:[0,50]};
    Object.keys(lim).forEach(function(k){ if(r[k] === undefined) return; var v = parseFloat(r[k]); if(isNaN(v)) return; if(v < lim[k][0] || v > lim[k][1]) bad = true; vals[k] = v; ok = true; });
    if(!ok) return err(ws.name, r._row, 'مفيش ولا قراءة');
    if(bad) return err(ws.name, r._row, 'فيه قراءة مستحيلة');
    mk('water_quality', r, vals, ws.name);
  });
  var ss = daSheetRows(wb, DA_IMPORT.sampling), samples = [];
  if(ss) ss.rows.forEach(function(r){ var w = parseFloat(r.avg_wt); if(!(w > 0)) return err(ss.name, r._row, 'الوزن لازم يكون أكبر من صفر');
    var t = mk('sampling', r, {avgWt:w, sampleN: parseInt(r.sample_n, 10) || 0}, ss.name); if(t) samples.push(t); });
  // SGR between consecutive samples per unit (first one vs. stocking weight)
  var byUnit = {}; samples.forEach(function(t){ (byUnit[t.unit] = byUnit[t.unit] || []).push(t); });
  Object.keys(byUnit).forEach(function(u){
    var prev = {w: known[u].startWt || known[u].avgWt, d: known[u].startDate};
    byUnit[u].sort(function(a, b){ return a.date > b.date ? 1 : -1; }).forEach(function(t){
      var days = prev.d ? daDaysBetween(prev.d, t.date) : 0;
      if(days > 0 && prev.w > 0){ try{ t.sgr = +computeSGR(prev.w, t.avgWt, days).toFixed(3); }catch(e){} }

  if(!us && !RAW.length) out.errors.unshift('مفيش شيت وحدات (Units) — وده مطلوب لأول استيراد');

}
function daImportFile(input){
  var f = input.files && input.files[0]; if(!f) return;
  if(typeof XLSX === 'undefined'){ toast('❌ مكتبة Excel مش محملة'); return; }
  var rd = new FileReader();
  rd.onload = function(e){
    try{ daShowImportPreview(daParseImport(XLSX.read(new Uint8Array(e.target.result), {type:'array'}))); }
    catch(ex){ toast('❌ الملف مش مقروء: ' + ex.message); }
  };
  rd.readAsArrayBuffer(f);
}
function daShowImportPreview(p){
  window._impParsed = p;
  var el = document.getElementById('imp-preview'); if(!el) return;
  var nTx = p.tx.length, nU = p.units.length;
  var h = '<div style="margin-top:12px;padding:14px;border-radius:10px;background:var(--light)">';
  h += '<div style="font-weight:800;margin-bottom:8px">📋 معاينة قبل الاستيراد</div>';
  h += daGrid([daKpi('🏊','وحدات', nU), daKpi('🌾','تغذية', p.counts.feeding || 0), daKpi('💀','نفوق', p.counts.mortality || 0),
    daKpi('🔬','عينات', p.counts.sampling || 0), daKpi('💧','مياه', p.counts.water_quality || 0),
    daKpi('⛔','أخطاء', p.errors.length, p.errors.length ? 'var(--red)' : 'var(--green)')], 100);
  if(p.errors.length) h += '<div style="color:var(--red);font-size:12px;line-height:1.8;max-height:180px;overflow:auto;margin-bottom:8px"><b>الصفوف دي مش هتتستورد:</b><br>'
    + p.errors.slice(0, 50).map(daEsc).join('<br>') + (p.errors.length > 50 ? '<br>… و' + (p.errors.length - 50) + ' تانيين' : '') + '</div>';
  if(p.warnings.length) h += '<div style="color:#b45309;font-size:12px;line-height:1.8;margin-bottom:8px">' + p.warnings.slice(0, 20).map(daEsc).join('<br>') + '</div>';
  if(nTx || nU) h += '<button id="imp-go" class="savebtn" style="width:auto;padding:10px 22px" onclick="daRunImport()">✅ استورد ' + (nU ? nU + ' وحدة' : '') + (nU && nTx ? ' و' : '') + (nTx ? nTx.toLocaleString() + ' عملية' : '') + (p.errors.length ? ' (وتجاهل الأخطاء)' : '') + '</button>';
  else h += '<div style="color:var(--muted)">مفيش صفوف صالحة للاستيراد.</div>';
  el.innerHTML = h + '</div>';
}
async function daRunImport(){
  var p = window._impParsed; if(!p) return;
  var btn = document.getElementById('imp-go'); if(btn){ btn.disabled = true; btn.textContent = '⏳ جاري الاستيراد...'; }
  try{
    if(p.units.length){
      var idx = {}; RAW.forEach(function(u, i){ idx[u.unit] = i; });
      p.units.forEach(function(u){ if(idx[u.unit] !== undefined) RAW[idx[u.unit]] = u; else RAW.push(u); });
      _valCache = {t:0, map:{}};
      await daPersistUnitsLocal();
      await saveUnitsToCloud(p.units);
    }
    if(p.tx.length){
      var arr = getTX(), ix = {};
      arr.forEach(function(t, i){ ix[t.id] = i; });
      p.tx.forEach(function(t){ if(ix[t.id] !== undefined) arr[ix[t.id]] = t; else arr.push(t); });
      saveTX(arr); await idbFlush();
      if(sbReady && SB_FARM_ID) await _txSyncToSB(p.tx);
    }
    _invMemo = {k:'', v:null};
    window._impParsed = null;
    toast('✅ اتستورد ' + p.units.length + ' وحدة و' + p.tx.length.toLocaleString() + ' عملية');
    show('farm-setup', true);
  }catch(e){ toast('❌ ' + e.message); if(btn){ btn.disabled = false; btn.textContent = '✅ استورد'; } }
}
function daExportBackup(){
  if(typeof XLSX === 'undefined'){ toast('❌ مكتبة Excel مش محملة'); return; }
  var wb = XLSX.utils.book_new(), tx = getTX();
  function sheet(key, rows){ var d = DA_IMPORT[key]; var head = d.cols.map(function(c){ return c[0] + ' | ' + c[1]; });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([head].concat(rows)), d.sheet); }
  sheet('units', RAW.map(function(u){ return [u.unit, u.farm, u.section, u.batch || '', u.species || '', u.hatchery || '', u.startDate || '', u.fishNo, u.startWt || u.avgWt, u.volume || 10]; }));
  sheet('feeding', tx.filter(function(t){ return t.type === 'feeding'; }).map(function(t){ return [t.date, t.unit, t.kg, t.feed || '', t.meal || '']; }));
  sheet('mortality', tx.filter(function(t){ return t.type === 'mortality'; }).map(function(t){ return [t.date, t.unit, t.count, t.cause || '']; }));
  sheet('sampling', tx.filter(function(t){ return t.type === 'sampling'; }).map(function(t){ return [t.date, t.unit, t.avgWt, t.sampleN || '']; }));
  sheet('water', tx.filter(function(t){ return t.type === 'water_quality'; }).map(function(t){ return [t.date, t.unit, t.temp, t.do, t.ph, t.ammonia]; }));
  var other = tx.filter(function(t){ return ['feeding','mortality','sampling','water_quality'].indexOf(t.type) < 0; });
  if(other.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['type','date','unit','details (JSON)']].concat(other.map(function(t){ return [t.type, t.date, t.unit, JSON.stringify(t)]; }))), 'Other — أخرى');
  var s = getSession() || {};
  XLSX.writeFile(wb, 'backup-' + (s.farm_name || 'farm').replace(/[^\w\u0600-\u06FF-]+/g, '_') + '-' + daToday() + '.xlsx');
  window._backupDone = true;
}
async function daWipeFarm(confirmText){
  var s = getSession() || {}, name = (s.farm_name || 'مسح').trim();
  var typed = confirmText !== undefined ? confirmText : prompt('⚠️ ده هيمسح كل بيانات المزرعة نهائياً: الوحدات، والمعاملات، والمخزون، والإعدادات.\nالمستخدمين هيفضلوا.\n\nللتأكيد اكتب اسم المزرعة: ' + name);
  if(typed === null) return false;
  if(String(typed).trim() !== name){ toast('❌ الاسم مش مطابق — ملغي'); return false; }
  try{ await sbFetch('rpc/wipe_my_farm_data', {method:'POST', body:'{}'}); }
  catch(e){ toast('❌ ' + e.message); return false; }
  await daWipeLocalTenant();
  _lsSetRaw.call(localStorage, TENANT_KEY, SB_FARM_ID);
  toast('✅ اتمسحت كل بيانات المزرعة');
  show('farm-setup', true);
  return true;
}
async function daSaveFarmInfo(){
  var n = daVal('fs-name').trim(), l = daVal('fs-loc').trim();
  if(!n){ toast('⚠️ اسم المزرعة مطلوب'); return; }
  try{
    await sbFetch('rpc/update_my_farm', {method:'POST', body: JSON.stringify({p_name:n, p_location:l})});
    var s = getSession(); if(s){ s.farm_name = n; setSession(s); }
    daUpdateBrand(); toast('✅ اتحفظ');
  }catch(e){ toast('❌ ' + e.message); }
}
async function daAddUnitManual(){
  var unit = daVal('mu-unit').trim();
  if(!unit){ toast('⚠️ اسم الوحدة مطلوب'); return; }
  if(RAW.some(function(u){ return u.unit === unit; })){ toast('⚠️ الوحدة موجودة'); return; }
  var fish = parseInt(daVal('mu-fish'), 10), wt = parseFloat(daVal('mu-wt')), d = daParseDate(daVal('mu-date') || daToday()), vol = parseFloat(daVal('mu-vol')) || 10;
  if(!(fish > 0) || !(wt > 0) || !d){ toast('⚠️ العدد والوزن والتاريخ مطلوبين'); return; }
  var site = daVal('mu-site').trim() || (unit.indexOf('.') > 0 ? unit.split('.')[0] : 'F1');
  var sec = daVal('mu-sec').trim() || (/T\d+$/i.test(unit) ? unit.replace(/T\d+$/i, '') : site);
  var bio = fish * wt / 1000;
  var u = {unit:unit, farm:site, section:sec, batch:daVal('mu-batch').trim(), species:'Silver Tilapia', hatchery:'', startDate:d,
    fishNo:fish, startWt:wt, avgWt:wt, biomass:bio, density:bio / vol, volume:vol, mortality:0, survival:100, feedKg:0, alarm:false, warn:false};
  RAW.push(u); _valCache = {t:0, map:{}};
  await daPersistUnitsLocal();
  try{ await saveUnitsToCloud([u]); }catch(e){ toast('⚠️ اتحفظت على الجهاز — هتترفع لما الاتصال يرجع'); }
  toast('✅ اتضافت ' + unit); show('farm-setup', true);
}
async function daDeleteUnit(unit){
  if(!confirm('حذف الوحدة ' + unit + '؟ المعاملات بتاعتها هتفضل في السجل.')) return;
  var i = RAW.findIndex(function(u){ return u.unit === unit; }); if(i < 0) return;
  RAW.splice(i, 1); _valCache = {t:0, map:{}};
  await daPersistUnitsLocal();
  try{ if(sbReady && SB_FARM_ID) await sbFetch('farm_units?id=eq.' + encodeURIComponent(SB_FARM_ID + ':' + unit), {method:'DELETE'}); }catch(e){ toast('❌ ' + e.message); }
  show('farm-setup', true);
}

  var h = '<div class="ph"><div><h2>🏗️ إعداد المزرعة</h2><p style="font-size:11px;color:var(--muted)">بيانات المزرعة، استيراد Excel، الوحدات، والنسخ الاحتياطي</p></div></div>';
  h += '<div class="card" style="margin-bottom:14px"><div class="card-title">🏭 بيانات المزرعة</div>';

  h += '<div style="display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap"><button class="savebtn" style="width:auto;padding:8px 18px" onclick="daSaveFarmInfo()">💾 حفظ</button>';
  if(s.farm_expires) h += '<span style="font-size:12px;color:var(--muted)">الاشتراك لحد ' + daEsc(s.farm_expires) + '</span>';
  h += '</div></div>';
  h += '<div class="card" style="margin-bottom:14px"><div class="card-title">📥 استيراد من Excel</div>';
  h += '<div style="font-size:12px;color:var(--muted);line-height:1.8;margin-bottom:10px">1) نزّل القالب واملاه — الوحدات مطلوبة، والتغذية والنفوق والعينات والمياه اختيارية.<br>2) ارفع الملف — هتشوف معاينة وأي أخطاء قبل ما حاجة تتحفظ.<br>ممكن تستورد نفس الملف تاني بعد التصحيح — الصفوف المكررة بتتحدث مش بتتكرر.</div>';
  h += '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="savebtn" style="width:auto;padding:9px 18px" onclick="daDownloadTemplate()">⬇️ تحميل القالب</button>';
  h += '<label style="padding:9px 18px;border:1.5px dashed var(--teal);border-radius:8px;cursor:pointer;color:var(--teal);font-weight:700">📂 اختار ملف Excel<input id="imp-file" type="file" accept=".xlsx,.xls,.csv" style="display:none" onchange="daImportFile(this)"/></label></div>';
  h += '<div id="imp-preview"></div></div>';
  h += '<div class="card" style="margin-bottom:14px"><div class="card-title">➕ إضافة وحدة يدوي</div>';
  h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px">';
  [['mu-unit','اسم الوحدة *','','placeholder="F1.S01T01"'],['mu-site','الموقع','','placeholder="F1"'],['mu-sec','القسم','','placeholder="F1.S01"'],['mu-batch','الدفعة','',''],
   ['mu-date','تاريخ التخزين *', daToday(),'type="date"'],['mu-fish','عدد السمك *','','type="number"'],['mu-wt','متوسط الوزن جم *','','type="number" step="any"'],['mu-vol','الحجم م³','10','type="number" step="any"']]
    .forEach(function(f){ h += '<div class="field"><label>' + f[1] + '</label>' + daInp(f[0], f[2], f[3]) + '</div>'; });
  h += '</div><button class="savebtn" style="width:auto;padding:8px 18px;margin-top:10px" onclick="daAddUnitManual()">➕ إضافة</button></div>';
  h += '<div class="card" style="margin-bottom:14px"><div class="card-title">🏊 الوحدات (' + live.length + ')</div>';
  h += live.length ? daTable(['الوحدة','الموقع','الدفعة','التخزين','السمك دلوقتي','الوزن','الكثافة',''], live.slice(0, 500).map(function(r){
    return ['<b>' + daEsc(r.unit) + '</b>', daEsc(r.farm || ''), daEsc(r.batch || ''), daEsc(r.startDate || ''), (r.fishNo || 0).toLocaleString(),
      (r.avgWt || 0).toFixed(0) + 'g', (r.density || 0).toFixed(1),
      '<button data-u="' + daEsc(r.unit) + '" onclick="daDeleteUnit(this.dataset.u)" style="padding:3px 8px;border:0;border-radius:6px;background:#fee2e2;color:var(--red);cursor:pointer">🗑️</button>'];
  })) : '<div style="color:var(--muted)">مفيش وحدات لسه</div>';
  h += '</div>';
  h += '<div class="card" style="border:2px solid var(--red)"><div class="card-title" style="color:var(--red)">⚠️ منطقة الخطر</div>';
  h += '<div style="font-size:12px;color:var(--muted);margin-bottom:10px">المسح بيشيل كل بيانات مزرعتك بس: الوحدات، والمعاملات، والمخزون، والإعدادات. المستخدمين بيفضلوا. مزارع تانية مش بتتأثر.</div>';
  h += '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="savebtn" style="width:auto;padding:9px 18px" onclick="daExportBackup()">⬇️ نسخة احتياطية Excel</button>';
  h += '<button onclick="daWipeFarm()" style="padding:9px 18px;border:0;border-radius:8px;background:var(--red);color:#fff;font:inherit;font-weight:700;cursor:pointer">🗑️ مسح كل بيانات المزرعة</button></div></div>';
