    h+='<select onchange="_settingsFarm=this.value;show(\'settings\')" style="border:2px solid var(--teal);border-radius:8px;padding:6px 12px;font:inherit;font-size:14px;font-weight:700;color:var(--deep)">';

    });

    h+='<div style="font-size:11px;color:var(--muted)">تنبيهات النفوق والكثافة وانقطاع التغذية</div></div>';

}

var _batchState = {
  date:'', site:'', hatchery:'', species:'Silver Tilapia',
  batch:'', batchGroup:'', fishNo:'', avgWt:'',
  costPerFish:'', quality:'', comments:'', hatcheryBatchCode:'',
  emptyUnitsDate:'',
  // per-unit rows
  rows:[] // [{unit, fishNo, avgWt, inputDate, costPerItem, groupTag}]
};
var _batchEditId = null; // null = new, else = editing existing tx id

function renderTxStocking(){
  var today = new Date().toISOString().slice(0,10);
  if(!_batchState.date) _batchState.date = today;
  if(!_batchState.emptyUnitsDate) _batchState.emptyUnitsDate = today;

  var allUnits   = allUnitNames();
  var farms      = getFarmList();
  var farmIds    = Object.keys(farms).filter(function(f){return f!=='all';});
  var speciesList= ['Silver Tilapia','Nile Tilapia','Sea Bass','Sea Bream','Shrimp','Carp','Other'];
  var qualityList= ['A — ممتاز','B — جيد','C — مقبول'];
  var txs = getTX().filter(function(t){return t.type==='stocking';}).sort(function(a,b){return b.date>a.date?1:b.date<a.date?-1:0;});

  // Filter units by selected farm
  var selFarm = _batchState.site || (farmIds[0]||'');
  var farmUnits = allUnits.filter(function(u){
    if(!selFarm) return true;
    return u.startsWith(selFarm+'.')||u.split('.')[0]===selFarm;
  });

  // Get unique values from existing TX for dropdowns
  var hatcheries = [];
  getTX().filter(function(t){return t.type==='stocking'&&t.hatchery;}).forEach(function(t){
    if(hatcheries.indexOf(t.hatchery)<0) hatcheries.push(t.hatchery);
  });
  var batches = [];
  getTX().filter(function(t){return t.type==='stocking'&&t.batch;}).forEach(function(t){
    if(batches.indexOf(t.batch)<0) batches.push(t.batch);
  });

  var inp = 'width:100%;padding:7px 10px;border:1.5px solid var(--line);border-radius:7px;font:inherit;font-size:13px;color:var(--ink);background:#fff';

  var h = '';
  h += '<div class="ph" style="margin-bottom:10px"><div>';
  h += '<h2>🐠 Batch Input</h2>';
  h += '<p style="font-size:11px;color:var(--muted)">AquaManager · Transactions → Batch Input · جميع الحقول اختيارية عدا الوحدة والأسماك والوزن</p>';
  h += '</div>';
  h += '<div style="display:flex;gap:8px">';
  h += '<button class="savebtn" style="width:auto;padding:9px 20px;background:var(--green)" onclick="batchSave()">💾 Save</button>';
  h += '<button class="ibtn" onclick="batchReset()">🔄 New</button>';
  h += '</div></div>';

  // Tab bar
  h += '<div class="card" style="padding:0;overflow:hidden">';
  h += '<div style="display:flex;background:#f8faf9;border-bottom:1px solid var(--line)">';
  h += '<div style="padding:10px 18px;font-size:13px;font-weight:700;color:var(--teal);border-bottom:2px solid var(--teal)">Batch Input</div>';
  h += '<div style="padding:10px 18px;font-size:13px;color:var(--muted)">History</div>';
  h += '</div>';

  // 2-col form
  h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0">';

  // ── LEFT column ──
  h += '<div style="padding:16px;border-inline-end:1px solid var(--line)">';
  function frow(lbl, inp_html, required){
    return '<div style="display:grid;grid-template-columns:140px 1fr;gap:8px;align-items:center;margin-bottom:10px">'
      +'<div style="font-size:12px;font-weight:600;color:var(--ink)">'+lbl+(required?'<span style="color:var(--red)"> *</span>':'')+'</div>'
      +'<div>'+inp_html+'</div></div>';
  }

  // Date
  h += frow('Date', '<input type="date" id="bi-date" value="'+_batchState.date+'" style="'+inp+'" onchange="_batchState.date=this.value"/>');

  // Site/Farm — dropdown
  h += frow('Site / Farm',
    '<select id="bi-site" style="'+inp+'" onchange="_batchState.site=this.value;renderBatchUnitTable()">'
    + farmIds.map(function(f){return '<option value="'+f+'"'+(_batchState.site===f||(!_batchState.site&&f===farmIds[0])?' selected':'')+'>'+farms[f]+'</option>';}).join('')
    +'</select>');

  // Hatchery — dropdown + free input via datalist
  h += frow('Hatchery / Supplier',
    '<input id="bi-hatchery" list="bi-hatchery-list" value="'+(esc(_batchState.hatchery||''))+'" placeholder="اختياري" style="'+inp+'" oninput="_batchState.hatchery=this.value"/>'
    +'<datalist id="bi-hatchery-list">'+hatcheries.map(function(x){return'<option>'+x+'</option>';}).join('')+'</datalist>');

  // Species — dropdown
  h += frow('Species',
    '<select id="bi-species" style="'+inp+'" onchange="_batchState.species=this.value">'
    +speciesList.map(function(s){return'<option'+(s===(_batchState.species||'Silver Tilapia')?' selected':'')+'>'+s+'</option>';}).join('')

  // Batch — dropdown + new
  h += frow('Batch',
    '<input id="bi-batch" list="bi-batch-list" value="'+(esc(_batchState.batch||''))+'" placeholder="اختياري — e.g. B'+today.replace(/-/g,'')+'" style="'+inp+';font-family:monospace" oninput="_batchState.batch=this.value"/>'
    +'<datalist id="bi-batch-list">'+batches.map(function(x){return'<option>'+x+'</option>';}).join('')+'</datalist>');

  // Batch Group — optional free
  h += frow('Batch Group',

  // Fish No + Avg Wt — required
  h += '<div style="display:grid;grid-template-columns:140px 1fr 1fr;gap:8px;align-items:center;margin-bottom:10px">';

  // Cost + Quality
  h += '<div style="display:grid;grid-template-columns:140px 1fr 100px;gap:8px;align-items:center;margin-bottom:10px">';

  h += '<select id="bi-quality" style="'+inp+'" onchange="_batchState.quality=this.value">'

  h += '</div>';

  // Input Comments
  h += frow('Input Comments',
    '<input id="bi-comments" value="'+(esc(_batchState.comments||''))+'" placeholder="اختياري" style="'+inp+'" oninput="_batchState.comments=this.value"/>');

  // Bio strip
  if(_batchState.fishNo && _batchState.avgWt){
    var bio2=parseFloat(_batchState.fishNo)*parseFloat(_batchState.avgWt)/1000;
    var cost2=parseFloat(_batchState.fishNo)*(parseFloat(_batchState.costPerFish)||0);

    h += '📊 Biomass: <strong>'+n(bio2,2)+' kg</strong> &nbsp;·&nbsp; Total Cost: <strong>'+n(cost2,2)+' BD</strong>';
    h += '</div>';
  }
  h += '</div>'; // end left col

  // ── RIGHT column ──
  h += '<div style="padding:16px">';
  h += '<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Link to Hatchery / Nursery</div>';
  h += frow('Document ID', '<input id="bi-docid" placeholder="اختياري" style="'+inp+'"/>');
  h += '<div style="font-size:12px;font-weight:600;color:var(--ink);margin-bottom:6px">Tank List</div>';
  h += '<textarea style="width:100%;height:68px;padding:7px 9px;border:1.5px solid var(--line);border-radius:6px;font:inherit;font-size:12px;resize:none" placeholder="قائمة الأحواض المرتبطة — اختياري"></textarea>';
  h += frow('Hatchery Batch Code', '<input id="bi-hbatchcode" value="'+(esc(_batchState.hatcheryBatchCode||''))+'" placeholder="اختياري" style="'+inp+'" oninput="_batchState.hatcheryBatchCode=this.value"/>');
  h += frow('Empty Units Date', '<input type="date" id="bi-emptydate" value="'+(_batchState.emptyUnitsDate||today)+'" style="'+inp+'" onchange="_batchState.emptyUnitsDate=this.value"/>');

  // Info box
  h += '<div style="background:#f0f9ff;border-radius:8px;padding:10px 12px;font-size:11px;color:#0c4a6e;margin-top:8px;line-height:1.7">';
  h += '💡 <strong>الحقول المطلوبة فقط:</strong> الوحدة + عدد الأسماك + متوسط الوزن<br>';
  h += 'باقي الحقول اختيارية — يمكن إضافتها لاحقاً';
  h += '</div>';
  h += '</div>'; // end right col
  h += '</div>'; // end 2-col

  // ── Unit Distribution ──
  h += '<div style="border-top:1px solid var(--line);background:var(--paper);padding:10px 14px">';
  h += '<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Unit Distribution — الأحواض المستقبِلة <span style="color:var(--red)">*</span></div>';
  h += '<div id="bi-unit-table">';
  h += _renderBatchUnitTable(farmUnits, _batchState);
  h += '</div></div>';
  h += '</div>'; // end main card

  // ── History ──
  var totFish=txs.reduce(function(s,t){return s+(t.fishNo||0);},0);
  var totCost=txs.reduce(function(s,t){return s+(t.fishNo||0)*(t.costPerFish||0);},0);

  h += '<div style="margin-top:16px">';
  h += '<div style="font-size:13px;font-weight:700;color:var(--deep);margin-bottom:10px">📖 Batch Input History</div>';
  h += '<div class="kpis" style="margin-bottom:12px">';
  h += '<div class="kpi"><div class="kpi-lbl">إجمالي مخزّن</div><div class="kpi-val">'+fmtK(totFish)+'</div><div class="kpi-sub">'+txs.length+' دفعة</div></div>';
  h += '<div class="kpi kok"><div class="kpi-lbl">تكلفة الزريعة</div><div class="kpi-val">'+n(totCost,2)+'</div><div class="kpi-sub">BD</div></div>';
  h += '</div>';

  if(!txs.length){
    h += '<div style="text-align:center;padding:32px;color:var(--muted);background:#fff;border-radius:12px;border:1px solid var(--line)">لا توجد دفعات مسجلة</div>';
  } else {
    var cols2='90px 90px 120px 100px 70px 75px 70px 80px 90px 80px 36px';
    h += '<div style="background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden">';
    h += '<div style="background:#edf4f1;display:grid;grid-template-columns:'+cols2+';gap:0;border-bottom:2px solid var(--line);padding:8px 0;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)">';
    ['Date','Unit','Batch','Hatchery','Fish No','Av.Wt(g)','Bio(kg)','Cost/Fish','Species','Quality',''].forEach(function(c){
      h += '<div style="padding:0 7px">'+c+'</div>';
    });
    h += '</div>';
    txs.slice(0,100).forEach(function(t,idx){
      var bio=(t.fishNo||0)*(t.avgWt||0)/1000;
      var bg=idx%2===0?'#fff':'#fafdfb';
      h += '<div style="background:'+bg+';display:grid;grid-template-columns:'+cols2+';gap:0;border-bottom:1px solid var(--line);align-items:center;min-height:34px;font-size:12px">';
      h += '<div style="padding:0 7px;color:var(--muted)">'+t.date+'</div>';
      h += '<div style="padding:0 7px;font-weight:700;color:var(--teal)">'+t.unit+'</div>';
      h += '<div style="padding:0 7px;font-size:10px;font-family:monospace">'+(t.batch||'—')+'</div>';
      h += '<div style="padding:0 7px;font-size:11px;color:var(--muted)">'+(t.hatchery||t.source||'—')+'</div>';
      h += '<div style="padding:0 7px;font-weight:700">'+fmtK(t.fishNo||0)+'</div>';
      h += '<div style="padding:0 7px">'+n(t.avgWt||0,2)+'</div>';
      h += '<div style="padding:0 7px">'+n(bio,1)+'</div>';

      h += '<div style="padding:0 7px;font-size:11px">'+(t.species||'—')+'</div>';
      h += '<div style="padding:0 7px;font-size:11px">'+(t.quality||'—')+'</div>';
      h += '<div style="padding:0 4px"><button class="del-btn" onclick="if(confirm(\'حذف؟\')){deleteTX(\''+t.id+'\');show(\'tx-stocking\')}">🗑</button></div>';
      h += '</div>';
    });
    var avgWtAll=txs.length?txs.reduce(function(s,t){return s+(t.avgWt||0);},0)/txs.length:0;
    h += '<div style="background:#edf4f1;display:grid;grid-template-columns:'+cols2+';gap:0;padding:9px 0;border-top:2px solid var(--teal);font-size:12px;font-weight:700">';
    h += '<div style="padding:0 7px;color:var(--muted)">'+txs.length+'</div><div></div><div></div><div></div>';

    h += '</div>';
  }

  return h;
}

function _renderBatchUnitTable(allUnits, st){
  var inp_style = 'width:100%;padding:5px 7px;border:1.5px solid var(--line);border-radius:5px;font:inherit;font-size:12px;color:var(--ink);background:#fff';
  var h = '';
  h += '<div style="overflow-x:auto">';
  h += '<div style="display:grid;grid-template-columns:130px 90px 85px 100px 90px 80px 1fr;gap:0;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:700px">';
  // Header
  h += '<div style="background:#d1e9e2;display:contents">';
  ['Unit','Fish No','Av. Wt (g)','Input Date','Cost/Item','Group Tag','FCR/SFR Table'].forEach(function(c){
    h += '<div style="padding:7px 8px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#edf4f1;border-bottom:1px solid var(--line)">'+c+'</div>';
  });
  h += '</div>';

  // Rows — one per assigned unit
  var assigned = st.rows || [];
  if(!assigned.length){
    // Show first empty row
    h += '<div style="grid-column:1/-1;text-align:center;padding:16px;color:var(--muted);font-size:12px">اختر الوحدات من الأسفل لإضافتها ↓</div>';
  } else {
    assigned.forEach(function(row, i){
      var bg = i%2===0?'#fff':'#fafdfb';
      h += '<div style="background:'+bg+';padding:5px 8px;border-bottom:1px solid var(--line);font-weight:700;font-size:12px;color:var(--teal);display:flex;align-items:center;gap:6px">';
      h += row.unit;
      h += '<button onclick="_batchState.rows.splice('+i+',1);renderBatchUnitTable()" style="border:0;background:transparent;color:var(--red);cursor:pointer;font-size:14px;line-height:1;padding:0 2px">×</button>';
      h += '</div>';
      h += '<div style="background:'+bg+';padding:3px 5px;border-bottom:1px solid var(--line)"><input type="number" class="sh-inp" placeholder="'+(st.fishNo||'Fish No')+'" value="'+(row.fishNo||'')+'" oninput="_batchState.rows['+i+'].fishNo=this.value" style="width:80px"/></div>';
      h += '<div style="background:'+bg+';padding:3px 5px;border-bottom:1px solid var(--line)"><input type="number" class="sh-inp" placeholder="'+(st.avgWt||'g')+'" value="'+(row.avgWt||'')+'" oninput="_batchState.rows['+i+'].avgWt=this.value" style="width:76px"/></div>';
      h += '<div style="background:'+bg+';padding:3px 5px;border-bottom:1px solid var(--line)"><input type="date" value="'+(row.inputDate||st.date)+'" oninput="_batchState.rows['+i+'].inputDate=this.value" style="width:96px;'+inp_style+'"/></div>';
      h += '<div style="background:'+bg+';padding:3px 5px;border-bottom:1px solid var(--line)"><input type="number" class="sh-inp" placeholder="BD" value="'+(row.costPerItem||'')+'" oninput="_batchState.rows['+i+'].costPerItem=this.value" style="width:80px"/></div>';
      h += '<div style="background:'+bg+';padding:3px 5px;border-bottom:1px solid var(--line)"><input class="sh-inp-text" placeholder="Tag" value="'+(row.groupTag||'')+'" oninput="_batchState.rows['+i+'].groupTag=this.value" style="width:72px"/></div>';
      h += '<div style="background:'+bg+';padding:3px 5px;border-bottom:1px solid var(--line)"><input class="sh-inp-text" placeholder="FCR/SFR" style="width:100%;font-size:11px"/></div>';
    });
  }
  h += '</div></div>';

  // Unit picker
  h += '<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">';
  h += '<span style="font-size:11px;font-weight:700;color:var(--muted)">+ إضافة حوض:</span>';
  h += '<select id="bi-add-unit" style="border:1.5px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit;font-size:12px">';
  h += '<option value="">— اختر حوض —</option>';
  allUnits.forEach(function(nm){
    var already = (st.rows||[]).some(function(r){return r.unit===nm;});
    if(!already) h += '<option>'+nm+'</option>';
  });
  h += '</select>';
  h += '<button class="ibtn" onclick="batchAddUnit()">➕ إضافة</button>';
  h += '<button class="ibtn" onclick="batchAddAllUnits()" style="font-size:11px">➕ كل الوحدات</button>';
  h += '<button class="ibtn" onclick="_batchState.rows=[];renderBatchUnitTable()" style="color:var(--red);font-size:11px">✕ مسح الكل</button>';
  h += '</div>';
  return h;
}

function renderBatchUnitTable(){
  var selFarm = _batchState.site || '';
  var allUnits = allUnitNames().filter(function(nm){
    if(!selFarm) return true;

function batchAddAllUnits(){

    if(!selFarm) return true;

function batchCalcBio(){
  var fish = parseFloat(document.getElementById('bi-fishno').value||0);
  var wt   = parseFloat(document.getElementById('bi-avgwt').value||0);
  var cost = parseFloat(document.getElementById('bi-cost').value||0);
  var strip = document.getElementById('bi-bio-strip');
  var bioEl = document.getElementById('bi-bio-val');
  var costEl= document.getElementById('bi-cost-val');
  if(fish>0&&wt>0){
    if(strip) strip.style.display='block';
    if(bioEl) bioEl.textContent = n(fish*wt/1000,2)+' kg';

function batchReset(){
  _batchState = {date:new Date().toISOString().slice(0,10),site:'',hatchery:'',
    species:'Silver Tilapia',batch:'',batchGroup:'',fishNo:'',avgWt:'',
    costPerFish:'',quality:'A',comments:'',hatcheryBatchCode:'',
    emptyUnitsDate:new Date().toISOString().slice(0,10),rows:[]};
  _batchEditId=null;
  show('tx-stocking');
}

function batchSave(){
  // Read header fields from DOM
  var dateEl = document.getElementById('bi-date');
  if(dateEl) _batchState.date = dateEl.value;
  var siteEl = document.getElementById('bi-site'); if(siteEl) _batchState.site=siteEl.value;
  var hatEl  = document.getElementById('bi-hatchery'); if(hatEl) _batchState.hatchery=hatEl.value;
  var spEl   = document.getElementById('bi-species'); if(spEl) _batchState.species=spEl.value;
  var batEl  = document.getElementById('bi-batch'); if(batEl) _batchState.batch=batEl.value;
  var costEl = document.getElementById('bi-cost'); if(costEl) _batchState.costPerFish=costEl.value;
  var qualEl = document.getElementById('bi-quality'); if(qualEl) _batchState.quality=qualEl.value;
  var comEl  = document.getElementById('bi-comments'); if(comEl) _batchState.comments=comEl.value;
  var hbcEl  = document.getElementById('bi-hbatchcode'); if(hbcEl) _batchState.hatcheryBatchCode=hbcEl.value;
  var fnEl   = document.getElementById('bi-fishno'); if(fnEl) _batchState.fishNo=fnEl.value;
  var awEl   = document.getElementById('bi-avgwt'); if(awEl) _batchState.avgWt=awEl.value;

  var date    = _batchState.date;
  var batch   = _batchState.batch || ('B'+date.replace(/-/g,''));
  var species = _batchState.species;
  var hatchery= _batchState.hatchery;
  var cost    = parseFloat(_batchState.costPerFish)||0;
  var quality = _batchState.quality||'A';
  var comments= _batchState.comments||'';

  var saved = 0;

  // Require at least one row
  if(!_batchState.rows || !_batchState.rows.length){
    toast('⚠️ أضف حوض واحد على الأقل في جدول الأحواض'); return;
  }

  _batchState.rows.forEach(function(row){
    var fishNo = parseInt(row.fishNo||_batchState.fishNo||0);
    var avgWt  = parseFloat(row.avgWt||_batchState.avgWt||0);
    // Only skip if BOTH fish and weight are missing — unit alone is enough to save with 0 values
    if(!row.unit) return;
    if(!fishNo && !avgWt){ return; } // skip rows with no data at all
    var qualVal = (quality||'A').split(' ')[0]; // strip label like "A — ممتاز" → "A"
    addTX({
      type:'stocking',
      date: row.inputDate||date,
      unit: row.unit,
      batch:    batch   || null,
      species:  species || null,
      hatchery: hatchery|| null,
      fishNo:   fishNo  || 0,
      avgWt:    avgWt   || 0,
      costPerFish: cost || null,
      quality:  qualVal || null,
      notes:    comments|| null,
      groupTag: row.groupTag||null,
      site:     _batchState.site||null,
    });
    saved++;
  });

  if(!saved){ toast('⚠️ لا توجد صفوف تحتوي على بيانات — أدخل عدد الأسماك والوزن'); return; }
  toast('✅ تم حفظ '+saved+' وحدة'+(batch?' — Batch: '+batch:''));
  batchReset();
}

// ── WATER QUALITY Transaction — Grid Sheet ───────────────
var _wqSheet     = {};   // {unit: {temp,do,ph,salinity,ammonia,nitrite,nitrate,tds,turbidity,notes}}
var _wqSheetDate = '';

// Parameters config — label, id, unit, normal range [min,max], step
var WQ_PARAMS = [
  {id:'temp',     lbl:'Temp',      unit:'°C',   min:20, max:32, step:0.1,  warn:[null,32],  alarm:[null,35]},
  {id:'do',       lbl:'DO',        unit:'mg/L', min:5,  max:10, step:0.01, warn:[5,null],   alarm:[4,null]},
  {id:'ph',       lbl:'pH',        unit:'',     min:6,  max:9,  step:0.01, warn:[6.5,8.5],  alarm:[6,9]},
  {id:'salinity', lbl:'Salinity',  unit:'ppt',  min:0,  max:35, step:0.1,  warn:[null,null],alarm:[null,null]},
  {id:'ammonia',  lbl:'NH₃',       unit:'mg/L', min:0,  max:0.5,step:0.001,warn:[0.02,null],alarm:[0.05,null]},
  {id:'nitrite',  lbl:'NO₂',       unit:'mg/L', min:0,  max:1,  step:0.001,warn:[0.1,null], alarm:[0.5,null]},
  {id:'nitrate',  lbl:'NO₃',       unit:'mg/L', min:0,  max:200,step:0.1,  warn:[50,null],  alarm:[100,null]},
  {id:'tds',      lbl:'TDS',       unit:'ppm',  min:0,  max:2000,step:1,   warn:[null,null],alarm:[null,null]},
  {id:'turbidity',lbl:'Turbidity', unit:'NTU',  min:0,  max:50, step:0.1,  warn:[30,null],  alarm:[50,null]},
];

function _wqStatus(param, val){
  if(val===null||val===''||isNaN(val)) return '';
  var p = WQ_PARAMS.find(function(x){return x.id===param;});
  if(!p) return '';
  var v = parseFloat(val);
  // alarm check
  if(p.alarm[0]!==null && v<p.alarm[0]) return 'alarm';
  if(p.alarm[1]!==null && v>p.alarm[1]) return 'alarm';
  // warn check
  if(p.warn[0]!==null && v<p.warn[0]) return 'warn';
  if(p.warn[1]!==null && v>p.warn[1]) return 'warn';
  return 'ok';
}

function _wqColor(status){
  return status==='alarm'?'#fee2e2':status==='warn'?'#fef3c7':status==='ok'?'':'' ;
}
function _wqTextColor(status){
  return status==='alarm'?'var(--red)':status==='warn'?'var(--amber)':status==='ok'?'var(--green)':'var(--ink)';
}

function wqUpdate(uid, param, idx, inp){
  var val = inp.value!=='' ? parseFloat(inp.value) : '';
  if(!_wqSheet[uid]) _wqSheet[uid]={};
  _wqSheet[uid][param] = val;
  // Live color feedback on the input
  var st = val!=='' ? _wqStatus(param, val) : '';
  inp.style.background = _wqColor(st);
  inp.style.color = st ? _wqTextColor(st) : '';
  inp.style.fontWeight = st ? '700' : '';
}

function wqUpdateNotes(uid, idx){
  var el=document.getElementById('wq-notes-'+idx);
  if(!_wqSheet[uid]) _wqSheet[uid]={};
  _wqSheet[uid].notes = el?el.value:'';
}

function wqCopyYesterday(){
  var d=new Date(_wqSheetDate||new Date().toISOString().slice(0,10));
  d.setDate(d.getDate()-1);
  var yest=d.toISOString().slice(0,10);
  var yTX=getTX().filter(function(t){return t.type==='water_quality'&&t.date===yest;});
  if(!yTX.length){ toast('لا توجد بيانات مياه بالأمس'); return; }
  yTX.forEach(function(t){
    _wqSheet[t.unit]={};
    WQ_PARAMS.forEach(function(p){ if(t[p.id]!==undefined) _wqSheet[t.unit][p.id]=t[p.id]; });
    _wqSheet[t.unit].notes='';
  });
  show('tx-wq');
  toast('📋 تم نسخ '+yTX.length+' وحدة من قياسات '+yest);
}

function wqSaveAll(){
  var date=_wqSheetDate||new Date().toISOString().slice(0,10);
  var saved=0;
  Object.keys(_wqSheet).forEach(function(uid){
    var v=_wqSheet[uid];
    // Only save if at least one param has a value
    var hasData=WQ_PARAMS.some(function(p){return v[p.id]!==undefined&&v[p.id]!=='';});
    if(!hasData) return;
    var rec={type:'water_quality',date:date,unit:uid,notes:v.notes||''};
    WQ_PARAMS.forEach(function(p){ rec[p.id]=v[p.id]!==undefined?v[p.id]:null; });
    addTX(rec);
    saved++;
  });
  // Auto-update Feeding Regime with latest WQ readings
  var latestDO = null, latestTemp = null;
  Object.keys(_wqSheet).forEach(function(uid){
    var v = _wqSheet[uid]||{};
    if(v.do !== undefined && v.do !== '')   latestDO   = parseFloat(v.do);
    if(v.temp !== undefined && v.temp !== '') latestTemp = parseFloat(v.temp);
  });
  if(latestDO !== null || latestTemp !== null){
    var wqCfg = getSettings(_settingsFarm);
    if(latestDO   !== null && !isNaN(latestDO))   wqCfg.waterDO   = latestDO;
    if(latestTemp !== null && !isNaN(latestTemp))  wqCfg.waterTemp = latestTemp;
    saveSettings(wqCfg, _settingsFarm);
    // Invalidate feeding regime cache so it recalculates
    if(typeof _frCache !== 'undefined') _frCache = null;
  }

  _wqSheet={};
  toast('✅ تم حفظ '+saved+' وحدة'+(latestDO!==null?' · DO='+latestDO:'')); show('tx-wq');
}

  metrics.forEach(function(m){

    h+='<div style="font-size:22px;font-weight:700;line-height:1.2;margin:4px 0">'+m[1]+'<span style="font-size:12px">'+m[2]+'</span></div></div>';
  });
  h+='</div></div>';

  // Quick action buttons
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">';
  ['tx-feeding','tx-mortality','tx-sampling','tx-wq','tx-transfer','tx-harvesting','tx-stocking'].forEach(function(v,i){
    var labels=['🌾 علف','💀 نفوق','🔬 عينة','💧 مياه','🔄 نقل','🎣 حصاد','🐠 زريعة'];
    h+='<button class="chip" onclick="setTxUnit(\''+uid+'\');show(\''+v+'\')" style="font-size:12px">'+labels[i]+'</button>';
  });
  h+='</div>';

  // All transactions
  h+='<div class="card">';
  h+='<div class="card-title">📖 كل العمليات — '+uid+' ('+txs.length+')</div>';
  if(!txs.length){
    h+='<div style="text-align:center;padding:24px;color:var(--muted);font-size:13px">لا توجد عمليات مسجلة لهذه الوحدة</div>';
  } else {
    h+='<div class="tbl-scroll"><table><thead><tr><th>التاريخ</th><th>النوع</th><th>التفاصيل</th><th>ملاحظات</th><th></th></tr></thead><tbody>';
    txs.forEach(function(t){
      var typeBadge={
        'feeding':'<span class="pill pill-ok">🌾 تغذية</span>',
        'mortality':'<span class="pill pill-alarm">💀 نفوق</span>',
        'sampling':'<span style="background:#ede9fe;color:#5b21b6;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700">🔬 عينة</span>',
        'transfer_out':'<span class="pill pill-warn">🔄 نقل خارج</span>',
        'transfer_in':'<span class="pill pill-ok">🔄 نقل داخل</span>',
        'harvesting':'<span style="background:#dcfce7;color:#166534;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700">🎣 حصاد</span>',
        'stocking':'<span style="background:#dbeafe;color:#1e40af;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700">🐠 زريعة</span>'
      }[t.type]||t.type;
      var detail='';
      if(t.type==='feeding') detail='<strong>'+n(t.kg,2)+'</strong> كجم · '+(t.feed||'')+(t.meal?' · '+t.meal:'');
      else if(t.type==='mortality') detail='<strong style="color:var(--red)">'+t.count+'</strong> سمكة · '+(t.cause||'');
      else if(t.type==='sampling') detail='<strong>'+n(t.avgWt,1)+'</strong> g · SGR:'+(t.sgr?n(t.sgr,3):'—')+' · FCR:'+(t.fcr?n(t.fcr,2):'—');
      else if(t.type==='transfer_out'||t.type==='transfer_in') detail='<strong>'+fmtK(t.fishNo||0)+'</strong> سمكة · '+n(t.avgWt||0,1)+' g';
      else if(t.type==='harvesting') detail='<strong>'+fmtK(t.fishNo||0)+'</strong> سمكة · '+n(t.kg,1)+' كجم · '+n(t.kg*1000/(t.fishNo||1),0)+' g avg';
      else if(t.type==='stocking') detail='<strong>'+fmtK(t.fishNo||0)+'</strong> سمكة · '+n(t.avgWt||0,1)+' g · '+(t.batch||'');
      h+='<tr><td>'+t.date+'</td><td>'+typeBadge+'</td><td style="font-size:12px">'+detail+'</td>';
      h+='<td style="font-size:11px;color:var(--muted)">'+(t.notes||'—')+'</td>';
      h+='<td><button class="del-btn" onclick="if(confirm(\'حذف؟\')){deleteTX(\''+t.id+'\');show(\'unit-tx\')}">🗑</button></td></tr>';
    });
    h+='</tbody></table></div>';
  }
  h+='</div>';
  return h;
}

// ══════════════════════════════════════════════════════
//  TRANSACTION REPORTS MODULE
// ══════════════════════════════════════════════════════

var _rptType   = 'feeding';   // active report tab
var _rptFrom   = '';
var _rptTo     = '';
var _rptUnit   = '';

function renderTxReports(){
  // Default dates: last 30 days
  var today  = new Date().toISOString().slice(0,10);
  var d30    = new Date(); d30.setDate(d30.getDate()-30);
  var from30 = d30.toISOString().slice(0,10);
  if(!_rptFrom) _rptFrom = from30;
  if(!_rptTo)   _rptTo   = today;

  var unitNames = allUnitNames().filter(function(n){
    return farmFilter==='all' || n.startsWith(farmFilter+'.');
  });

  var h='';
  // ── Header ──
  h+='<div class="ph"><div><h2>📑 '+(isAr?'التقارير — Transactions Reports':'Transaction Reports')+'</h2>';
  h+='<p style="font-size:11px;color:var(--muted)">علف · نفوق · عينات · نقل · حصاد · زريعة</p></div>';
  h+='<div style="display:flex;gap:8px">';
  h+='<button class="savebtn" style="width:auto;padding:9px 18px;font-size:13px;background:var(--deep)" onclick="openBookReport()">📚 طباعة كتاب التقرير</button>';
  h+='<button class="ibtn" onclick="exportTxReportExcel()">📊 Excel</button>';
  h+='</div></div>';

  // ── Filters bar ──
  h+='<div class="card" style="padding:14px 16px">';
  h+='<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">';
  h+='<div class="field" style="margin:0;flex:1;min-width:120px"><label style="font-size:11px">من تاريخ</label>';
  h+='<input type="date" id="rpt-from" value="'+_rptFrom+'" onchange="_rptFrom=this.value;show(\'tx-reports\')" style="width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font:inherit;font-size:13px"/></div>';
  h+='<div class="field" style="margin:0;flex:1;min-width:120px"><label style="font-size:11px">إلى تاريخ</label>';
  h+='<input type="date" id="rpt-to" value="'+_rptTo+'" onchange="_rptTo=this.value;show(\'tx-reports\')" style="width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font:inherit;font-size:13px"/></div>';
  h+='<div class="field" style="margin:0;flex:2;min-width:160px"><label style="font-size:11px">الوحدة (اختياري)</label>';
  h+='<select id="rpt-unit" onchange="_rptUnit=this.value;show(\'tx-reports\')" style="width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font:inherit;font-size:13px">';
  h+='<option value="">كل الوحدات</option>';
  unitNames.forEach(function(n){ h+='<option'+(n===_rptUnit?' selected':'')+'>'+n+'</option>'; });
  h+='</select></div>';
  h+='<button class="ibtn" onclick="_rptFrom=\''+from30+'\';_rptTo=\''+today+'\';_rptUnit=\'\';show(\'tx-reports\')">↺ إعادة تعيين</button>';
  h+='</div></div>';

  // ── Report type tabs ──
  var tabs=[
    {k:'feeding',  lbl:'🌾 التغذية'},
    {k:'mortality',lbl:'💀 النفوق'},
    {k:'sampling', lbl:'🔬 العينات'},
    {k:'transfer', lbl:'🔄 النقل'},
    {k:'harvesting',lbl:'🎣 الحصاد'},
    {k:'stocking', lbl:'🐠 الزريعة'},
    {k:'wq',       lbl:'💧 جودة المياه'},
    {k:'summary',  lbl:'📊 ملخص شامل'},
  ];
  h+='<div class="tabs" style="margin-bottom:0">';
  tabs.forEach(function(t){
    h+='<button class="tab'+(t.k===_rptType?' on':'')+'" onclick="_rptType=\''+t.k+'\';show(\'tx-reports\')">'+t.lbl+'</button>';
  });
  h+='</div>';

  // ── Filter transactions ──
  var txs = getTX().filter(function(t){
    var inDate = t.date>=_rptFrom && t.date<=_rptTo;
    var inUnit = !_rptUnit || t.unit===_rptUnit;
    return inDate && inUnit;
  });

  // ── Render active tab ──
  h += '<div id="rpt-body">';
  if(_rptType==='feeding')   h += _rptFeeding(txs);
  if(_rptType==='mortality') h += _rptMortality(txs);
  if(_rptType==='sampling')  h += _rptSampling(txs);
  if(_rptType==='transfer')  h += _rptTransfer(txs);
  if(_rptType==='harvesting')h += _rptHarvesting(txs);
  if(_rptType==='stocking')  h += _rptStocking(txs);
  if(_rptType==='wq')        h += _rptWaterQuality(txs);
  if(_rptType==='summary')   h += _rptSummary(txs);
  h += '</div>';

  return h;
}

// ── helpers ──
function _noData(){ return '<div style="text-align:center;padding:40px;color:var(--muted);font-size:13px">لا توجد بيانات في هذه الفترة</div>'; }
function _kpiRow(items){
  var h='<div class="kpis" style="margin:14px 0">';
  items.forEach(function(k){ h+='<div class="kpi '+(k.cls||'')+'"><div class="kpi-lbl">'+k.lbl+'</div><div class="kpi-val">'+k.val+'</div>'+(k.sub?'<div class="kpi-sub">'+k.sub+'</div>':'')+'</div>'; });
  h+='</div>'; return h;
}
function _periodStr(){ return _rptFrom + ' → ' + _rptTo + (_rptUnit?' · '+_rptUnit:''); }

// ── FEEDING REPORT ──
function _rptFeeding(txs){
  var feeds = txs.filter(function(t){ return t.type==='feeding'; });
  if(!feeds.length) return _noData();

  var totKg   = feeds.reduce(function(s,t){return s+(t.kg||0);},0);
  var days    = Math.max(1,Math.round((new Date(_rptTo)-new Date(_rptFrom))/86400000)+1);
  var avgPerDay = totKg/days;

  // By unit
  var byUnit={};
  feeds.forEach(function(t){
    if(!byUnit[t.unit]) byUnit[t.unit]={unit:t.unit,kg:0,sessions:0,feedTypes:{}};
    byUnit[t.unit].kg+=t.kg||0; byUnit[t.unit].sessions++;
    if(t.feed) byUnit[t.unit].feedTypes[t.feed]=(byUnit[t.unit].feedTypes[t.feed]||0)+1;
  });
  var unitRows=Object.values(byUnit).sort(function(a,b){return b.kg-a.kg;});

  // By day
  var byDay={};
  feeds.forEach(function(t){ byDay[t.date]=(byDay[t.date]||0)+(t.kg||0); });
  var dayRows=Object.keys(byDay).sort().map(function(d){return{date:d,kg:byDay[d]};});
  var maxDayKg=dayRows.length?Math.max.apply(null,dayRows.map(function(d){return d.kg;})):1;

  // By feed type
  var byFeed={};
  feeds.forEach(function(t){ if(t.feed){byFeed[t.feed]=(byFeed[t.feed]||0)+(t.kg||0);} });

  var h='';
  h+=_kpiRow([
    {lbl:'🌾 إجمالي العلف',    val:n(totKg,1)+' كجم'},
    {lbl:'📅 عدد الأيام',      val:days+' يوم'},
    {lbl:'⚡ معدل يومي',       val:n(avgPerDay,1)+' كجم/يوم'},
    {lbl:'🏊 عدد الوحدات',     val:Object.keys(byUnit).length},
    {lbl:'📝 عدد الوجبات',     val:feeds.length},
  ]);

  // Bar chart — daily feed
  if(dayRows.length>1){
    h+='<div class="card"><div class="card-title">📈 التغذية اليومية (كجم)</div>';
    h+=barChartSVG(dayRows.map(function(d){return{lbl:d.date.slice(5),val:d.kg};}),maxDayKg,820,160,'#067b72');
    h+='</div>';
  }

  // By unit table
  h+='<div class="card"><div class="card-title">🏊 التغذية حسب الوحدة</div>';
  h+='<div class="tbl-scroll"><table><thead><tr>';
  h+='<th>الوحدة</th><th>إجمالي (كجم)</th><th>% من الكل</th><th>وجبات</th><th>متوسط/وجبة</th><th>نوع العلف الأكثر</th><th>شريط</th>';
  h+='</tr></thead><tbody>';
  unitRows.forEach(function(r){
    var pct=totKg>0?r.kg/totKg*100:0;
    var topFeed=Object.keys(r.feedTypes).sort(function(a,b){return r.feedTypes[b]-r.feedTypes[a];})[0]||'—';
    h+='<tr><td><strong style="color:var(--teal)">'+r.unit+'</strong></td>';
    h+='<td><strong>'+n(r.kg,2)+'</strong></td>';
    h+='<td>'+n(pct,1)+'%</td>';
    h+='<td>'+r.sessions+'</td>';
    h+='<td>'+n(r.sessions?r.kg/r.sessions:0,2)+'</td>';
    h+='<td style="font-size:11px">'+topFeed+'</td>';
    h+='<td style="min-width:100px">'+dbar(pct/3)+'</td></tr>';
  });
  // Total row
  h+='<tr class="sum-row"><td>الإجمالي</td><td><strong>'+n(totKg,2)+' كجم</strong></td><td>100%</td><td>'+feeds.length+'</td><td>'+n(totKg/feeds.length,2)+'</td><td>—</td><td></td></tr>';
  h+='</tbody></table></div></div>';

  // By feed type
  if(Object.keys(byFeed).length){
    h+='<div class="card"><div class="card-title">🎯 حسب نوع العلف</div>';
    h+='<div class="tbl-wrap"><table><thead><tr><th>نوع العلف</th><th>إجمالي (كجم)</th><th>النسبة</th></tr></thead><tbody>';
    Object.keys(byFeed).sort(function(a,b){return byFeed[b]-byFeed[a];}).forEach(function(f){
      h+='<tr><td>'+f+'</td><td>'+n(byFeed[f],2)+'</td><td>'+n(byFeed[f]/totKg*100,1)+'%</td></tr>';
    });
    h+='</tbody></table></div></div>';
  }

  // Full transaction log
  h+='<div class="card"><div class="card-title">📋 سجل التغذية التفصيلي ('+feeds.length+' سجل)</div>';
  h+='<div class="tbl-scroll"><table><thead><tr><th>#</th><th>التاريخ</th><th>الوحدة</th><th>الكمية (كجم)</th><th>الوجبة</th><th>نوع العلف</th><th>ملاحظات</th></tr></thead><tbody>';
  feeds.forEach(function(t,i){
    h+='<tr><td style="color:var(--muted)">'+(i+1)+'</td><td>'+t.date+'</td>';
    h+='<td><strong style="color:var(--teal)">'+t.unit+'</strong></td>';
    h+='<td><strong>'+n(t.kg,2)+'</strong></td>';
    h+='<td>'+(t.meal||'—')+'</td><td>'+(t.feed||'—')+'</td><td style="font-size:11px;color:var(--muted)">'+(t.notes||'—')+'</td></tr>';
  });
  h+='<tr class="sum-row"><td colspan="3">الإجمالي</td><td><strong>'+n(totKg,2)+' كجم</strong></td><td colspan="3"></td></tr>';
  h+='</tbody></table></div></div>';
  return h;
}

// ── MORTALITY REPORT ──
function _rptMortality(txs){
  var morts=txs.filter(function(t){return t.type==='mortality';});
  if(!morts.length) return _noData();

  var totCount=morts.reduce(function(s,t){return s+(t.count||0);},0);
  var days=Math.max(1,Math.round((new Date(_rptTo)-new Date(_rptFrom))/86400000)+1);

  // By cause
  var byCause={};
  morts.forEach(function(t){ var c=t.cause||'غير محدد'; byCause[c]=(byCause[c]||0)+(t.count||0); });

  // By unit
  var byUnit={};
  morts.forEach(function(t){
    if(!byUnit[t.unit]) byUnit[t.unit]={unit:t.unit,count:0,events:0};
    byUnit[t.unit].count+=t.count||0; byUnit[t.unit].events++;
  });

  // By day
  var byDay={};
  morts.forEach(function(t){ byDay[t.date]=(byDay[t.date]||0)+(t.count||0); });
  var dayRows=Object.keys(byDay).sort().map(function(d){return{date:d,val:byDay[d]};});
  var maxD=dayRows.length?Math.max.apply(null,dayRows.map(function(x){return x.val;})):1;

  var h='';
  h+=_kpiRow([
    {lbl:'💀 إجمالي النفوق',   val:totCount,  cls:'kalarm'},
    {lbl:'📅 أيام الفترة',      val:days},
    {lbl:'📉 متوسط يومي',       val:n(totCount/days,1)+' سمكة/يوم'},
    {lbl:'🏊 وحدات متأثرة',    val:Object.keys(byUnit).length},
    {lbl:'📝 أحداث مسجلة',     val:morts.length},
  ]);

  if(dayRows.length>1){
    h+='<div class="card"><div class="card-title">📈 النفوق اليومي</div>';
    h+=barChartSVG(dayRows.map(function(d){return{lbl:d.date.slice(5),val:d.val};}),maxD,820,160,'#dc2626');
    h+='</div>';
  }

  // By cause
  h+='<div class="card"><div class="card-title">🔍 حسب السبب</div>';
  h+='<div class="tbl-wrap"><table><thead><tr><th>السبب</th><th>عدد النافقة</th><th>النسبة</th><th>شريط</th></tr></thead><tbody>';
  Object.keys(byCause).sort(function(a,b){return byCause[b]-byCause[a];}).forEach(function(c){
    var pct=totCount>0?byCause[c]/totCount*100:0;
    h+='<tr><td>'+c+'</td><td><strong style="color:var(--red)">'+byCause[c]+'</strong></td>';
    h+='<td>'+n(pct,1)+'%</td><td>'+dbar(pct/3)+'</td></tr>';
  });
  h+='</tbody></table></div></div>';

  // By unit
  h+='<div class="card"><div class="card-title">🏊 حسب الوحدة</div>';
  h+='<div class="tbl-scroll"><table><thead><tr><th>الوحدة</th><th>إجمالي النافقة</th><th>عدد الأحداث</th><th>%</th></tr></thead><tbody>';
  Object.values(byUnit).sort(function(a,b){return b.count-a.count;}).forEach(function(r){
    h+='<tr><td><strong style="color:var(--teal)">'+r.unit+'</strong></td>';
    h+='<td><strong style="color:var(--red)">'+r.count+'</strong></td>';
    h+='<td>'+r.events+'</td>';
    h+='<td>'+n(totCount>0?r.count/totCount*100:0,1)+'%</td></tr>';
  });
  h+='<tr class="sum-row"><td>الإجمالي</td><td><strong>'+totCount+'</strong></td><td>'+morts.length+'</td><td>100%</td></tr>';
  h+='</tbody></table></div></div>';

  // Full log
  h+='<div class="card"><div class="card-title">📋 سجل النفوق التفصيلي ('+morts.length+' سجل)</div>';
  h+='<div class="tbl-scroll"><table><thead><tr><th>#</th><th>التاريخ</th><th>الوحدة</th><th>العدد</th><th>السبب</th><th>ملاحظات</th></tr></thead><tbody>';
  morts.forEach(function(t,i){
    h+='<tr><td style="color:var(--muted)">'+(i+1)+'</td><td>'+t.date+'</td>';
    h+='<td><strong style="color:var(--teal)">'+t.unit+'</strong></td>';
    h+='<td><strong style="color:var(--red)">'+t.count+'</strong></td>';
    h+='<td>'+(t.cause||'—')+'</td><td style="font-size:11px;color:var(--muted)">'+(t.notes||'—')+'</td></tr>';
  });
  h+='<tr class="sum-row"><td colspan="3">الإجمالي</td><td><strong>'+totCount+'</strong></td><td colspan="2"></td></tr>';
  h+='</tbody></table></div></div>';
  return h;
}

// ── SAMPLING REPORT ──
function _rptSampling(txs){
  var samps=txs.filter(function(t){return t.type==='sampling';});
  if(!samps.length) return _noData();

  var avgSGR=samps.filter(function(t){return t.sgr;}).reduce(function(s,t,_,a){return s+t.sgr/a.length;},0);
  var avgFCR=samps.filter(function(t){return t.fcr;}).reduce(function(s,t,_,a){return s+t.fcr/a.length;},0);
  var avgWt =samps.reduce(function(s,t,_,a){return s+(t.avgWt||0)/a.length;},0);

  var h='';
  h+=_kpiRow([
    {lbl:'🔬 عدد العينات',     val:samps.length},
    {lbl:'⚖️ متوسط الوزن',     val:n(avgWt,1)+' g'},
    {lbl:'📈 متوسط SGR',       val:samps.some(function(t){return t.sgr;})?n(avgSGR,3)+'%/يوم':'—'},
    {lbl:'🎯 متوسط FCR',       val:samps.some(function(t){return t.fcr;})?n(avgFCR,2):'—'},
    {lbl:'📊 إجمالي Biomass',  val:n(samps.reduce(function(s,t){return s+(t.biomass||0);},0)/samps.length,0)+' كجم (avg)'},
  ]);

  h+='<div class="card"><div class="card-title">📋 سجل العينات التفصيلي ('+samps.length+' عينة)</div>';
  h+='<div class="tbl-scroll"><table><thead><tr>';
  h+='<th>#</th><th>التاريخ</th><th>الوحدة</th><th>متوسط الوزن (g)</th><th>Biomass (كجم)</th><th>SGR %/يوم</th><th>FCR</th><th>أيام من السابق</th><th>علف في الفترة (كجم)</th><th>عدد العينة</th><th>ملاحظات</th>';
  h+='</tr></thead><tbody>';
  samps.sort(function(a,b){return a.date>b.date?1:-1;}).forEach(function(t,i){
    var sgrColor=t.sgr>2?'var(--green)':t.sgr>0.5?'var(--amber)':'var(--red)';
    var fcrColor=t.fcr>0&&t.fcr<2?'var(--green)':t.fcr>0?'var(--amber)':'var(--muted)';
    h+='<tr><td style="color:var(--muted)">'+(i+1)+'</td><td>'+t.date+'</td>';
    h+='<td><strong style="color:var(--teal)">'+t.unit+'</strong></td>';
    h+='<td><strong>'+n(t.avgWt,1)+'</strong></td>';
    h+='<td>'+(t.biomass?n(t.biomass,1):'—')+'</td>';
    h+='<td style="font-weight:700;color:'+(t.sgr?sgrColor:'var(--muted)')+'">'+(t.sgr?n(t.sgr,3):'—')+'</td>';
    h+='<td style="font-weight:700;color:'+(t.fcr?fcrColor:'var(--muted)')+'">'+(t.fcr?n(t.fcr,2):'—')+'</td>';
    h+='<td>'+(t.daysSinceLast||'—')+'</td>';
    h+='<td>'+(t.feedSinceLast?n(t.feedSinceLast,1):'—')+'</td>';
    h+='<td>'+(t.sampleN||'—')+'</td>';
    h+='<td style="font-size:11px;color:var(--muted)">'+(t.notes||'—')+'</td></tr>';
  });
  h+='</tbody></table></div></div>';
  return h;
}

// ── TRANSFER REPORT ──
function _rptTransfer(txs){
  var touts=txs.filter(function(t){return t.type==='transfer_out';});
  if(!touts.length) return _noData();
  var totFish=touts.reduce(function(s,t){return s+(t.fishNo||0);},0);

  var h='';
  h+=_kpiRow([
    {lbl:'🔄 عمليات النقل',    val:touts.length},
    {lbl:'🐟 إجمالي منقول',    val:fmtK(totFish)+' سمكة'},
    {lbl:'⚖️ متوسط/عملية',     val:fmtK(Math.round(totFish/(touts.length||1)))+' سمكة'},
  ]);

  h+='<div class="card"><div class="card-title">📋 سجل عمليات النقل ('+touts.length+')</div>';
  h+='<div class="tbl-scroll"><table><thead><tr><th>#</th><th>التاريخ</th><th>من (Source)</th><th>إلى (Dest)</th><th>عدد المنقول</th><th>متوسط الوزن (g)</th><th>نوع النقل</th><th>ملاحظات</th></tr></thead><tbody>';
  touts.forEach(function(t,i){
    var dest=getTX().filter(function(x){return x.type==='transfer_in'&&x.txGroup===t.txGroup;})[0];
    h+='<tr><td style="color:var(--muted)">'+(i+1)+'</td><td>'+t.date+'</td>';
    h+='<td><strong style="color:#dc2626">'+t.unit+'</strong></td>';
    h+='<td><strong style="color:var(--green)">'+(dest?dest.unit:'—')+'</strong></td>';
    h+='<td><strong>'+fmtK(t.fishNo||0)+'</strong></td>';
    h+='<td>'+n(t.avgWt||0,1)+'</td>';
    h+='<td>'+(t.transferType||'—')+'</td>';
    h+='<td style="font-size:11px;color:var(--muted)">'+(t.notes||'—')+'</td></tr>';
  });
  h+='<tr class="sum-row"><td colspan="4">الإجمالي</td><td><strong>'+fmtK(totFish)+'</strong></td><td colspan="3"></td></tr>';
  h+='</tbody></table></div></div>';
  return h;
}

// ── HARVESTING REPORT ──
function _rptHarvesting(txs){
  var harvs=txs.filter(function(t){return t.type==='harvesting';});
  if(!harvs.length) return _noData();

  var totFish=harvs.reduce(function(s,t){return s+(t.fishNo||0);},0);
  var totKg  =harvs.reduce(function(s,t){return s+(t.kg||0);},0);
  var totRev =harvs.reduce(function(s,t){return s+(t.kg||0)*(t.price||0);},0);
  var avgWt  =totFish?totKg*1000/totFish:0;
  var avgPrice=harvs.filter(function(t){return t.price;}).length?
    harvs.reduce(function(s,t){return s+(t.price||0);},0)/harvs.filter(function(t){return t.price;}).length:0;

  // By category
  var byCat={};
  harvs.forEach(function(t){ var c=t.category||'غير محدد'; if(!byCat[c])byCat[c]={fish:0,kg:0,rev:0}; byCat[c].fish+=t.fishNo||0; byCat[c].kg+=t.kg||0; byCat[c].rev+=(t.kg||0)*(t.price||0); });

  // By unit
  var byUnit={};
  harvs.forEach(function(t){ if(!byUnit[t.unit])byUnit[t.unit]={unit:t.unit,fish:0,kg:0,rev:0,events:0}; byUnit[t.unit].fish+=t.fishNo||0; byUnit[t.unit].kg+=t.kg||0; byUnit[t.unit].rev+=(t.kg||0)*(t.price||0); byUnit[t.unit].events++; });

  var h='';
  h+=_kpiRow([
    {lbl:'🎣 إجمالي محصود',    val:fmtK(totFish)+' سمكة', cls:'kok'},
    {lbl:'⚖️ الوزن الكلي',      val:n(totKg/1000,2)+' طن', cls:'kok'},
    {lbl:'📏 متوسط الوزن',      val:n(avgWt,0)+' g'},
    {lbl:'💰 إجمالي الإيرادات', val:n(totRev,2)+' BD', cls:'kok'},
    {lbl:'💲 متوسط السعر',      val:avgPrice?n(avgPrice,3)+' BD/كجم':'—'},
    {lbl:'📋 عمليات الحصاد',   val:harvs.length},
  ]);

  // By category
  if(Object.keys(byCat).length>1){
    h+='<div class="card"><div class="card-title">📦 حسب الفئة</div>';
    h+='<div class="tbl-wrap"><table><thead><tr><th>الفئة</th><th>عدد الأسماك</th><th>الوزن (كجم)</th><th>الإيراد (BD)</th><th>% من الوزن</th></tr></thead><tbody>';
    Object.keys(byCat).sort(function(a,b){return byCat[b].kg-byCat[a].kg;}).forEach(function(c){
      h+='<tr><td>'+c+'</td><td>'+fmtK(byCat[c].fish)+'</td>';
      h+='<td><strong>'+n(byCat[c].kg,1)+'</strong></td>';
      h+='<td style="color:var(--green);font-weight:700">'+n(byCat[c].rev,2)+'</td>';
      h+='<td>'+n(totKg>0?byCat[c].kg/totKg*100:0,1)+'%</td></tr>';
    });
    h+='</tbody></table></div></div>';
  }

  // By unit
  h+='<div class="card"><div class="card-title">🏊 حسب الوحدة</div>';
  h+='<div class="tbl-scroll"><table><thead><tr><th>الوحدة</th><th>عدد الأسماك</th><th>الوزن (كجم)</th><th>متوسط الوزن (g)</th><th>الإيراد (BD)</th><th>عمليات</th></tr></thead><tbody>';
  Object.values(byUnit).sort(function(a,b){return b.kg-a.kg;}).forEach(function(r){
    h+='<tr><td><strong style="color:var(--teal)">'+r.unit+'</strong></td>';
    h+='<td>'+fmtK(r.fish)+'</td>';
    h+='<td><strong>'+n(r.kg,1)+'</strong></td>';
    h+='<td>'+n(r.fish?r.kg*1000/r.fish:0,0)+'</td>';
    h+='<td style="color:var(--green);font-weight:700">'+n(r.rev,2)+'</td>';
    h+='<td>'+r.events+'</td></tr>';
  });
  h+='<tr class="sum-row"><td>الإجمالي</td><td><strong>'+fmtK(totFish)+'</strong></td><td><strong>'+n(totKg,1)+'</strong></td><td>'+n(avgWt,0)+'</td><td style="color:var(--green)"><strong>'+n(totRev,2)+' BD</strong></td><td>'+harvs.length+'</td></tr>';
  h+='</tbody></table></div></div>';

  // Full log
  h+='<div class="card"><div class="card-title">📋 سجل الحصاد التفصيلي ('+harvs.length+')</div>';
  h+='<div class="tbl-scroll"><table><thead><tr><th>#</th><th>التاريخ</th><th>الوحدة</th><th>عدد</th><th>وزن (كجم)</th><th>متوسط (g)</th><th>الفئة</th><th>السعر</th><th>الإيراد</th><th>العميل</th></tr></thead><tbody>';
  harvs.sort(function(a,b){return a.date>b.date?1:-1;}).forEach(function(t,i){
    var aw=t.fishNo?t.kg*1000/t.fishNo:0;
    var rev=(t.kg||0)*(t.price||0);
    h+='<tr><td style="color:var(--muted)">'+(i+1)+'</td><td>'+t.date+'</td>';
    h+='<td><strong style="color:var(--teal)">'+t.unit+'</strong></td>';
    h+='<td>'+fmtK(t.fishNo||0)+'</td><td><strong>'+n(t.kg,1)+'</strong></td>';
    h+='<td>'+n(aw,0)+'</td><td>'+(t.category||'—')+'</td>';
    h+='<td>'+(t.price?n(t.price,3):'—')+'</td>';
    h+='<td style="color:var(--green);font-weight:700">'+(rev?n(rev,2):'—')+'</td>';
    h+='<td style="font-size:11px">'+(t.buyer||'—')+'</td></tr>';
  });
  h+='<tr class="sum-row"><td colspan="3">الإجمالي</td><td><strong>'+fmtK(totFish)+'</strong></td><td><strong>'+n(totKg,1)+' كجم</strong></td><td>'+n(avgWt,0)+'</td><td colspan="2"></td><td style="color:var(--green)"><strong>'+n(totRev,2)+' BD</strong></td><td></td></tr>';
  h+='</tbody></table></div></div>';
  return h;
}

// ── STOCKING REPORT ──
function _rptStocking(txs){

  if(!stocks.length) return _noData();

  var totFish=stocks.reduce(function(s,t){return s+(t.fishNo||0);},0);

    {lbl:'💰 تكلفة الزريعة',   val:n(totCost,2)+' BD'},
    {lbl:'📋 عمليات الإضافة',  val:stocks.length},
    {lbl:'🏊 وحدات مخزّنة',    val:new Set(stocks.map(function(t){return t.unit;})).size},

  h+='<div class="card"><div class="card-title">📋 سجل الزريعة التفصيلي ('+stocks.length+')</div>';
  h+='<div class="tbl-scroll"><table><thead><tr><th>#</th><th>التاريخ</th><th>الوحدة</th><th>Batch</th><th>النوع</th><th>عدد</th><th>وزن (g)</th><th>Biomass (كجم)</th><th>المورد</th><th>تكلفة/سمكة</th><th>الجودة</th></tr></thead><tbody>';
  stocks.sort(function(a,b){return a.date>b.date?1:-1;}).forEach(function(t,i){
    var bio=(t.fishNo||0)*(t.avgWt||0)/1000;
    h+='<tr><td style="color:var(--muted)">'+(i+1)+'</td><td>'+t.date+'</td>';
    h+='<td><strong style="color:var(--teal)">'+t.unit+'</strong></td>';
    h+='<td><code style="font-size:10px">'+(t.batch||'—')+'</code></td>';
    h+='<td>'+(t.species||'—')+'</td>';
    h+='<td><strong>'+fmtK(t.fishNo||0)+'</strong></td>';
    h+='<td>'+n(t.avgWt||0,1)+'</td>';
    h+='<td>'+n(bio,1)+'</td>';
    h+='<td>'+(t.source||'—')+'</td>';
    h+='<td>'+(t.cost?n(t.cost,3)+' BD':'—')+'</td>';
    h+='<td>'+(t.quality||'—')+'</td></tr>';
  });
  h+='<tr class="sum-row"><td colspan="5">الإجمالي</td><td><strong>'+fmtK(totFish)+'</strong></td><td></td><td><strong>'+n(totBio,1)+'</strong></td><td></td><td><strong>'+n(totCost,2)+' BD</strong></td><td></td></tr>';
  h+='</tbody></table></div></div>';
  return h;
}

// ── WATER QUALITY REPORT ──
function _rptWaterQuality(txs){
  var wqs=txs.filter(function(t){return t.type==='water_quality';}).sort(function(a,b){return a.date>b.date?1:-1;});
  if(!wqs.length) return _noData();

  // Compute averages per param
  var avgs={};
  WQ_PARAMS.forEach(function(p){
    var vals=wqs.map(function(t){return t[p.id];}).filter(function(v){return v!==null&&v!==undefined&&v!=='';});
    avgs[p.id]=vals.length?vals.reduce(function(s,v){return s+parseFloat(v);},0)/vals.length:null;
  });

  var h='';
  // KPI row — one per param
  h+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin:14px 0">';
  WQ_PARAMS.forEach(function(p){
    var avg=avgs[p.id];
    var st=avg!==null?_wqStatus(p.id,avg):'';
    h+='<div class="kpi '+(st==='alarm'?'kalarm':st==='warn'?'kwarn':avg!==null?'kok':'')+'">';
    h+='<div class="kpi-lbl">'+p.lbl+(p.unit?' ('+p.unit+')':'')+'</div>';
    h+='<div class="kpi-val">'+(avg!==null?n(avg,p.id==='ammonia'||p.id==='nitrite'?3:2):'—')+'</div>';
    h+='</div>';
  });
  h+='</div>';

  // Full grid table
  h+='<div class="card"><div class="card-title">📋 سجل جودة المياه ('+wqs.length+' سجل)</div>';
  h+='<div class="tbl-scroll"><table><thead><tr>';
  h+='<th>#</th><th>التاريخ</th><th>الوحدة</th>';
  WQ_PARAMS.forEach(function(p){ h+='<th>'+p.lbl+(p.unit?'<br><span style="font-weight:400;font-size:9px">'+p.unit+'</span>':'')+'</th>'; });
  h+='<th>ملاحظات</th></tr></thead><tbody>';
  wqs.forEach(function(t,i){
    h+='<tr><td style="color:var(--muted)">'+(i+1)+'</td><td>'+t.date+'</td>';
    h+='<td><strong style="color:var(--teal)">'+t.unit+'</strong></td>';
    WQ_PARAMS.forEach(function(p){
      var val=t[p.id];
      var st=val!==null&&val!==undefined&&val!==''?_wqStatus(p.id,val):'';
      h+='<td style="background:'+_wqColor(st)+';color:'+_wqTextColor(st)+';font-weight:'+(st?'700':'400')+';text-align:center">';
      h+=(val!==null&&val!==undefined&&val!==''?n(parseFloat(val),p.id==='ammonia'||p.id==='nitrite'?3:2):'—')+'</td>';
    });
    h+='<td style="font-size:11px;color:var(--muted)">'+(t.notes||'—')+'</td></tr>';
  });
  h+='</tbody></table></div></div>';
  return h;
}

// ── SUMMARY REPORT ──
function _rptSummary(txs){
  var feeds  = txs.filter(function(t){return t.type==='feeding';});
  var morts  = txs.filter(function(t){return t.type==='mortality';});
  var samps  = txs.filter(function(t){return t.type==='sampling';});
  var trans  = txs.filter(function(t){return t.type==='transfer_out';});
  var harvs  = txs.filter(function(t){return t.type==='harvesting';});
  var stocks = txs.filter(function(t){return t.type==='stocking';});

  var totFeed  = feeds.reduce(function(s,t){return s+(t.kg||0);},0);
  var totMort  = morts.reduce(function(s,t){return s+(t.count||0);},0);
  var totHarvF = harvs.reduce(function(s,t){return s+(t.fishNo||0);},0);
  var totHarvKg= harvs.reduce(function(s,t){return s+(t.kg||0);},0);
  var totRev   = harvs.reduce(function(s,t){return s+(t.kg||0)*(t.price||0);},0);
  var totStock = stocks.reduce(function(s,t){return s+(t.fishNo||0);},0);
  var avgSGR   = samps.filter(function(t){return t.sgr;}).reduce(function(s,t,_,a){return s+t.sgr/a.length;},0);
  var avgFCR   = samps.filter(function(t){return t.fcr;}).reduce(function(s,t,_,a){return s+t.fcr/a.length;},0);

  var s=getSettings();
  var reportDate=new Date().toLocaleDateString('ar-BH',{year:'numeric',month:'long',day:'numeric'});

  var h='';
  // Print style
  h+='<style>@media print{.top,.sidebar,.mob-nav,.drawer,.no-print,#back-btn{display:none!important}.content{padding:0!important}.shell{display:block!important}.pr{page-break-inside:avoid}@page{margin:1.2cm 1.5cm;size:A4}}</style>';

  // Report header
  h+='<div class="card pr" style="background:var(--deep);color:#fff;border-color:var(--deep);margin-bottom:14px">';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">';
  h+='<div>';
  h+='<div style="font-size:22px;font-weight:800">'+(s.farmName||daFarmName())+'</div>';
  h+='<div style="font-size:12px;opacity:.75;margin-top:3px">'+(s.location||'Bahrain')+' · '+(s.species||'Silver Tilapia')+'</div>';
  h+='<div style="font-size:11px;opacity:.6;margin-top:4px">📑 تقرير الفترة: '+_periodStr()+'</div>';
  h+='</div>';
  h+='<div style="text-align:end"><div style="font-size:11px;opacity:.7">تاريخ التقرير</div>';
  h+='<div style="font-size:15px;font-weight:700">'+reportDate+'</div></div>';
  h+='</div></div>';

  // Big KPIs
  h+=_kpiRow([
    {lbl:'🌾 إجمالي العلف',    val:n(totFeed,1)+' كجم'},
    {lbl:'💀 إجمالي النفوق',   val:totMort, cls:totMort>0?'kalarm':''},
    {lbl:'🔬 عدد العينات',     val:samps.length},
    {lbl:'🔄 عمليات النقل',    val:trans.length},
    {lbl:'🎣 محصود (سمكة)',    val:fmtK(totHarvF), cls:'kok'},
    {lbl:'🎣 محصود (كجم)',     val:n(totHarvKg,1), cls:'kok'},
    {lbl:'💰 الإيرادات',       val:n(totRev,2)+' BD', cls:'kok'},
    {lbl:'🐠 زريعة مضافة',     val:fmtK(totStock)},
    {lbl:'📈 متوسط SGR',       val:avgSGR?n(avgSGR,3)+'%/d':'—'},
    {lbl:'🎯 متوسط FCR',       val:avgFCR?n(avgFCR,2):'—'},
  ]);

  // Mini breakdown tables side by side
  h+='<div class="grid2">';

  // Feed summary
  if(feeds.length){
    var byUnitF={};
    feeds.forEach(function(t){byUnitF[t.unit]=(byUnitF[t.unit]||0)+(t.kg||0);});
    h+='<div class="card pr"><div class="card-title">🌾 ملخص التغذية</div>';
    h+='<div class="tbl-wrap"><table><thead><tr><th>الوحدة</th><th>كجم</th></tr></thead><tbody>';
    Object.keys(byUnitF).sort(function(a,b){return byUnitF[b]-byUnitF[a];}).slice(0,10).forEach(function(u){
      h+='<tr><td>'+u+'</td><td><strong>'+n(byUnitF[u],1)+'</strong></td></tr>';
    });
    h+='<tr class="sum-row"><td>الإجمالي</td><td><strong>'+n(totFeed,1)+'</strong></td></tr>';
    h+='</tbody></table></div></div>';
  }

  // Mortality summary
  if(morts.length){
    var byCause={};
    morts.forEach(function(t){ var c=t.cause||'غير محدد'; byCause[c]=(byCause[c]||0)+(t.count||0); });
    h+='<div class="card pr"><div class="card-title">💀 ملخص النفوق</div>';
    h+='<div class="tbl-wrap"><table><thead><tr><th>السبب</th><th>عدد</th></tr></thead><tbody>';
    Object.keys(byCause).sort(function(a,b){return byCause[b]-byCause[a];}).forEach(function(c){
      h+='<tr><td>'+c+'</td><td><strong style="color:var(--red)">'+byCause[c]+'</strong></td></tr>';
    });
    h+='<tr class="sum-row"><td>الإجمالي</td><td><strong>'+totMort+'</strong></td></tr>';
    h+='</tbody></table></div></div>';
  }

  // Harvest summary
  if(harvs.length){
    h+='<div class="card pr"><div class="card-title">🎣 ملخص الحصاد</div>';
    h+='<div class="tbl-wrap"><table><thead><tr><th>الوحدة</th><th>كجم</th><th>BD</th></tr></thead><tbody>';
    var byUnitH={};
    harvs.forEach(function(t){if(!byUnitH[t.unit])byUnitH[t.unit]={kg:0,rev:0};byUnitH[t.unit].kg+=t.kg||0;byUnitH[t.unit].rev+=(t.kg||0)*(t.price||0);});
    Object.keys(byUnitH).sort(function(a,b){return byUnitH[b].kg-byUnitH[a].kg;}).forEach(function(u){
      h+='<tr><td>'+u+'</td><td>'+n(byUnitH[u].kg,1)+'</td><td style="color:var(--green);font-weight:700">'+n(byUnitH[u].rev,2)+'</td></tr>';
    });
    h+='<tr class="sum-row"><td>الإجمالي</td><td><strong>'+n(totHarvKg,1)+' كجم</strong></td><td style="color:var(--green)"><strong>'+n(totRev,2)+' BD</strong></td></tr>';
    h+='</tbody></table></div></div>';
  }

  // Sampling summary
  if(samps.length){
    h+='<div class="card pr"><div class="card-title">🔬 ملخص العينات (SGR & FCR)</div>';
    h+='<div class="tbl-wrap"><table><thead><tr><th>الوحدة</th><th>آخر وزن (g)</th><th>SGR</th><th>FCR</th></tr></thead><tbody>';
    var byUnitS={};
    samps.forEach(function(t){byUnitS[t.unit]=t;});
    Object.keys(byUnitS).forEach(function(u){
      var t=byUnitS[u];
      h+='<tr><td>'+u+'</td><td><strong>'+n(t.avgWt,1)+'</strong></td>';
      h+='<td style="color:var(--green)">'+(t.sgr?n(t.sgr,3):'—')+'</td>';
      h+='<td style="color:var(--amber)">'+(t.fcr?n(t.fcr,2):'—')+'</td></tr>';
    });
    h+='</tbody></table></div></div>';
  }

  h+='</div>'; // end grid2

  // Total transactions count footer

async function exportTxReportExcel(){
  // Use downloads capability instead of XLSX library (not available in artifact)
  var dl = await claude.use('downloads');
  if(!dl){ toast('⚠️ التحميل غير متاح في هذا الحساب'); return; }
  var txs=getTX().filter(function(t){ return t.date>=_rptFrom&&t.date<=_rptTo&&(!_rptUnit||t.unit===_rptUnit); });
  // Build CSV content (works without XLSX library)
  function toCSV(rows){
    if(!rows.length) return '';
    var headers = Object.keys(rows[0]);
    var lines = [headers.join(',')];
    rows.forEach(function(r){
      lines.push(headers.map(function(h){
        var v = r[h];
        if(v===null||v===undefined) v='';
        v = String(v);
        if(v.indexOf(',')>=0||v.indexOf('"')>=0||v.indexOf('\n')>=0) v='"'+v.replace(/"/g,'""')+'"';
        return v;
      }).join(','));
    });
    return lines.join('\n');
  }

  var sections = [];
  var types={feeding:'التغذية',mortality:'النفوق',sampling:'العينات',transfer_out:'النقل',harvesting:'الحصاد',stocking:'الزريعة'};
  Object.keys(types).forEach(function(tp){
    var rows=txs.filter(function(t){return t.type===tp;});
    if(!rows.length) return;
    var mapped=rows.map(function(t){
      var r={Date:t.date, Unit:t.unit};
      if(tp==='feeding'){r['Qty(kg)']=t.kg||0;r['Feed Type']=t.feed||'';r['Meal']=t.meal||'';r['Notes']=t.notes||'';}
      if(tp==='mortality'){r['Count']=t.count||0;r['Cause']=t.cause||'';r['Notes']=t.notes||'';}
      if(tp==='sampling'){r['Av.Wt(g)']=t.avgWt||0;r['Biomass(kg)']=t.biomass||0;r['SGR']=t.sgr||0;r['FCR']=t.fcr||0;r['Days']=t.daysSinceLast||0;r['FeedPeriod(kg)']=t.feedSinceLast||0;}
      if(tp==='transfer_out'){r['FishNo']=t.fishNo||0;r['Av.Wt(g)']=t.avgWt||0;r['Type']=t.transferType||'';}
      if(tp==='harvesting'){r['FishNo']=t.fishNo||0;r['Weight(kg)']=t.kg||0;r['Category']=t.category||'';r['Price(BD/kg)']=t.price||0;r['Revenue(BD)']=(t.kg||0)*(t.price||0);r['Buyer']=t.buyer||'';}
      if(tp==='stocking'){r['FishNo']=t.fishNo||0;r['Av.Wt(g)']=t.avgWt||0;r['Batch']=t.batch||'';r['Species']=t.species||'';r['Source']=t.source||'';}
      return r;
    });
    sections.push('=== '+types[tp]+' ('+tp+') ===');
    sections.push(toCSV(mapped));
    sections.push('');
  });

  var s=getSettings();
  var fname=(s.farmName||'DarAqua').replace(/\s/g,'_')+'_Report_'+_rptFrom+'_'+_rptTo+'.csv';
  var csvContent = '\uFEFF' + sections.join('\n'); // BOM for Excel Arabic support
  var blob = new Blob([csvContent], {type:'text/csv;charset=utf-8'});

  try{
    await dl.save({filename: fname, data: blob});
    toast('✅ تم تصدير '+fname+' — افتحه في Excel');
  }catch(e){
    toast('⚠️ '+( e.message||'تعذر التحميل'));
  }
}

function _txLiveRows(){
  // Start from RAW + custom units
  var base = RAW.map(function(r){ return Object.assign({},r); });
  getFarmUnits().forEach(function(u){
    if(!base.some(function(b){return b.unit===u.name;})){
      base.push({unit:u.name,farm:u.farm||u.name.split('.')[0]||'F1',
        section:u.section||(u.name.split('.').slice(0,2).join('.')),
        fishNo:u.fishNo||0,startWt:u.startWt||0,avgWt:u.avgWt||0,
        biomass:u.biomass||0,density:u.density||0,
        startDate:u.stockDate||u.startDate||'',alarm:false,warn:false});
    }
  });

  var cfg  = getSettings();
  var dAlarm = cfg.densAlarm||25, dWarn = cfg.densWarn||15;
  var allTX  = getTX();
  var today  = new Date().toISOString().slice(0,10);

  base.forEach(function(r){
    var uid = r.unit;
    // Apply TX in chronological order
    allTX.filter(function(t){return t.unit===uid;})
         .sort(function(a,b){return a.ts>b.ts?1:-1;})
         .forEach(function(t){
           if(t.type==='mortality'){
             r.fishNo = Math.max(0,(r.fishNo||0)-(t.count||0));
           }
           if(t.type==='sampling'){
             r.avgWt = t.avgWt||r.avgWt;
           }
           if(t.type==='transfer_out'){
             r.fishNo = Math.max(0,(r.fishNo||0)-(t.fishNo||0));
           }
           if(t.type==='transfer_in'){
             var prevBio=(r.fishNo||0)*(r.avgWt||0);
             var inBio=(t.fishNo||0)*(t.avgWt||r.avgWt||0);
             r.fishNo=(r.fishNo||0)+(t.fishNo||0);
             if(r.fishNo>0) r.avgWt=(prevBio+inBio)/r.fishNo;
           }
           if(t.type==='stocking'){
             var pb=(r.fishNo||0)*(r.avgWt||0);
             var nb=(t.fishNo||0)*(t.avgWt||0);
             r.fishNo=(r.fishNo||0)+(t.fishNo||0);
             if(r.fishNo>0) r.avgWt=(pb+nb)/r.fishNo;
           }
         });
    // Recalculate biomass & density
    r.biomass = (r.fishNo||0)*(r.avgWt||0)/1000;
    // density: use stored volume if available; else keep ratio
    var vol = r.volume || (r.biomass&&r.density&&r.density>0 ? r.biomass/r.density : 10);
    r.density = vol>0 ? r.biomass/vol : r.density;
    r.alarm   = r.density >= dAlarm;
    r.warn    = !r.alarm && r.density >= dWarn;
  });

  return base;
}

// ══════════════════════════════════════════════════════════
//  UPGRADE #9 — Enhanced Alerts Engine
//  Adds TX-aware alerts: missed feedings, mortality spikes,
//  WQ alarms, no-sampling alerts, harvest-ready units.
// ══════════════════════════════════════════════════════════
var _generateAlertsOrig = generateAlerts;
generateAlerts = function(){
  var alerts = _generateAlertsOrig();  // keep all existing alerts
  var today  = new Date().toISOString().slice(0,10);
  var allTX  = getTX();
  var cfg    = getSettings();
  var liveRs = _txLiveRows();

  // Helper
  function daysAgo(n){ var d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }

  // ── A: Missed feeding (no feed TX for >2 days, unit has fish) ──
  var feedByUnit = {};
  allTX.filter(function(t){return t.type==='feeding';}).forEach(function(t){
    if(!feedByUnit[t.unit]||feedByUnit[t.unit]<t.date) feedByUnit[t.unit]=t.date;
  });
  liveRs.forEach(function(r){
    if((r.fishNo||0)<10) return; // skip near-empty units
    var lastFeed = feedByUnit[r.unit];
    if(!lastFeed){
      alerts.push({level:'warn',icon:'🌾',unit:r.unit,
        title:'لا يوجد سجل علف لهذه الوحدة',
        detail:'لم يُسجَّل أي علف منذ بداية التسجيل',
        action:'tx-feeding'});
    } else {
      var days = Math.floor((new Date(today)-new Date(lastFeed))/86400000);
      if(days>=3){
        alerts.push({level: days>=5?'critical':'warn', icon:'🌾', unit:r.unit,
          title:'لم تُعلَّف منذ '+days+' أيام',
          detail:'آخر تغذية: '+lastFeed,
          action:'tx-feeding'});
      }
    }
  });

  // ── B: Mortality spike (>1% of fish in last 3 days) ──
  var last3 = [daysAgo(0),daysAgo(1),daysAgo(2)];
  var mortRecent = {};
  allTX.filter(function(t){return t.type==='mortality'&&last3.indexOf(t.date)>=0;})
       .forEach(function(t){ mortRecent[t.unit]=(mortRecent[t.unit]||0)+(t.count||0); });
  liveRs.forEach(function(r){
    var mct = mortRecent[r.unit]||0;
    if(!mct||!r.fishNo) return;
    var pct = mct/r.fishNo*100;
    if(pct>=1){
      alerts.push({level: pct>=3?'critical':'warn', icon:'💀', unit:r.unit,
        title:'نفوق مرتفع — '+n(pct,1)+'% في 3 أيام',
        detail:mct+' سمكة في آخر 3 أيام من '+fmtK(r.fishNo)+' موجودة',
        action:'tx-mortality'});
    }
  });

  // ── C: No sampling in >14 days ──
  var lastSampByUnit = {};
  allTX.filter(function(t){return t.type==='sampling';})
       .forEach(function(t){ if(!lastSampByUnit[t.unit]||lastSampByUnit[t.unit]<t.date) lastSampByUnit[t.unit]=t.date; });
  liveRs.forEach(function(r){
    if((r.fishNo||0)<50) return;
    var ls = lastSampByUnit[r.unit];
    if(!ls) return; // skip units with no sampling history yet
    var days = Math.floor((new Date(today)-new Date(ls))/86400000);
    if(days>=14){
      alerts.push({level:'info', icon:'🔬', unit:r.unit,
        title:'لم تُؤخذ عينة منذ '+days+' يوم',
        detail:'آخر عينة: '+ls+' · SGR & FCR غير محدّثين',
        action:'tx-sampling'});
    }
  });

  // ── D: WQ alarms (last reading per unit) ──
  var lastWQByUnit = {};
  allTX.filter(function(t){return t.type==='water_quality';})
       .sort(function(a,b){return b.date>a.date?1:-1;})
       .forEach(function(t){ if(!lastWQByUnit[t.unit]) lastWQByUnit[t.unit]=t; });
  Object.keys(lastWQByUnit).forEach(function(uid){
    var wq = lastWQByUnit[uid];
    var issues = [];
    if(wq.do!==null&&wq.do!==''&&parseFloat(wq.do)<(cfg.doCrit||4))  issues.push('DO='+(wq.do)+' mg/L 🔴');
    if(wq.do!==null&&wq.do!==''&&parseFloat(wq.do)<(cfg.doWarn||5))  issues.push('DO='+(wq.do)+' mg/L 🟡');
    if(wq.ammonia!==null&&wq.ammonia!==''&&parseFloat(wq.ammonia)>(cfg.ammCrit||0.05)) issues.push('NH₃='+(wq.ammonia)+' 🔴');
    if(wq.ph!==null&&wq.ph!==''){ var ph=parseFloat(wq.ph); if(ph<6.5||ph>9) issues.push('pH='+ph+' 🔴'); }
    if(wq.temp!==null&&wq.temp!==''&&parseFloat(wq.temp)>(cfg.tempHi||35)) issues.push('Temp='+wq.temp+'°C 🔴');
    if(issues.length){
      alerts.push({level: issues.some(function(i){return i.includes('🔴');})?'critical':'warn',
        icon:'💧', unit:uid,
        title:'تحذير جودة مياه — '+uid,
        detail:issues.join(' · ')+' ('+wq.date+')',
        action:'tx-wq'});
    }
  });

  // ── E: Harvest-ready (avgWt ≥ target, if set in settings) ──
  var harvestTarget = parseFloat(cfg.harvestTargetWt)||0;
  if(harvestTarget>0){
    liveRs.forEach(function(r){
      if((r.avgWt||0)>=harvestTarget && (r.fishNo||0)>=50){
        alerts.push({level:'info', icon:'🎣', unit:r.unit,
          title:'جاهزة للحصاد — '+n(r.avgWt,0)+' g',
          detail:'الوزن المستهدف '+harvestTarget+' g · Biomass: '+n(r.biomass,1)+' كجم',
          action:'tx-harvesting'});
      }
    });
  }

  // Deduplicate by unit+title
  var seen = {};
  return alerts.filter(function(a){
    var key = (a.unit||'')+'|'+(a.title||'');
    if(seen[key]) return false;
    seen[key]=1; return true;
  });
};

// ══════════════════════════════════════════════════════════
//  UPGRADE #1 — Feeding Regime Calculator
//  Calculates suggested daily feed per unit based on:
//  Biomass × Feeding Rate (%) adjusted for avg weight range
// ══════════════════════════════════════════════════════════

// SFR Table: avgWt (g) → feeding rate (% of biomass/day)
// Based on Tilapia standard tables — adjustable in Settings
// SFR Table — Silver/Nile Tilapia at optimal temp (28-30°C)
// Sources: Skretting Tilapia Feeding Guide · BioMar Warm Water Tables
//          Cargill Aqua Nutrition · FAO Circular 854
//          Calibrated for Gulf/Bahrain conditions (RAS & pond)
var SFR_DEFAULT = [
  {maxWt:1,    rate:15.0, label:'< 1g (Fry)'},
  {maxWt:5,    rate:8.0,  label:'1-5g (Fingerling)'},
  {maxWt:10,   rate:7.0,  label:'5-10g'},
  {maxWt:20,   rate:5.5,  label:'10-20g'},
  {maxWt:50,   rate:4.0,  label:'20-50g'},
  {maxWt:100,  rate:3.0,  label:'50-100g'},
  {maxWt:150,  rate:2.5,  label:'100-150g'},
  {maxWt:200,  rate:2.2,  label:'150-200g'},
  {maxWt:300,  rate:1.8,  label:'200-300g'},
  {maxWt:400,  rate:1.5,  label:'300-400g'},
  {maxWt:500,  rate:1.3,  label:'400-500g'},
  {maxWt:9999, rate:1.1,  label:'> 500g'},
];

// Temp correction — interpolated lookup
// Ref: Uchida & King 1962 · BioMar warm-water correction · Gulf calibration
var TEMP_CORRECTION = [
  {t:15, f:0.20},{t:18,f:0.35},{t:20,f:0.50},{t:22,f:0.65},
  {t:24, f:0.80},{t:26,f:0.92},{t:27,f:0.97},{t:28,f:1.00},
  {t:29, f:1.00},{t:30,f:0.97},{t:31,f:0.92},{t:32,f:0.85},
  {t:33, f:0.75},{t:34,f:0.62},{t:35,f:0.50},{t:36,f:0.30},
  {t:40, f:0.10},
];
// DO correction lookup
var DO_CORRECTION = [
  {d:0, f:0.00},{d:2,f:0.15},{d:3,f:0.40},{d:4,f:0.65},
  {d:5, f:0.85},{d:6,f:0.95},{d:7,f:1.00},{d:20,f:1.00},
];

// getSFR: reads 12-band custom settings, falls back to SFR_DEFAULT industry table
function getSFR(avgWtG, fid){
  var cfg = getSettings(fid !== undefined ? fid : farmFilter);
  var w = parseFloat(avgWtG)||0;
  // 12-band custom lookup (saved in settings as sfr1..sfr12)
  var custom = [
    {maxWt:1,    key:'sfr1',  def:15.0},
    {maxWt:5,    key:'sfr2',  def:8.0},
    {maxWt:10,   key:'sfr3',  def:7.0},
    {maxWt:20,   key:'sfr4',  def:5.5},
    {maxWt:50,   key:'sfr5',  def:4.0},
    {maxWt:100,  key:'sfr6',  def:3.0},
    {maxWt:150,  key:'sfr7',  def:2.5},
    {maxWt:200,  key:'sfr8',  def:2.2},
    {maxWt:300,  key:'sfr9',  def:1.8},
    {maxWt:400,  key:'sfr10', def:1.5},
    {maxWt:500,  key:'sfr11', def:1.3},
    {maxWt:9999, key:'sfr12', def:1.1},
  ];
  // If any custom value is saved, use the custom table
  var hasCustom = custom.some(function(b){return cfg[b.key]!==undefined;});
  if(hasCustom){
    for(var i=0;i<custom.length;i++){
      if(w<=custom[i].maxWt) return parseFloat(cfg[custom[i].key])||custom[i].def;
    }
    return 1.1;
  }
  // Legacy 4-band settings (fr1-fr4)
  if(cfg.fr1||cfg.fr2||cfg.fr3||cfg.fr4){
    if(w<50)  return cfg.fr1||5;
    if(w<150) return cfg.fr2||4;
    if(w<300) return cfg.fr3||3;
    return cfg.fr4||2;
  }
  // Fallback to SFR_DEFAULT
  for(var j=0;j<SFR_DEFAULT.length;j++){
    if(w<=SFR_DEFAULT[j].maxWt) return SFR_DEFAULT[j].rate;
  }
  return 1.1;
}

// ── Interpolated correction factors (industry-accurate)
function _interpolate(table, keyField, valField, x){
  var t=parseFloat(x);
  if(isNaN(t)) return 1;
  if(t<=table[0][keyField]) return table[0][valField];
  if(t>=table[table.length-1][keyField]) return table[table.length-1][valField];
  for(var i=0;i<table.length-1;i++){
    var lo=table[i], hi=table[i+1];
    if(t>=lo[keyField]&&t<=hi[keyField]){
      var ratio=(t-lo[keyField])/(hi[keyField]-lo[keyField]);
      return lo[valField]+ratio*(hi[valField]-lo[valField]);
    }
  }
  return 1;
}
// Hard stop limits — feeding must STOP completely
var TEMP_STOP_HIGH = 33;  // °C — above this: stop feeding
var TEMP_STOP_LOW  = 17;  // °C — below this: stop feeding
var DO_STOP        = 2;   // mg/L — below this: stop feeding

function getTempFactor(temp){
  var t = parseFloat(temp)||28;
  if(t > TEMP_STOP_HIGH) return 0;  // STOP — heat stress critical
  if(t < TEMP_STOP_LOW)  return 0;  // STOP — too cold
  return _interpolate(TEMP_CORRECTION,'t','f',t);
}
function getDOFactor(doVal){
  var d = parseFloat(doVal);
  if(isNaN(d)||d<=0) return 1;      // no reading = don't penalize
  if(d <= DO_STOP)   return 0;      // STOP — oxygen too low
  return _interpolate(DO_CORRECTION,'d','f',d);
}
function isFeedingBlocked(temp, doVal){
  var t=parseFloat(temp)||28, d=parseFloat(doVal)||99;
  if(t>TEMP_STOP_HIGH) return {blocked:true, reason:'🌡 '+t+'°C — أوقف التغذية فوراً (> '+TEMP_STOP_HIGH+'°C)', color:'#dc2626'};
  if(t<TEMP_STOP_LOW)  return {blocked:true, reason:'🌡 '+t+'°C — أوقف التغذية فوراً (< '+TEMP_STOP_LOW+'°C)', color:'#2563eb'};
  if(d<=DO_STOP&&d>0)  return {blocked:true, reason:'💨 DO '+d+' mg/L — أوقف التغذية فوراً (≤ '+DO_STOP+' mg/L)', color:'#dc2626'};
  return {blocked:false};
}
// Temp status text
function _frTempNote(temp){
  var t=parseFloat(temp)||28;
  if(t>TEMP_STOP_HIGH) return '<span style="color:#f87171;font-weight:800">🛑 أوقف التغذية (> '+TEMP_STOP_HIGH+'°C)</span>';
  if(t<TEMP_STOP_LOW)  return '<span style="color:#60a5fa;font-weight:800">🛑 أوقف التغذية (< '+TEMP_STOP_LOW+'°C)</span>';
  if(t>=31) return '<span style="color:#fcd34d">🟡 إجهاد حراري — خفّض '+Math.round((1-getTempFactor(t))*100)+'%</span>';
  if(t>=26) return '<span style="color:#86efac">✅ نطاق مثالي للخليج (26-30°C)</span>';
  if(t>=22) return '<span style="color:#fcd34d">🟡 أقل من المثالي — خفّض '+Math.round((1-getTempFactor(t))*100)+'%</span>';
  if(t>=TEMP_STOP_LOW) return '<span style="color:#fca5a5">⚠️ بارد — خفّض '+Math.round((1-getTempFactor(t))*100)+'%</span>';
  return '<span style="color:#60a5fa;font-weight:800">🛑 أوقف التغذية (< '+TEMP_STOP_LOW+'°C)</span>';
}
function _frDONote(doVal){
  var d=parseFloat(doVal);
  if(isNaN(d)||d<=0) return '<span style="opacity:.6">اتركه فارغاً لو مش قاسه</span>';
  if(d>=7) return '<span style="color:#86efac">✅ DO ممتاز ≥7 — تغذية كاملة</span>';
  if(d>=6) return '<span style="color:#86efac">✅ DO جيد جداً — 95% تغذية</span>';
  if(d>=5) return '<span style="color:#fcd34d">🟡 DO مقبول — خفّض 15%</span>';
  if(d>=4) return '<span style="color:#fca5a5">⚠️ DO منخفض — خفّض 35%</span>';
  if(d>=3) return '<span style="color:#f87171">🔴 DO حرج — خفّض 60%</span>';
  return '<span style="color:#f87171">🔴 أوقف التغذية فوراً — DO حرج جداً</span>';
}
function _frFactorDisplay(tf,df){
  var combined=tf*df;
  var col=combined<0.6?'#f87171':combined<0.85?'#fcd34d':combined<0.95?'#86efac':'#4ade80';
  return '<div style="font-size:28px;font-weight:900;color:'+col+'">×'+n(combined,2)+'</div>'
    +'<div style="font-size:11px;opacity:.8;margin-top:4px">حرارة: ×'+n(tf,2)+' · DO: ×'+n(df,2)+'</div>';
}
function getSFRAdjusted(avgWtG,farm,temp,doVal){
  return getSFR(avgWtG,farm)*getTempFactor(temp)*getDOFactor(doVal);
}

function _frGridRows(liveRs,todayFeed,temp,doVal){
  var h='';
  var cols='130px 65px 70px 80px 60px 80px 95px 95px 110px';
  liveRs.forEach(function(r,idx){
    var sfrBase=getSFR(r.avgWt||0,r.farm);
    var sfrAdj=getSFRAdjusted(r.avgWt||0,r.farm,temp,doVal);
    var sugg=r.biomass*sfrAdj/100;
    var actual=(todayFeed||{})[r.unit]||0;
    var pct=sugg>0?actual/sugg*100:0;
    var isStop = sfrAdj===0;
    var sc,st;
    if(isStop){sc='#fee2e2';st='<span style="color:var(--red);font-weight:800">🛑 أوقف التغذية</span>';}

    else if(pct<80){sc='#fef3c7';st='<span style="color:var(--amber);font-weight:700">↓ ناقص '+n(sugg-actual,2)+'</span>';}
    else if(pct>120){sc='#fee2e2';st='<span style="color:var(--red);font-weight:700">↑ زيادة '+n(actual-sugg,2)+'</span>';}
    else{sc='#dcfce7';st='<span style="color:var(--green);font-weight:700">✅ ممتاز</span>';}
    var bg=idx%2===0?'#fff':'#fafdfb';
    h+='<div style="background:'+bg+';display:grid;grid-template-columns:'+cols+';gap:0;border-bottom:1px solid var(--line);align-items:center;min-height:34px;font-size:12px">';

    h+='<div style="padding:0 7px;font-weight:700;color:'+(actual>0?'var(--teal)':'var(--muted)')+'">'+(actual>0?n(actual,3):'—')+'</div>';
    h+='<div style="padding:0 7px;background:'+sc+'">'+st+'</div>';
    h+='</div>';
  });
  return h;
}

function frRecalc(){
  var tempEl=document.getElementById('fr-temp');
  var doEl=document.getElementById('fr-do');
  var temp=tempEl?parseFloat(tempEl.value)||28:28;
  var doVal=doEl?parseFloat(doEl.value)||0:0;
  var tf=getTempFactor(temp), df=getDOFactor(doVal);
  // Save
  var cfg=getSettings(farmFilter);
  cfg.waterTemp=temp; cfg.waterDO=doVal;
  saveSettings(cfg,farmFilter);
  // Update notes
  var tn=document.getElementById('fr-temp-note'); if(tn) tn.innerHTML=_frTempNote(temp);
  var dn=document.getElementById('fr-do-note');   if(dn) dn.innerHTML=_frDONote(doVal);
  var fd=document.getElementById('fr-factor-disp');if(fd) fd.innerHTML=_frFactorDisplay(tf,df);
  // Recalc
  var today=new Date().toISOString().slice(0,10);
  var todayFeed={};
  getTX().filter(function(t){return t.type==='feeding'&&t.date===today;}).forEach(function(t){todayFeed[t.unit]=(todayFeed[t.unit]||0)+(t.kg||0);});
  var liveRs=_txLiveRows().filter(function(r){return (r.fishNo||0)>0&&(farmFilter==='all'||r.farm===farmFilter);});
  var totSugg=liveRs.reduce(function(s,r){return s+r.biomass*getSFRAdjusted(r.avgWt||0,r.farm,temp,doVal)/100;},0);
  var totActual=Object.values(todayFeed).reduce(function(s,v){return s+v;},0);
  var diff=totActual-totSugg;
  var el;
  el=document.getElementById('fr-total-sugg'); if(el) el.textContent=n(totSugg,1)+' كجم';
  el=document.getElementById('kpi-sugg');      if(el) el.innerHTML=n(totSugg,1)+'<span style="font-size:12px"> كجم</span>';
  el=document.getElementById('kpi-diff');      if(el) el.innerHTML=(diff>=0?'+':'')+n(diff,1)+'<span style="font-size:12px"> كجم</span>';
  el=document.getElementById('kpi-tf');        if(el){el.textContent=tf===0?'🛑 STOP':'×'+n(tf,2);el.style.color=tf===0||tf<0.8?'var(--red)':tf<0.95?'var(--amber)':'var(--green)';}
  el=document.getElementById('kpi-df');        if(el){el.textContent=df===0?'🛑 STOP':'×'+n(df,2);el.style.color=df===0||df<0.8?'var(--red)':df<1?'var(--amber)':'var(--green)';}
  el=document.getElementById('footer-sugg');   if(el) el.textContent=n(totSugg,2)+' كجم';
  // Update STOP banner without full re-render
  var blocked=isFeedingBlocked(temp,doVal);
  var banner=document.getElementById('fr-stop-banner');
  var grid=document.getElementById('fr-grid-wrap');
  if(blocked.blocked){
    if(!banner){
      // Need full render only if banner doesn't exist yet
      show('feeding-regime');
    } else {
      banner.style.display='';
      if(banner.querySelector) { var sr=banner.querySelector('.fr-stop-reason'); if(sr) sr.innerHTML=blocked.reason||''; }
      if(grid) grid.style.opacity='0.3';
    }
  } else {
    if(banner) banner.style.display='none';
    if(grid) grid.style.opacity='1';
  }
  var gb=document.getElementById('fr-grid-body');if(gb) gb.innerHTML=_frGridRows(liveRs,todayFeed,temp,doVal);
}
