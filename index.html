// ══════════════════════════════════════════════════════════
//  FEED INVENTORY SYSTEM
//  Stock entries (purchases) + auto-consumption from TX
//  Running balance + reports
// ══════════════════════════════════════════════════════════
var FEED_INV_KEY = 'daracqua_feed_inventory_v1';
var _feedInvCache = null;

function getFeedInv(){
  if(_feedInvCache) return _feedInvCache;
  try{ _feedInvCache=JSON.parse(localStorage.getItem(FEED_INV_KEY)||'[]'); return _feedInvCache||[]; }catch(e){ return []; }
}
function saveFeedInv(arr){
  _feedInvCache=arr;
  try{ localStorage.setItem(FEED_INV_KEY,JSON.stringify(arr)); }catch(e){}
}
function addFeedInv(obj){
  var arr=getFeedInv();
  obj.id=Date.now()+'_'+Math.random().toString(36).slice(2,5);
  obj.ts=new Date().toISOString();
  arr.push(obj);
  saveFeedInv(arr);
  return obj;
}
function deleteFeedInv(id){
  saveFeedInv(getFeedInv().filter(function(x){return x.id!==id;}));
}

// Feed types in inventory
function getFeedTypes(){
  var types={};
  getFeedInv().forEach(function(e){ if(e.feedType) types[e.feedType]=1; });
  getTX().filter(function(t){return t.type==='feeding'&&t.feed;}).forEach(function(t){ types[t.feed]=1; });
  var def=['Starter 0.5mm','Starter 1mm','Starter 1.5mm','Grower 2mm','Grower 3mm','Finisher 4mm','Finisher 6mm'];
  def.forEach(function(d){ types[d]=1; });
  return Object.keys(types).sort();
}

// Compute running balance per feed type
function getFeedBalance(feedType, upToDate){
  var inv   = getFeedInv().filter(function(e){ return e.feedType===feedType && (!upToDate||e.date<=upToDate); });
  var txFeed= getTX().filter(function(t){ return t.type==='feeding' && t.feed===feedType && (!upToDate||t.date<=upToDate); });
  var purchased = inv.filter(function(e){return e.entryType==='purchase';}).reduce(function(s,e){return s+(e.kg||0);},0);
  var adjustments=inv.filter(function(e){return e.entryType==='adjustment';}).reduce(function(s,e){return s+(e.kg||0);},0);
  var consumed  = txFeed.reduce(function(s,t){return s+(t.kg||0);},0);
  return {purchased:purchased, consumed:consumed, adjustments:adjustments, balance:purchased+adjustments-consumed};
}

// All feed types balance summary
function getAllFeedBalances(){
  var types = getFeedTypes();
  return types.map(function(ft){
    var b = getFeedBalance(ft);
    return Object.assign({feedType:ft}, b);
  }).filter(function(b){return b.purchased>0||b.consumed>0;});
}

      h+='<td>'+Object.keys(byType[ft].units).length+'</td></tr>';
    });
    h+='</tbody></table></div></div>';

    // Daily chart
    h+='<div class="card"><div class="card-title">📈 الاستهلاك اليومي — آخر 30 يوم</div>';
    if(dateRows.length>1){
      var maxDay=Math.max.apply(null,dateRows.map(function(d){return byDate[d];}));
      var W=320,H=140,padL=40,padR=10,padT=14,padB=28;
      var pw=W-padL-padR, ph=H-padT-padB;
      var n2=dateRows.length;
      var xStep=n2>1?pw/(n2-1):pw;
      h+='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block">';
      // Grid lines
      [0,0.5,1].forEach(function(p){
        var y=padT+ph*(1-p);
        h+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="#e5e7eb" stroke-width="1"/>';
        h+='<text x="'+(padL-3)+'" y="'+(y+4)+'" text-anchor="end" font-size="9" fill="#9ca3af">'+n(maxDay*p,0)+'</text>';
      });
      // Area + line
      var pts=dateRows.map(function(d,i){return (padL+i*xStep)+','+(padT+ph*(1-(byDate[d]||0)/maxDay));});
      var area='M'+pts.join(' L')+' L'+(padL+(n2-1)*xStep)+','+(padT+ph)+' L'+padL+','+(padT+ph)+' Z';
      h+='<defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#067b72" stop-opacity="0.3"/><stop offset="100%" stop-color="#067b72" stop-opacity="0.02"/></linearGradient></defs>';
      h+='<path d="'+area+'" fill="url(#fg)"/>';
      h+='<path d="M'+pts.join(' L')+'" fill="none" stroke="#067b72" stroke-width="2" stroke-linejoin="round"/>';
      dateRows.forEach(function(d,i){
        var cx=padL+i*xStep, cy=padT+ph*(1-(byDate[d]||0)/maxDay);
        h+='<circle cx="'+cx+'" cy="'+cy+'" r="3" fill="#067b72" stroke="#fff" stroke-width="1.5"/>';
        if(i===0||i===n2-1||(n2>10&&i%Math.floor(n2/5)===0)){
          h+='<text x="'+cx+'" y="'+(padT+ph+16)+'" text-anchor="middle" font-size="8" fill="#9ca3af">'+d.slice(5)+'</text>';
        }
      });
      h+='</svg>';
      // Avg per day
      var totalLast30=dateRows.reduce(function(s,d){return s+(byDate[d]||0);},0);
      h+='<div style="text-align:center;font-size:12px;color:var(--muted);margin-top:8px">متوسط يومي: <strong style="color:var(--teal)">'+n(totalLast30/Math.max(1,dateRows.length),1)+' كجم</strong></div>';
    } else {
      h+='<div style="text-align:center;padding:24px;color:var(--muted)">لا توجد بيانات كافية</div>';
    }
    h+='</div>';
    h+='</div>'; // end grid2

    // Days remaining per type
    h+='<div class="card" style="margin-top:0"><div class="card-title">⏳ تقدير أيام المخزون المتبقية</div>';
    h+='<div class="tbl-scroll"><table><thead><tr><th>نوع العلف</th><th>الرصيد (كجم)</th><th>متوسط اليومي (آخر 30 يوم)</th><th>الأيام المتبقية (تقريبي)</th><th>تاريخ النفاد المتوقع</th></tr></thead><tbody>';
    getFeedTypes().forEach(function(ft){
      var bal=getFeedBalance(ft).balance;
      if(bal<=0) return;
      var consumed30=getTX().filter(function(t){return t.type==='feeding'&&t.feed===ft&&t.date>=from30;}).reduce(function(s,t){return s+(t.kg||0);},0);
      var dailyAvg=consumed30/30;
      var daysLeft=dailyAvg>0?Math.round(bal/dailyAvg):999;
      var runOutDate=dailyAvg>0?(function(){var d=new Date();d.setDate(d.getDate()+daysLeft);return d.toISOString().slice(0,10);})():'—';
      var urgency=daysLeft<7?'var(--red)':daysLeft<14?'var(--amber)':'var(--green)';
      h+='<tr>';
      h+='<td><strong>'+ft+'</strong></td>';
      h+='<td>'+n(bal,1)+' كجم</td>';
      h+='<td>'+n(dailyAvg,1)+' كجم</td>';
      h+='<td style="font-weight:700;color:'+urgency+'">'+(daysLeft>=999?'> 99':daysLeft)+' يوم</td>';
      h+='<td style="color:'+urgency+'">'+(dailyAvg>0?runOutDate:'—')+'</td>';
      h+='</tr>';
    });
    h+='</tbody></table></div></div>';
  }

  // ── Add Stock Modal (inline) ──
  h+='<div id="feed-inv-modal" style="display:none;margin-top:16px;background:#fff;border:1.5px solid var(--teal);border-radius:12px;padding:18px">';

  h+='<div class="field"><label>التاريخ</label><input type="date" id="inv-date" value="'+today+'" style="width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font:inherit;font-size:13px"/></div>';

  h+='</select></div>';
  h+='<div class="field" id="inv-new-type-wrap" style="display:none"><label>اسم النوع الجديد</label><input id="inv-new-type" placeholder="مثال: Grower 2.5mm" style="width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font:inherit;font-size:13px"/></div>';
  h+='<div class="field"><label>الكمية (كجم)</label><input type="number" id="inv-kg" placeholder="0.0" min="0" step="0.1" style="width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font:inherit;font-size:13px"/></div>';
  h+='<div class="field"><label>المورد / المصدر</label><input id="inv-supplier" placeholder="اسم المورد" style="width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font:inherit;font-size:13px"/></div>';
  h+='<div class="field"><label>رقم الفاتورة</label><input id="inv-invoice" placeholder="اختياري" style="width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font:inherit;font-size:13px"/></div>';
  h+='<div class="field"><label>السعر (BD/طن)</label><input type="number" id="inv-price" placeholder="0" min="0" step="0.01" style="width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font:inherit;font-size:13px"/></div>';
  h+='<div class="field"><label>ملاحظات</label><input id="inv-notes" placeholder="اختياري" style="width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font:inherit;font-size:13px"/></div>';
  h+='</div>';
  h+='<div style="display:flex;gap:8px"><button class="savebtn" style="flex:1" onclick="saveFeedInvEntry()">💾 حفظ</button><button class="ibtn" onclick="hideFeedModal()">إلغاء</button></div>';
  h+='</div>';
  return h;
}

function showAddFeedModal(){
  var el=document.getElementById('feed-inv-modal');
  if(el) el.style.display=el.style.display==='none'?'block':'none';
  var ft=document.getElementById('inv-feed-type');
  if(ft) ft.addEventListener('change',function(){
    var wrap=document.getElementById('inv-new-type-wrap');
    if(wrap) wrap.style.display=ft.value==='__new'?'block':'none';
  });
}
function hideFeedModal(){
  var el=document.getElementById('feed-inv-modal'); if(el) el.style.display='none';
}
function saveFeedInvEntry(){
  var entryType=document.getElementById('inv-entry-type').value;
  var date=document.getElementById('inv-date').value;
  var ftEl=document.getElementById('inv-feed-type');
  var feedType=ftEl.value==='__new'?(document.getElementById('inv-new-type').value.trim()):ftEl.value;
  var kg=parseFloat(document.getElementById('inv-kg').value||0);
  var supplier=document.getElementById('inv-supplier').value.trim();
  var invoice=document.getElementById('inv-invoice').value.trim();
  var price=parseFloat(document.getElementById('inv-price').value||0);
  var notes=document.getElementById('inv-notes').value.trim();
  if(!feedType||!kg){ toast('⚠️ نوع العلف والكمية مطلوبان'); return; }
  addFeedInv({entryType:entryType,date:date,feedType:feedType,kg:kg,supplier:supplier,invoice:invoice,price:price,notes:notes});
  toast('✅ تم تسجيل '+n(kg,1)+' كجم — '+feedType);
  hideFeedModal();
  _feedInvCache=null;
  show('feed-inventory');
}

async function photoSendToAI(){
  if(!_photoState.imageB64){ toast('⚠️ ارفع صورة أولاً'); return; }
  _photoState.status = 'reading';
  _photoState.parsed = null;
  show('photo-entry');

  var farm    = _photoState.farm;
  var mode    = _photoState.mode;
  var allUnits= allUnitNames().filter(function(u){ return u.startsWith(farm+'.'); });

  // Build prompt based on sheet type
  var prompt = '';
  if(mode==='feeding'){
    prompt = 'This is a fish feeding log sheet from a fish farm. ';
    prompt += 'Extract ALL feeding data. The sheet has columns: Tank (like 1.1, 1.2, etc or S1.1), meal at 8am, meal at 12pm, meal at 4pm (in kg), feed Size (pellet size like 1m,2m,3m), and dead (mortality count). ';
    prompt += 'The farm prefix is "'+farm+'" so tank "1.1" = unit "'+farm+'.S01T01" or map to the closest unit. Use this unit list as reference: '+allUnits.slice(0,20).join(',')+'. ';
    prompt += 'Return ONLY a JSON object with this exact structure, no markdown, no explanation: ';
    prompt += '{"rows":[{"tank":"F1.S01T01","meal8":1.2,"meal12":1.2,"meal4":1.2,"size":"3m","dead":0},...]}. ';
    prompt += 'If a value is blank or dashes, use null. Include ALL rows visible in the sheet.';
  } else if(mode==='sampling'){
    prompt = 'This is a fish sampling sheet. Extract tank/unit numbers and for each: sample count (number of fish weighed), total weight (grams), average weight per fish (grams), and any notes. ';
    prompt += 'Farm prefix "'+farm+'". Return ONLY JSON: {"rows":[{"tank":"F1.S01T01","sampleCount":30,"totalWt":9500,"avgWt":316.7,"notes":""},...]}';
  } else if(mode==='wq'){
    prompt = 'This is a water quality log sheet. Extract per tank: temperature (°C), dissolved oxygen DO (mg/L), pH, salinity (ppt), ammonia NH3 (mg/L), and notes. ';
    prompt += 'Farm prefix "'+farm+'". Return ONLY JSON: {"rows":[{"tank":"F1.S01T01","temp":28.5,"do":6.2,"ph":7.8,"salinity":0,"ammonia":0.02,"notes":""},...]}';
  }

  try{
    // Use sample capability (works in published artifact, no CSP issues)
    // Use Netlify AI proxy (works on GitHub Pages via candid-naiad)
    var sample = null; // Not using claude.use on GitHub Pages

    // Convert base64 to Blob for image input
    var b64 = _photoState.imageB64;
    var byteStr = atob(b64);
    var arr = new Uint8Array(byteStr.length);
    for(var i=0;i<byteStr.length;i++) arr[i]=byteStr.charCodeAt(i);
    var imgBlob = new Blob([arr], {type:'image/jpeg'});

    // Call Netlify AI proxy with image
    var aiResp = await fetch('https://candid-naiad-8afc22.netlify.app/.netlify/functions/ai', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 2000,
        messages: [{ role: 'user', content: [
          { type: 'image', source: { type: 'base64', media_type: _photoState.imageType||'image/jpeg', data: _photoState.imageB64 }},
          { type: 'text',  text: prompt }
        ]}]
      })
    });
    if(!aiResp.ok) throw new Error('AI proxy error: ' + aiResp.status);
    var aiData = await aiResp.json();
    var text = (aiData.content && aiData.content[0]) ? aiData.content[0].text : '';

    // Clean and parse JSON
    text = text.replace(/```json/g,'').replace(/```/g,'').trim();
    // Extract JSON if wrapped in text
    var jsonMatch = text.match(/\{[\s\S]*\}/);
    if(jsonMatch) text = jsonMatch[0];
    var parsed = JSON.parse(text);

    // Map tank numbers to full unit names
    if(parsed && parsed.rows){
      parsed.rows = parsed.rows.map(function(row){
        if(row.tank && !row.tank.startsWith(farm+'.')){
          var parts = String(row.tank).split('.');
          if(parts.length===2){
            var sec  = 'S'+String(parseInt(parts[0])).padStart(2,'0');
            var tnk  = 'T'+String(parseInt(parts[1])).padStart(2,'0');
            var match = allUnits.find(function(u){return u.indexOf(sec)>=0&&u.indexOf(tnk)>=0;});
            row.tank = match || (farm+'.'+sec+'.'+tnk);
          }
        }
        return row;
      });
    }

    _photoState.parsed = parsed;
    _photoState.status = 'review';
    _photoState.imageB64 = ''; // clear immediately
  }catch(err){
    _photoState.status = 'error';
    _photoState.errMsg = err.message || 'خطأ غير معروف';
    _photoState.imageB64 = '';
  }
  show('photo-entry');
}

function photoSaveAll(){
  var parsed = _photoState.parsed;
  if(!parsed||!parsed.rows||!parsed.rows.length){ toast('⚠️ لا توجد بيانات'); return; }
  var date = _photoState.date;
  var saved = 0;
  var mode  = _photoState.mode;

  parsed.rows.forEach(function(row){
    if(row.skip) return;
    if(!row.tank) return;

    if(mode==='feeding'){
      var meals = [
        {t:'8:00',  kg:parseFloat(row.meal8)||0},
        {t:'12:00', kg:parseFloat(row.meal12)||0},
        {t:'16:00', kg:parseFloat(row.meal4)||0},
      ];
      meals.forEach(function(m){
        if(m.kg>0){
          addTX({type:'feeding', date:date, unit:row.tank, kg:m.kg, meal:m.t, feed:row.size||'', notes:'Photo Entry'});
          saved++;
        }
      });
      // Mortality
      var dead = parseInt(row.dead)||0;
      if(dead>0){
        addTX({type:'mortality', date:date, unit:row.tank, count:dead, cause:'Photo Entry', notes:''});
        saved++;
      }
    } else if(mode==='sampling'){
      var cnt = parseInt(row.sampleCount)||0;
      var tw  = parseFloat(row.totalWt)||0;
      var avg = cnt>0&&tw>0 ? tw/cnt : parseFloat(row.avgWt)||0;
      if(avg>0){
        addTX({type:'sampling', date:date, unit:row.tank, avgWt:avg, sampleCount:cnt, totalWt:tw, notes:'Photo Entry'});
        saved++;
      }
    } else if(mode==='wq'){
      addTX({type:'water_quality', date:date, unit:row.tank,
        temp:parseFloat(row.temp)||null, do:parseFloat(row.do)||null,
        ph:parseFloat(row.ph)||null, salinity:parseFloat(row.salinity)||null,
        ammonia:parseFloat(row.ammonia)||null, notes:'Photo Entry'});
      saved++;
    }
  });

  _photoState.savedCount = saved;
  _photoState.status = 'done';
  _photoState.parsed = null;
  show('photo-entry');
  toast('✅ تم حفظ '+saved+' سجل بنجاح');
}

  _photoState.status = 'idle';
  _photoState.parsed = null;
  _photoState.imageB64 = '';
  _photoState.errMsg = '';
  show('photo-entry');
}

    }

    var msgs=[{role:'user',content:ctx}];

  }catch(err){
    var ldEl=document.getElementById(loadId);
    if(ldEl) ldEl.remove();
    chatEl.innerHTML+='<div style="display:flex;justify-content:flex-start"><div style="padding:10px 14px;border-radius:12px;background:#fff8f8;color:var(--red);font-size:12px">❌ '+err.message+'</div></div>';

function soColToggle(colId,checked){
  var COLS_KEY='daracqua_so_cols_v1';var saved;
  try{saved=JSON.parse(localStorage.getItem(COLS_KEY));}catch(e){saved=null;}
  var DEFAULT=['uid','fishNo','avgWt','biomass','density','utdFeed','lastSampDate','sgr','fcr'];

function sampSaveAll(){

  var saved=0;
  var latestSamp={};getTX().filter(function(t){return t.type==='sampling';}).sort(function(a,b){return a.date>b.date?1:-1;}).forEach(function(t){if(!latestSamp[t.unit])latestSamp[t.unit]=t;});

// ── Navigation history (back button) ──────────
var navHistory = [];

function show(v, skipHistory){
  // push previous to history (max 20)
  if(!skipHistory && currentView && currentView !== v){
    navHistory.push(currentView);
    if(navHistory.length > 20) navHistory.shift();
  }
  currentView = v;
  document.querySelectorAll('.nb,[data-v]').forEach(function(b){
    b.classList.toggle('on', b.dataset && b.dataset.v === v);
  });
  var el = document.getElementById('content');
  if(el) el.innerHTML = (VIEWS[v] || renderDashboard)();
  // update back button visibility
  updateBackBtn();
  // scroll content to top
  if(el) el.scrollTop = 0;
  try{ window.scrollTo(0,0); }catch(e){}
}

function goBack(){
  if(!navHistory.length) return;
  var prev = navHistory.pop();
  show(prev, true); // skipHistory so we don't re-push
}

function updateBackBtn(){
  var btn = document.getElementById('back-btn');
  if(!btn) return;
  if(navHistory.length > 0 && currentView !== 'dashboard'){
    btn.style.display = 'flex';
    var prev = navHistory[navHistory.length-1];
    var labels = {
      dashboard:isAr?'الرئيسية':'Home',
      units:isAr?'الوحدات':'Units',
      sections:isAr?'الأقسام':'Sections',
      alarms:isAr?'التنبيهات':'Alarms',
      smart:isAr?'التنبيهات الذكية':'Smart Alerts',
      daily:isAr?'الشيت اليومي':'Daily Sheet',
      logbook:isAr?'السجل':'Logbook',
      upload:isAr?'رفع XLS':'Upload',
      calcs:'FCR · SGR',
      trend:'Growth Trend',
      density:isAr?'الكثافة':'Density',
      biomass:isAr?'الكتلة الحيوية':'Biomass',
      pdf:'PDF',
      setup:isAr?'إعداد المزرعة':'Setup',
      settings:isAr?'الإعدادات':'Settings',
      ai:isAr?'المستشار الذكي':'AI',
      profile:isAr?'البروفايل':'Profile',
      'site-overview':isAr?'Site Overview':'Site Overview',
      'tx-feeding':isAr?'التغذية':'Feeding',
      'tx-mortality':isAr?'النفوق':'Mortality',
      'tx-sampling':'Sampling',

  var reg = getFarmsRegistry(); // {farmId: label}

  // 1. From RAW data
  RAW.forEach(function(r){ if(r.farm && !seen[r.farm]){ seen[r.farm]=1; } });

  // 2. From custom units — use stored farm field, NOT derived from name
  getFarmUnits().forEach(function(u){
    var fid = u.farm || '';
    // Only use prefix derivation if name clearly follows F#. pattern
    if(!fid && u.name && /^F\d+\./.test(u.name)){
      fid = u.name.match(/^(F\d+)/)[1];
    }
    if(fid && !seen[fid]){ seen[fid]=1; }
  });

  // 3. From farm registry (manually defined farms)
  Object.keys(reg).forEach(function(fid){ seen[fid]=1; });

  // Build sorted list with labels from registry
  Object.keys(seen).sort().forEach(function(fid){
    farms[fid] = reg[fid] || fid;
  });
  return farms;
}

// Count units per farm (RAW + custom)
function farmUnitCount(fid){
  if(fid==='all') return RAW.length + getFarmUnits().length;
  var rawCount = RAW.filter(function(r){return r.farm===fid;}).length;
  var customCount = getFarmUnits().filter(function(u){
    var uf = u.farm || (/^F\d+\./.test(u.name||'') ? (u.name.match(/^(F\d+)/)||['',''])[1] : '');
    return uf===fid;
  }).length;
  return rawCount + customCount;
}

function buildFarmDD(){
  var farms = getFarmList();
  var menu = document.getElementById('farm-dd-options');
  if(!menu) return;
  var html = '';
  Object.keys(farms).forEach(function(fid){
    var label = farms[fid];
    var isActive = farmFilter === fid;
    var count = farmUnitCount(fid);
    html += '<button onclick="setFarm(\''+fid+'\');closeFarmDD()" style="display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:'+(isActive?'#f0f5f3':'#fff')+';padding:10px 14px;font:inherit;font-size:13px;color:'+(isActive?'#067b72':'#153238')+';font-weight:'+(isActive?'700':'400')+';cursor:pointer;text-align:start;border-bottom:1px solid #f3f4f6" onmouseover="this.style.background=\'#f0f5f3\'" onmouseout="this.style.background=\''+(isActive?'#f0f5f3':'#fff')+'\'">';
    html += '<span>'+(isActive?'✓ ':'')+label+'</span>';
    html += '<span style="font-size:11px;color:#9db5b2;background:#f1f5f9;border-radius:99px;padding:1px 7px">'+count+'</span>';
    html += '</button>';
  });
  menu.innerHTML = html;
  // Update label
  var lbl = document.getElementById('farm-dd-label');
  if(lbl) lbl.textContent = farms[farmFilter] || farmFilter;
  // Rebuild mobile drawer farm chips dynamically
  var mobileWrap = document.getElementById('mobile-farm-chips');
  if(mobileWrap){
    var mhtml='';
    Object.keys(farms).forEach(function(fid){
      var isAct=farmFilter===fid;
      mhtml+='<button id="mfb-'+fid+'" onclick="setFarm(\''+fid+'\');closeDrawerDirect()" class="chip'+(isAct?' active':'')+'" style="flex:1;font-size:11px">'+farms[fid]+'</button>';
    });
    mobileWrap.innerHTML=mhtml;
  }
}

function toggleFarmDD(){
  var menu = document.getElementById('farm-dd-menu');
  if(!menu) return;
  var isOpen = menu.style.display !== 'none';
  if(!isOpen){ buildFarmDD(); menu.style.display='block'; }
  else { menu.style.display='none'; }
}

function closeFarmDD(){
  var menu = document.getElementById('farm-dd-menu');
  if(menu) menu.style.display='none';
}

// Close dropdown when clicking outside
document.addEventListener('click', function(e){
  var wrap = document.getElementById('farm-dd-wrap');
  if(wrap && !wrap.contains(e.target)) closeFarmDD();
});

function setFarm(f){
  farmFilter = f;
  // Update dropdown label
  var farms = getFarmList();
  var lbl = document.getElementById('farm-dd-label');
  if(lbl) lbl.textContent = farms[f] || f;
  // Update mobile chips — toggle active on all existing, or rebuild
  document.querySelectorAll('#mobile-farm-chips button').forEach(function(btn){
    btn.classList.toggle('active', btn.id === 'mfb-'+f);
  });
  show(currentView);
}

function toggleLang(){
  isAr = !isAr;
  document.documentElement.lang = isAr ? 'ar' : 'en';
  document.documentElement.dir  = isAr ? 'rtl' : 'ltr';
  var lb = document.getElementById('lang-btn');
  if(lb) lb.textContent = isAr ? 'EN' : 'عربي';
  show(currentView);
}
