<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0D3B38">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dar Aqua">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Dar Aqua — Farm Manager Demo</title>
<style>
:root{
  --teal:#067b72;--deep:#062f35;--lime:#b8e178;--paper:#f0f5f3;
  --white:#fff;--ink:#153238;--muted:#6b8a87;--line:#dce8e4;
  --red:#dc2626;--amber:#d97706;--green:#16a34a;
  --shadow:0 4px 20px #06303511;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.5 'Segoe UI','IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--paper);color:var(--ink)}
.top{height:56px;background:var(--deep);display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:12px;position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:15px}
.logo{width:32px;height:32px;border-radius:8px;background:var(--lime);color:var(--deep);display:grid;place-items:center;font-size:18px;font-weight:900}
.top-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:5px 11px;font:inherit;font-size:12px;cursor:pointer}
.chip:hover{background:rgba(255,255,255,.2)}
.chip.active{background:var(--lime);color:var(--deep);border-color:var(--lime);font-weight:700}
.shell{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 56px)}
.sidebar{background:var(--white);border-inline-end:1px solid var(--line);padding:14px 8px 70px;display:flex;flex-direction:column;gap:2px;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto}
.sg{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted);padding:10px 10px 4px;text-transform:uppercase}
.nb{display:flex;align-items:center;gap:8px;width:100%;text-align:start;border:0;border-radius:7px;padding:8px 10px;background:transparent;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;border-inline-start:3px solid transparent}
.nb:hover{background:var(--paper);color:var(--ink)}
.nb.on{background:#eef7f3;color:var(--teal);border-inline-start-color:var(--teal);font-weight:600}
.content{padding:20px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:15px 16px;box-shadow:var(--shadow)}
.kpi-lbl{font-size:11px;color:var(--muted);font-weight:600}
.kpi-val{font-size:24px;font-weight:700;color:var(--deep);margin:6px 0 2px;line-height:1}
.kpi-sub{font-size:11px;color:var(--muted)}
.kpi.kalarm .kpi-val{color:var(--red)}
.kpi.kwarn .kpi-val{color:var(--amber)}
.kpi.kok .kpi-val{color:var(--green)}
.card{background:var(--white);border:1px solid var(--line);border-radius:13px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.card-title{font-size:14px;font-weight:700;color:var(--deep);margin-bottom:14px;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tbl-wrap{overflow-x:auto;border-radius:9px;border:1px solid var(--line)}
.tbl-scroll{max-height:480px;overflow-y:auto;border-radius:9px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:12px}
th{background:#edf4f1;color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:9px 10px;white-space:nowrap;text-align:start;position:sticky;top:0;z-index:2}
td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tr:hover td{background:#f5faf8}
.sum-row td{background:#edf4f1;font-weight:700;border-top:2px solid var(--teal)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.pill-alarm{background:#fee2e2;color:#991b1b}
.pill-warn{background:#fef3c7;color:#92400e}
.pill-ok{background:#dcfce7;color:#166534}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters input,.filters select{border:1px solid var(--line);border-radius:7px;padding:7px 10px;font:inherit;font-size:12px;background:var(--white);color:var(--ink);outline:none}
.filters input:focus,.filters select:focus{border-color:var(--teal)}
.alarm-list{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto}
.alarm-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--white)}
.alarm-row.is-alarm{border-color:#fca5a5;background:#fff8f8}
.alarm-row.is-warn{border-color:#fcd34d;background:#fffdf0}
.alarm-unit{font-weight:700;font-size:13px}
.alarm-detail{font-size:11px;color:var(--muted);margin-top:2px}
.sec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:16px}
.sec-card{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.ph h2{font-size:20px;font-weight:700;color:var(--deep)}
.ph p{font-size:12px;color:var(--muted);margin-top:2px}
.bar-outer{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar-inner{height:100%;border-radius:99px}
/* daily log */
.tabs{display:flex;border-bottom:2px solid var(--line);margin-bottom:18px;gap:0}
.tab{border:0;background:transparent;font:inherit;font-size:13px;color:var(--muted);padding:10px 18px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;font-weight:500;transition:.12s}
.tab.on{color:var(--teal);border-bottom-color:var(--teal);font-weight:700}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;font:inherit;font-size:14px;background:var(--white);color:var(--ink);outline:none;transition:.12s;-webkit-appearance:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px #067b7218}
.field textarea{resize:vertical;min-height:70px}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.savebtn{width:100%;padding:14px;background:var(--teal);color:#fff;border:0;border-radius:10px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;letter-spacing:.02em}
.savebtn:hover{background:#05685f}
.savebtn:active{transform:scale(.98)}
.wq-badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
.wq-ok{background:#dcfce7;color:#15803d}
.wq-warn{background:#fef3c7;color:#a16207}
.wq-bad{background:#fee2e2;color:#dc2626}
.log-card{background:var(--white);border:1px solid var(--line);border-radius:11px;padding:13px 15px;margin-bottom:10px;box-shadow:var(--shadow)}
.log-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.log-unit{font-weight:700;font-size:14px;color:var(--deep)}
.log-date{font-size:11px;color:var(--muted)}
.log-vals{display:flex;gap:16px;flex-wrap:wrap;font-size:12px}
.log-vals span{color:var(--muted)}
.log-vals strong{color:var(--ink)}
.del-btn{border:0;background:#fee2e2;color:#dc2626;border-radius:6px;padding:4px 9px;font-size:11px;cursor:pointer;font-weight:600}
.toast-msg{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--deep);color:#fff;padding:11px 22px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
.toast-msg.show{opacity:1}
/* ── Mobile nav bar ── */
.mob-nav{
  display:none;position:fixed;bottom:0;left:0;right:0;
  background:var(--white);border-top:1px solid var(--line);
  z-index:80;
  padding:0 0 env(safe-area-inset-bottom,0);
  box-shadow:0 -4px 20px #0000000d;
}
.mob-nav-inner{display:flex;width:100%}
.mob-nav button{
  flex:1;border:0;background:transparent;font:inherit;
  font-size:9px;color:var(--muted);
  padding:10px 2px 9px;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-weight:500;min-width:0;transition:.12s;
  -webkit-tap-highlight-color:transparent;
}
.mob-nav button .mi{font-size:22px;line-height:1.1}
.mob-nav button.on{color:var(--teal);font-weight:700}
.mob-nav button.on .mi{transform:scale(1.1)}
/* Mobile top — hide farm chips, show menu */
.mob-top-title{display:none;font-size:14px;font-weight:700;color:#fff}
/* More menu drawer */
.drawer{display:none;position:fixed;inset:0;z-index:200;background:#0007}
.drawer.open{display:block}
.drawer-panel{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0));max-height:70vh;overflow-y:auto;transform:translateY(100%);transition:transform .25s cubic-bezier(.4,0,.2,1)}
.drawer.open .drawer-panel{transform:translateY(0)}
.drawer-handle{width:40px;height:4px;background:var(--line);border-radius:99px;margin:0 auto 16px}
.drawer-item{display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:10px;font-size:14px;color:var(--ink);cursor:pointer;border:0;background:transparent;width:100%;text-align:start;font:inherit}
.drawer-item:hover,.drawer-item.on{background:var(--paper);color:var(--teal);font-weight:600}
.drawer-sg{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted);padding:12px 12px 4px;text-transform:uppercase}
/* Responsive breakpoints */
@media(max-width:800px){
  .shell{grid-template-columns:1fr;min-height:calc(100vh - 56px)}
  .sidebar{display:none}
  .kpis{grid-template-columns:repeat(2,1fr);gap:10px}
  .grid2{grid-template-columns:1fr}
  .fg3{grid-template-columns:1fr 1fr}
  .mob-nav{display:block}
  .content{padding:14px 14px calc(74px + env(safe-area-inset-bottom,0))}
  .top{padding:0 14px}
  .top-right .chip:not(#lang-btn){display:none}
  .mob-top-title{display:block}
  .brand span{display:none}
  .ph h2{font-size:17px}
  .card{padding:14px}
  table{font-size:11px}
  td,th{padding:7px 8px}
  .alarm-row{flex-wrap:wrap;gap:8px}
  .sec-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .sec-card{padding:10px 11px}
  .kpi-val{font-size:20px}
  .tabs{overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
  .tab{padding:10px 14px;font-size:12px}
  .fg2{grid-template-columns:1fr}
  .drop-zone{padding:28px 16px}
  .filters{gap:6px}
  .filters input{min-width:0;flex:1}
}
@media(max-width:400px){
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .kpi{padding:12px}
  .kpi-val{font-size:18px}
}
/* upload styles */
.drop-zone{border:2.5px dashed var(--line);border-radius:14px;padding:40px 20px;text-align:center;cursor:pointer;transition:.15s;background:var(--white)}
.drop-zone:hover,.drop-zone.over{border-color:var(--teal);background:#f0faf7}
.drop-icon{font-size:44px;margin-bottom:10px}
.drop-title{font-size:16px;font-weight:700;color:var(--deep);margin-bottom:5px}
.drop-sub{font-size:12px;color:var(--muted)}
.diff-table{border-collapse:collapse;width:100%;font-size:12px}
.diff-table th{background:#edf4f1;padding:8px 10px;text-align:start;font-size:10px;font-weight:700;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.diff-table td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.diff-up{color:var(--green);font-weight:700}
.diff-down{color:var(--red);font-weight:700}
.diff-same{color:var(--muted)}
.step-badge{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--teal);color:#fff;font-size:12px;font-weight:700;flex-shrink:0}
.step-row{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.step-body{flex:1}
.step-title{font-weight:700;font-size:14px;color:var(--deep);margin-bottom:3px}
.step-desc{font-size:12px;color:var(--muted);line-height:1.6}
/* ── Sheet inputs fix ── */
.sh-inp{
  border:2px solid var(--line) !important;
  border-radius:7px;
  font:inherit;
  font-size:13px;
  text-align:center;
  background:#fff !important;
  color:var(--ink) !important;
  padding:6px 8px;
  transition:border-color .15s;
}
.sh-inp:focus{
  border-color:var(--teal) !important;
  outline:none;
  box-shadow:0 0 0 3px rgba(6,123,114,.12);
}
.sh-inp::placeholder{ color:#9db5b2 !important; }
.sh-inp-text{
  border:2px solid var(--line) !important;
  border-radius:7px;
  font:inherit;
  font-size:12px;
  background:#fff !important;
  color:var(--ink) !important;
  padding:6px 8px;
  transition:border-color .15s;
}
.sh-inp-text:focus{ border-color:var(--teal) !important; outline:none; }
.sh-inp-text::placeholder{ color:#9db5b2 !important; }
/* Date bar */
.date-bar{
  display:flex;align-items:center;gap:8px;
  background:var(--white);border:1.5px solid var(--line);
  border-radius:10px;padding:7px 14px;
  box-shadow:0 1px 4px #0000000a;
}
.date-bar input[type=date]{
  border:0;font:inherit;font-size:15px;font-weight:700;
  color:var(--deep);background:transparent;outline:none;cursor:pointer;
}
.date-chip{
  background:var(--paper);border:1.5px solid var(--line);
  border-radius:7px;padding:5px 12px;font:inherit;font-size:12px;
  font-weight:600;color:var(--ink);cursor:pointer;
  transition:.12s;white-space:nowrap;
}
.date-chip:hover{border-color:var(--teal);color:var(--teal);}
.date-chip.today{background:var(--teal);color:#fff;border-color:var(--teal);}
/* auth screen */
.auth-screen{display:none;position:fixed;inset:0;background:var(--deep);z-index:500;align-items:center;justify-content:center;padding:20px}
.auth-screen.open{display:flex}
.auth-box{background:var(--white);border-radius:20px;padding:32px;max-width:420px;width:100%;box-shadow:0 24px 80px #0005}
.auth-logo{width:56px;height:56px;border-radius:14px;background:var(--lime);color:var(--deep);display:grid;place-items:center;font-size:28px;font-weight:900;margin:0 auto 16px}
.auth-title{text-align:center;font-size:22px;font-weight:700;color:var(--deep);margin-bottom:4px}
.auth-sub{text-align:center;font-size:13px;color:var(--muted);margin-bottom:24px}
.auth-tabs{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:20px}
.auth-tab{flex:1;border:0;background:transparent;font:inherit;font-size:13px;color:var(--muted);padding:10px;cursor:pointer;font-weight:500;transition:.12s}
.auth-tab.on{background:var(--teal);color:#fff;font-weight:700}
.auth-msg{padding:10px 14px;border-radius:8px;font-size:12px;margin-bottom:12px;display:none}
.auth-msg.error{background:#fee2e2;color:#991b1b;display:block}
.auth-msg.success{background:#dcfce7;color:#166534;display:block}
.auth-msg.info{background:#f0f9ff;color:#0c4a6e;display:block}
.user-pill{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:5px 10px;font-size:12px;color:#fff}
/* wizard */
.wiz-steps{display:flex;gap:0;margin-bottom:24px;background:var(--white);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.wiz-step{flex:1;text-align:center;padding:12px 6px;font-size:11px;color:var(--muted);font-weight:600;border-inline-end:1px solid var(--line);cursor:pointer;transition:.12s;position:relative}
.wiz-step:last-child{border-inline-end:0}
.wiz-step.done{background:#eef7f3;color:var(--teal)}
.wiz-step.active{background:var(--teal);color:#fff}
.wiz-step .ws-num{display:block;font-size:18px;margin-bottom:3px}
.unit-card{background:var(--white);border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:flex-start;gap:12px}
.unit-card-info{flex:1;min-width:0}
.unit-card-name{font-weight:700;font-size:14px;color:var(--deep)}
.unit-card-meta{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.6}
.unit-card-actions{display:flex;gap:6px;flex-shrink:0}
.ibtn{border:1px solid var(--line);border-radius:7px;padding:6px 10px;background:var(--white);color:var(--ink);font:inherit;font-size:12px;cursor:pointer;font-weight:500}
.ibtn:hover{border-color:var(--teal);color:var(--teal)}
.ibtn.danger{color:var(--red);border-color:#fca5a5;background:#fff8f8}
.ibtn.danger:hover{background:#fee2e2}
.modal-overlay{display:none;position:fixed;inset:0;background:#0007;z-index:300;padding:20px;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal-box{background:var(--white);border-radius:16px;padding:22px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 24px 80px #0003}
.modal-box h3{font-size:17px;font-weight:700;color:var(--deep);margin-bottom:16px}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<header class="top">
  <div class="brand" onclick="goHome()">
    <div class="logo">🐟</div>
    <span>Dar Aqua — Farm Manager</span>
    <span id="sb-status" style="font-size:11px;font-weight:600;opacity:.8;margin-inline-start:2px">⏳</span>
  </div>
  <div class="top-right">
    <span id="user-badge" style="cursor:pointer;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:5px 12px;font-size:12px;color:#fff;margin-inline-end:8px;white-space:nowrap" onclick="currentUser?show('user-management'):show('login-page')">🔑 دخول</span><button id="back-btn" onclick="goBack()" style="display:none;align-items:center;gap:6px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:6px 12px;color:#fff;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap">
      <span style="font-size:15px">←</span>
      <span id="back-lbl"></span>
    </button>
    <div style="position:relative" id="farm-dd-wrap">
      <button id="farm-dd-btn" onclick="toggleFarmDD()" style="display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 12px;color:#fff;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;min-width:110px;justify-content:space-between">
        <span id="farm-dd-label">الكل</span>
        <span style="font-size:10px;opacity:.8">▼</span>
      </button>
      <div id="farm-dd-menu" style="display:none;position:absolute;top:calc(100% + 6px);right:0;left:auto;background:#fff;border-radius:10px;box-shadow:0 8px 32px #0003;min-width:160px;z-index:200;overflow:hidden;border:1px solid #e5e7eb">
        <div id="farm-dd-options"></div>
      </div>
    </div>
    <button class="chip" id="lang-btn" onclick="toggleLang()">EN</button>

  </div>
</header>

<div id="auth-screen" style="display:none"></div>

<div class="shell">
  <nav class="sidebar">
    <div class="sg">الرئيسية</div>
    <button class="nb on" data-v="dashboard" onclick="show('dashboard')">📊 لوحة التحكم</button>
    <button class="nb" data-v="site-overview" onclick="show('site-overview')">🗂️ Site Overview</button>
    <button class="nb" data-v="daily-overview" onclick="show('daily-overview')" style="border-inline-start:3px solid var(--lime);font-weight:600">📅 التقرير اليومي</button>
    <button class="nb" data-v="smart" onclick="show('smart')" id="smart-btn">🔔 التنبيهات الذكية</button>

function st(rs){

  return {fish:fish,bio:bio,alarms:alarms,warns:warns,avgD:rs.length?dens/rs.length:0,total:rs.length};
}

// ── SVG Chart Helpers ─────────────────────────
function donutChart(vals, colors, size){
  size = size||160;
  var total = vals.reduce(function(a,b){return a+b;},0);
  if(!total) return '<svg width="'+size+'" height="'+size+'"><circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+(size/2-8)+'" fill="none" stroke="#e5e7eb" stroke-width="18"/></svg>';
  var r = size/2-10, cx=size/2, cy=size/2;
  var circ = 2*Math.PI*r;
  var offset = 0, paths='';
  vals.forEach(function(v,i){
    if(!v) return;
    var pct = v/total;
    var dash = pct*circ;
    var gap  = circ - dash;
    paths += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+colors[i]+'" stroke-width="18" stroke-dasharray="'+dash.toFixed(2)+' '+gap.toFixed(2)+'" stroke-dashoffset="'+(-offset*circ/1+circ/4*-1+circ*0.25).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')" style="transition:stroke-dasharray .4s"/>';
    offset += pct;
  });
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+paths+'</svg>';
}

function barChartSVG(items, maxVal, W, H, barColor){
  // items: [{lbl, val}]
  W=W||320; H=H||160;
  var pad={t:10,r:8,b:28,l:8};
  var bw = (W-pad.l-pad.r)/items.length - 4;
  var svg='<svg width="100%" viewBox="0 0 '+W+' '+H+'" style="display:block">';
  // grid lines
  [0.25,0.5,0.75,1].forEach(function(p){
    var y=pad.t+(H-pad.t-pad.b)*(1-p);
    svg+='<line x1="'+pad.l+'" y1="'+y+'" x2="'+(W-pad.r)+'" y2="'+y+'" stroke="#e5e7eb" stroke-width="1"/>';
  });
  items.forEach(function(item,i){
    var pct = maxVal>0 ? item.val/maxVal : 0;
    var bh  = Math.max(2, (H-pad.t-pad.b)*pct);
    var x   = pad.l + i*(bw+4);
    var y   = H-pad.b-bh;
    var col = item.col || barColor || '#067b72';
    // bar with rounded top
    svg+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="3" fill="'+col+'" opacity="0.9"/>';
    // value label on top
    if(item.val>0){
      var lbl = item.val>=1000?(item.val/1000).toFixed(1)+'k':String(Math.round(item.val));
      svg+='<text x="'+(x+bw/2)+'" y="'+(y-3)+'" text-anchor="middle" font-size="9" fill="#6b8a87">'+lbl+'</text>';
    }
    // x label (truncate)
    var xl = item.lbl.length>7?item.lbl.slice(0,6)+'…':item.lbl;
    svg+='<text x="'+(x+bw/2)+'" y="'+(H-pad.b+12)+'" text-anchor="middle" font-size="8.5" fill="#6b8a87">'+xl+'</text>';
  });
  svg+='</svg>';
  return svg;
}

function sparkLine(vals, W, H, color){
  W=W||200; H=H||50; color=color||'#067b72';
  if(vals.length<2) return '';
  var mx=Math.max.apply(null,vals), mn=Math.min.apply(null,vals);
  if(mx===mn){mx+=1;mn-=1;}
  var pts=vals.map(function(v,i){
    var x=i/(vals.length-1)*W;
    var y=H-(v-mn)/(mx-mn)*(H-6)-3;
    return x+','+y;
  });
  var area='M'+pts[0]+' '+pts.map(function(p){return 'L'+p;}).join(' ')+' L'+W+','+(H+2)+' L0,'+(H+2)+' Z';
  var line='M'+pts[0]+' '+pts.map(function(p){return 'L'+p;}).join(' ');
  return '<svg width="100%" viewBox="0 0 '+W+' '+H+'" style="display:block;overflow:visible">'
    +'<defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+color+'" stop-opacity="0.3"/><stop offset="100%" stop-color="'+color+'" stop-opacity="0.02"/></linearGradient></defs>'
    +'<path d="'+area+'" fill="url(#sg)"/>'
    +'<path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round"/>'
    +'<circle cx="'+pts[pts.length-1].split(',')[0]+'" cy="'+pts[pts.length-1].split(',')[1]+'" r="3" fill="'+color+'"/>'
    +'</svg>';
}

        h+='<div style="background:var(--paper);border-radius:8px;padding:10px">';
        h+='<div style="font-size:11px;color:var(--muted);margin-bottom:4px">'+p.lbl+'</div>';

        h+='<div style="font-size:10px;color:var(--muted)">↓'+n(mn,1)+' ↑'+n(mx,1)+'</div>';
        h+='</div>';
      });
      h+='</div>';
    } else {
      h+='<div style="padding:32px;text-align:center;color:var(--muted);font-size:12px">';
      h+=(isAr?'سجّل قراءات الماء من الشيت اليومي':'Log water readings from Daily Sheet');
      h+='</div>';
    }
    h+='</div>';
    h+='</div>'; // end row4
  }

  return h;
}

function renderAlarms(){
  var cfg=getSettings();
  var dAlarm=cfg.densAlarm||25, dWarn=cfg.densWarn||15;
  var cAlarm=cfg.cntAlarm||120, cWarn=cfg.cntWarn||80;
  var allRs=rows();

  // Compute count density for each unit
  function cntDens(r){
    var vol=r.volume||(r.biomass&&r.density?Math.round(r.biomass/r.density*10)/10:0);
    return vol>0?Math.round(r.fishNo/vol):0;
  }

  // Filter: weight alarm OR count alarm/warn
  var rs=allRs.filter(function(r){
    return r.alarm||r.warn||cntDens(r)>=cWarn;
  }).sort(function(a,b){ return b.density-a.density; });

  var wAlarms=rs.filter(function(r){return r.alarm;}).length;
  var wWarns=rs.filter(function(r){return r.warn&&!r.alarm;}).length;
  var cAlarms=rs.filter(function(r){return cntDens(r)>=cAlarm;}).length;
  var cWarns=rs.filter(function(r){return cntDens(r)>=cWarn&&cntDens(r)<cAlarm;}).length;

  var h='<div class="ph"><div>';
  h+='<h2>🚨 '+(isAr?'تنبيهات الكثافة':'Density Alarms')+'</h2>';
  h+='<p>'+rs.length+' '+(isAr?'وحدة تحتاج متابعة':'units need attention')+'</p></div>';

  h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">';

  h+='<span style="font-weight:700;color:#dc2626">🔴 '+wAlarms+'</span> <span style="color:#991b1b">'+(isAr?'كثافة وزن خطر (>'+dAlarm+' كجم/م³)':'Weight alarm (>'+dAlarm+' kg/m³)')+'</span></div>';
  h+='<div style="background:#fef9c3;border-radius:8px;padding:8px 14px;font-size:12px">';
  h+='<span style="font-weight:700;color:#d97706">🟡 '+wWarns+'</span> <span style="color:#92400e">'+(isAr?'تحذير وزن (>'+dWarn+' كجم/م³)':'Weight warn (>'+dWarn+' kg/m³)')+'</span></div>';

  h+='<span style="font-weight:700;color:#be185d">🐟 '+cAlarms+'</span> <span style="color:#9d174d">'+(isAr?'كثافة عدد خطر (>'+cAlarm+' سمكة/م³)':'Count alarm (>'+cAlarm+' fish/m³)')+'</span></div>';

  h+='<span style="font-weight:700;color:#7c3aed">🐠 '+cWarns+'</span> <span style="color:#5b21b6">'+(isAr?'تحذير عدد (>'+cWarn+' سمكة/م³)':'Count warn (>'+cWarn+' fish/m³)')+'</span></div>';

  rs.forEach(function(r){

    // Weight density
    h+='<div style="text-align:center;padding:6px 12px;background:rgba(0,0,0,.04);border-radius:8px">';

function filterU(s,status){
  s=s.toLowerCase();
  var rs=rows().filter(function(r){
    var ms=!s||r.unit.toLowerCase().indexOf(s)>=0||r.section.toLowerCase().indexOf(s)>=0;
    var mt=!status||(status==='alarm'&&r.alarm)||(status==='warn'&&r.warn)||(status==='ok'&&!r.alarm&&!r.warn);
    return ms&&mt;
  });
  var el=document.getElementById('utb');
  if(el) el.innerHTML=urows(rs);
}

var _sampleCapability = null;
async function getAISample(){
  if(_sampleCapability) return _sampleCapability;
  try{
    if(typeof claude !== 'undefined' && claude && claude.use){
      _sampleCapability = await claude.use('sample');
      return _sampleCapability;
    }

async function sbAuth(path, body){
  var resp = await fetch(SB_URL+'/auth/v1/'+path, {
    method: 'POST',
    headers: {'Content-Type':'application/json','apikey':SB_KEY},
    body: JSON.stringify(body)
  });
  var data = await resp.json();
  if(!resp.ok) throw new Error(data.error_description||data.msg||'Auth error '+resp.status);
  return data;
}

async function doLogin(){
  var email=(document.getElementById('auth-email')||{}).value||'';
  var pass=(document.getElementById('auth-pass')||{}).value||'';
  if(!email||!pass){toast('⚠️ ادخل الإيميل وكلمة السر');return;}
  var btn=document.getElementById('auth-btn');
  if(btn){btn.disabled=true;btn.textContent='⏳ جاري الدخول...';}
  try{
    var data=await sbAuth('token?grant_type=password',{email:email,password:pass});
    currentUser=data.user||{id:email,email:email};
    var lu=getLocalUsers().find(function(u){return u.email===email;});
    currentUserRole=lu?lu.role:'admin';
    try{localStorage.setItem('daracqua_session_v1',JSON.stringify({access_token:data.access_token,user:currentUser,role:currentUserRole,exp:Date.now()+86400000}));}catch(e){}
    SB_TOKEN=data.access_token;
    updateUserUI(); show('dashboard');
    toast('✅ أهلاً '+(currentUser.email||'')+'!');
  }catch(err){
    toast('❌ '+err.message);
    if(btn){btn.disabled=false;btn.textContent='🔑 دخول';}
  }
}
async function doRegister(){
  var email=(document.getElementById('auth-email')||{}).value||'';
  var pass=(document.getElementById('auth-pass')||{}).value||'';
  var name=(document.getElementById('auth-name')||{}).value||'';
  var role=(document.getElementById('auth-role')||{}).value||'worker';
  if(!email||!pass){toast('⚠️ ادخل الإيميل وكلمة السر');return;}
  if(pass.length<6){toast('⚠️ كلمة السر 6 أحرف على الأقل');return;}
  var btn=document.getElementById('auth-btn');
  if(btn){btn.disabled=true;btn.textContent='⏳ جاري التسجيل...';}
  try{
    await sbAuth('signup',{email:email,password:pass,data:{full_name:name,role:role}});
    var locals=getLocalUsers();
    if(!locals.find(function(u){return u.email===email;})){
      locals.push({email:email,name:name||email,role:role,addedBy:currentUser?currentUser.email:'admin',addedAt:new Date().toISOString()});
      saveLocalUsers(locals);
    }
    toast('✅ تم تسجيل '+email); switchAuthTab('login');
    if(btn){btn.disabled=false;btn.textContent='🔑 دخول';}
  }catch(err){
    toast('❌ '+err.message);
    if(btn){btn.disabled=false;btn.textContent='📝 تسجيل';}
  }

async function sbFetch(path, opts){
  var cfg=getSettings();
  var url=(SB_URL||cfg.sbUrl||'').replace(/\/+$/,'');
  var key=SB_KEY||cfg.sbKey||'';
  if(!url||!key) throw new Error('Supabase not configured');
  var hdrs={'Content-Type':'application/json','apikey':key,'Authorization':'Bearer '+(SB_TOKEN||key),'Prefer':'return=representation'};
  var resp=await fetch(url+'/rest/v1/'+path,Object.assign({headers:hdrs},opts||{}));
  if(!resp.ok){var e=await resp.json().catch(function(){return{};});throw new Error(e.message||e.details||'SB '+resp.status);}
  var t=await resp.text();return t?JSON.parse(t):[];
}

// ── Logs (daily sheet) ─────────────────────
var LOGS_KEY='daracqua_logs_v2';
var _logsCache = null;

function getLogs(){
  if(_logsCache) return _logsCache;
  try{ _logsCache=JSON.parse(localStorage.getItem(LOGS_KEY)||'[]'); return _logsCache; }catch(e){return[];}
}
function _setLogsCache(arr){ _logsCache=arr; try{localStorage.setItem(LOGS_KEY,JSON.stringify(arr));}catch(e){} }

async function saveLogs(arr){
  // Trim to 1000 entries to prevent localStorage overflow (5MB limit)
  if(arr.length > 1000) arr = arr.slice(0, 1000);
  _setLogsCache(arr);
  // sync to Supabase in background
  if(sbReady && SB_FARM_ID){
    try {
      // delete all logs for this farm and re-insert (simple approach)
      await sbFetch('daily_logs?farm_id=eq.'+SB_FARM_ID, {method:'DELETE'});
      if(arr.length){
        var rows = arr.map(function(l){
          return {id:l.id, farm_id:SB_FARM_ID, unit_name:l.unit||'', log_type:l.type||'feed', log_date:l.date||new Date().toISOString().slice(0,10), data:l};
        });
        await sbFetch('daily_logs', {method:'POST', body:JSON.stringify(rows)});
      }
    } catch(e){ console.warn('Supabase sync error:', e.message); }
  }
}

async function loadLogsFromSB(){
  if(!sbReady || !SB_FARM_ID) return;
  try {
    var rows = await sbFetch('daily_logs?farm_id=eq.'+SB_FARM_ID+'&order=created_at.desc&limit=2000');
    var logs = rows.map(function(r){ return r.data; }).filter(Boolean);
    _setLogsCache(logs);
  } catch(e){ console.warn('Load logs error:', e.message); }
}

function deleteLog(id){
  var arr = getLogs().filter(function(l){return l.id!==id;});
  saveLogs(arr); // async fire-and-forget — UI updates from cache
}

// ── XSS Protection ───────────────────────────
function esc(s){
  return String(s||'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function toast(msg){
  var el=document.getElementById('toast');
  if(!el)return;
  el.textContent=msg;el.classList.add('show');
  setTimeout(function(){el.classList.remove('show');},2400);
}

function wqClass(param,val){
  var cfg=getSettings();
  var v=parseFloat(val);if(isNaN(v))return '';
  if(param==='temp'){var lo=cfg.tempLo||22,hi=cfg.tempHi||32;return v<lo||v>hi?'wq-bad':'wq-ok';}
  if(param==='do'){var c=cfg.doCrit||4,w=cfg.doWarn||5;return v<c?'wq-bad':v<w?'wq-warn':'wq-ok';}
  if(param==='ph'){var pl=cfg.phMin||6.5,ph=cfg.phMax||9;return v<pl||v>ph?'wq-bad':'wq-ok';}
  if(param==='amm'){var ac=cfg.ammCrit||0.5,aw=cfg.ammWarn||0.1;return v>ac?'wq-bad':v>aw?'wq-warn':'wq-ok';}
  return '';
}
function wqBadge(param,val){
  if(val===null||val===undefined||val==='')return '';
  var cls=wqClass(param,String(val));
  var icon=cls==='wq-bad'?'✗':cls==='wq-warn'?'⚠':'✓';
  return cls?('<span class="wq-badge '+cls+'">'+icon+'</span>'):'';
}

// ── Sheet tab state ───────────────────────────
var sheetTab='feed'; // feed | mortality | water | sampling
var sheetDate=new Date().toISOString().slice(0,10);

// Get all units from RAW + farm setup
function getAllUnits(){
  var u1=RAW.map(function(r){return r.unit;});
  var u2=getFarmUnits().map(function(u){return u.name||u.unit;});
  var merged={};
  u1.concat(u2).forEach(function(u){if(u) merged[u]=1;});
  var result=Object.keys(merged).sort();
  // If still empty, return placeholder
  return result;
}

function getAllUnitObjects(){
  var byName={};
  RAW.forEach(function(r){byName[r.unit]=r;});
  getFarmUnits().forEach(function(u){
    var k=u.name||u.unit;
    if(k&&!byName[k]) byName[k]=u;
  });
  return byName;
}

// Get saved sheet row for a unit/date/type
function getSheetData(type){
  return getLogs().filter(function(l){return l.type===type&&l.date===sheetDate;});
}
function getRowForUnit(type,unit){
  var rows=getSheetData(type);
  return rows.find(function(r){return r.unit===unit;})||null;
}

// Historical logs — get data for any past date
function getHistoricalRow(type,unit,date){
  return getLogs().find(function(l){return l.type===type&&l.unit===unit&&l.date===date;})||null;
}

// Save one sheet row — sync to cache immediately, async to Supabase
function saveSheetRow(type,unit,data){
  var logs=getLogs();
  var idx=logs.findIndex(function(l){return l.type===type&&l.date===sheetDate&&l.unit===unit;});
  var entry=Object.assign({type:type,unit:unit,date:sheetDate,id:idx>=0?logs[idx].id:(Date.now().toString(36)+Math.random().toString(36).slice(2,5)),ts:new Date().toISOString()},data);
  if(idx>=0) logs[idx]=entry; else logs.unshift(entry);
  // Update cache immediately (sync) then persist async
  _logsCache = logs;
  try{ localStorage.setItem(LOGS_KEY, JSON.stringify(logs)); }catch(e){}
  saveLogs(logs).catch(function(e){ console.warn('saveLogs async error:',e); });
}

// Read one cell from the sheet DOM
function cv(id){var el=document.getElementById(id);return el?el.value:'';}
function cf(id){return parseFloat(cv(id))||null;}

// ── Save entire sheet ─────────────────────────
function saveSheet(){
  var units=getAllUnits();
  var saved=0;
  units.forEach(function(unit){
    var uid=unit.replace(/\./g,'_');
    if(sheetTab==='feed'){
      var kg=cf('f_kg_'+uid);
      if(kg){
        saveSheetRow('feed',unit,{kg:kg,feedType:cv('f_type_'+uid),meals:parseInt(cv('f_meals_'+uid))||null,notes:cv('f_notes_'+uid)});
        saved++;
      }
    } else if(sheetTab==='mortality'){
      var cnt=cf('m_cnt_'+uid);
      if(cnt!==null){
        saveSheetRow('mortality',unit,{count:Math.round(cnt),cause:cv('m_cause_'+uid),notes:cv('m_notes_'+uid)});
        saved++;
      }
    } else if(sheetTab==='water'){
      var temp=cf('w_temp_'+uid),doV=cf('w_do_'+uid),ph=cf('w_ph_'+uid);
      if(temp||doV||ph){
        saveSheetRow('water',unit,{temp:temp,doVal:doV,ph:ph,salinity:cf('w_sal_'+uid),ammonia:cf('w_amm_'+uid),notes:cv('w_notes_'+uid)});
        saved++;
      }
    } else if(sheetTab==='sampling'){
      var avgWt=cf('s_wt_'+uid);
      if(avgWt){
        saveSheetRow('sampling',unit,{avgWt:avgWt,sampleN:parseInt(cv('s_n_'+uid))||null,minWt:cf('s_min_'+uid),maxWt:cf('s_max_'+uid),notes:cv('s_notes_'+uid)});
        saved++;
      }
    }
  });
  toast(saved>0?(isAr?'✅ تم حفظ '+saved+' صف':'✅ Saved '+saved+' rows'):(isAr?'لا توجد بيانات للحفظ':'No data to save'));
}

// Auto-save a single row when cell changes
function autoSaveRow(type, unit){
  var uid = unit.replace(/\./g,'_');
  var data = {};
  if(type==='feed'){
    data={kg:cf('f_kg_'+uid),feedType:cv('f_type_'+uid),meals:parseInt(cv('f_meals_'+uid))||null,notes:cv('f_notes_'+uid)};
    if(!data.kg) return; // don't save empty
  } else if(type==='mortality'){
    var cnt = cf('m_cnt_'+uid);
    if(cnt===null) return;
    data={count:Math.round(cnt),cause:cv('m_cause_'+uid),notes:cv('m_notes_'+uid)};
  } else if(type==='water'){
    data={temp:cf('w_temp_'+uid),doVal:cf('w_do_'+uid),ph:cf('w_ph_'+uid),salinity:cf('w_sal_'+uid),ammonia:cf('w_amm_'+uid),notes:cv('w_notes_'+uid)};
    if(!data.temp&&!data.doVal&&!data.ph&&!data.salinity&&!data.ammonia) return;
  } else if(type==='sampling'){
    data={avgWt:cf('s_wt_'+uid),sampleN:parseInt(cv('s_n_'+uid))||null,minWt:cf('s_min_'+uid),maxWt:cf('s_max_'+uid),notes:cv('s_notes_'+uid)};
    if(!data.avgWt) return;
    // update RAW avgWt too
    var raw=RAW.find(function(r){return r.unit===unit;});
    if(raw&&data.avgWt){ raw.avgWt=data.avgWt; raw.biomass=Math.round(raw.fishNo*data.avgWt/100)/10; raw.density=raw.volume?Math.round(raw.biomass/raw.volume*100)/100:raw.density; }
  }
  saveSheetRow(type,unit,data);
}

// Update water quality badge inline without re-rendering
function updateWqBadge(inputId, param, val){
  var cls=wqClass(param,val);
  var icon=cls==='wq-bad'?'✗':cls==='wq-warn'?'⚠':'✓';
  var input=document.getElementById(inputId);
  if(!input) return;

var uploadState = { parsed: null, date: null }; // parsed new rows
var HISTORY_KEY = 'daracqua_snapshots_v1';
var _snapsCache = null;

function takeSnapshot(){
  var today=new Date().toISOString().slice(0,10);
  try{var ex=JSON.parse(localStorage.getItem('daracqua_snapshots_v1')||'[]');if(ex.length&&ex[0].date===today)return;}catch(e){}
  var liveRs=_txLiveRows(),allTX=getTX(),cfg=getSettings();
  var units=liveRs.filter(function(r){return(r.fishNo||0)>0;}).map(function(r){return{unit:r.unit,farm:r.farm||'',fishNo:r.fishNo||0,avgWt:+(r.avgWt||0).toFixed(2),biomass:+(r.biomass||0).toFixed(3),density:+(r.density||0).toFixed(2),sgr:r.sgr?+r.sgr.toFixed(3):null,fcr:r.fcr?+r.fcr.toFixed(2):null};});
  var totFish=units.reduce(function(s,u){return s+u.fishNo;},0),totBio=units.reduce(function(s,u){return s+u.biomass;},0);
  var yd=new Date();yd.setDate(yd.getDate()-1);var yds=yd.toISOString().slice(0,10);
  var feedT=allTX.filter(function(t){return t.type==='feeding'&&t.date>=yds;}).reduce(function(s,t){return s+(t.kg||0);},0);
  var mortT=allTX.filter(function(t){return t.type==='mortality'&&t.date>=yds;}).reduce(function(s,t){return s+(t.count||0);},0);
  var snap={date:today,ts:new Date().toISOString(),farmName:cfg.farmName||'Dar Aqua',totFish:totFish,totBio:+totBio.toFixed(3),activeUnits:units.length,feedLast24h:+feedT.toFixed(2),mortLast24h:mortT,alarms:units.filter(function(u){return u.density>=25;}).length,warns:units.filter(function(u){return u.density>=20&&u.density<25;}).length,units:units};
  try{var snaps=JSON.parse(localStorage.getItem('daracqua_snapshots_v1')||'[]');snaps.unshift(snap);if(snaps.length>365)snaps=snaps.slice(0,365);localStorage.setItem('daracqua_snapshots_v1',JSON.stringify(snaps));_snapsCache=null;}catch(e){}
  if(sbReady&&SB_FARM_ID){try{sbFetch('snapshots',{method:'POST',body:JSON.stringify({farm_id:SB_FARM_ID,snapshot_date:today,tot_fish:snap.totFish,tot_bio:snap.totBio,active_units:snap.activeUnits,feed_last24h:snap.feedLast24h,mort_last24h:snap.mortLast24h,alarms:snap.alarms,warns:snap.warns,data:snap})});}catch(e){}}
}
function getSnapshots(){
  if(_snapsCache) return _snapsCache;
  try{ _snapsCache=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]'); return _snapsCache||[]; }catch(e){ return []; }
}

async function saveSnapshot(snap){
  var arr = getSnapshots(); arr.unshift(snap);
  if(arr.length>10) arr=arr.slice(0,10);
  _snapsCache=arr;
  try{ localStorage.setItem(HISTORY_KEY,JSON.stringify(arr)); }catch(e){}
  if(sbReady && SB_FARM_ID){
    try{ await sbFetch('snapshots',{method:'POST',body:JSON.stringify({farm_id:SB_FARM_ID,snapshot_date:snap.date,data:snap})}); }
    catch(e){ console.warn('Snapshot sync:',e.message); }
  }
}

async function loadSnapshotsFromSB(){
  if(!sbReady||!SB_FARM_ID) return;
  try{
    var rows=await sbFetch('snapshots?farm_id=eq.'+SB_FARM_ID+'&order=snapshot_date.desc&limit=3650');
    if(!rows||!rows.length) return;
    var snaps=rows.map(function(r){return r.data||{date:r.snapshot_date,totFish:r.tot_fish,totBio:r.tot_bio,activeUnits:r.active_units,feedLast24h:r.feed_last24h,mortLast24h:r.mort_last24h,alarms:r.alarms,warns:r.warns,units:[]};}).filter(Boolean);
    _snapsCache=snaps;
    try{ localStorage.setItem('daracqua_snapshots_v1',JSON.stringify(snaps.slice(0,365))); }catch(e){}
  }catch(e){ console.warn('Load snaps:',e.message); }
}

function handleDrop(e){
  e.preventDefault();
  document.getElementById('drop-zone').classList.remove('over');
  var f = e.dataTransfer.files[0];
  if(f) handleFile(f);
}

function handleFile(file){
  if(!file) return;
  if(!window.XLSX){ toast(isAr?'جاري تحميل مكتبة القراءة...':'Loading parser...'); setTimeout(function(){handleFile(file);},1000); return; }
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var wb = XLSX.read(e.target.result, {type:'array', cellDates:true});
      var ws = wb.Sheets[wb.SheetNames[0]];
      var data = XLSX.utils.sheet_to_json(ws, {defval:''});
      var parsed = [];
      data.forEach(function(row){
        // flexible column detection
        var unit = row['Unit'] || row['unit'] || row['UNIT'] || '';
        var fishNo = parseFloat(row['Fish No'] || row['FishNo'] || row['fish_no'] || row['Count'] || 0);
        var avgWt = parseFloat(row['Av. Wt.'] || row['Avg Weight'] || row['avg_wt'] || row['AvgWt'] || 0);
        var biomass = parseFloat(row['Biomass'] || row['biomass'] || 0);
        var density = parseFloat(row['Fish Density (Kg/m3)'] || row['Density'] || row['density'] || 0);
        var startDate = row['Unit Start Date'] || row['Start Date'] || '';
        if(typeof startDate==='object' && startDate instanceof Date) startDate = startDate.toISOString().slice(0,10);
        if(!unit || !fishNo) return;
        // auto-calc biomass/density if missing
        if(!biomass && fishNo && avgWt) biomass = fishNo * avgWt / 1000;
        var section = unit.split('.').slice(0,2).join('.');
        var farm = unit.split('.')[0] || 'F1';
        parsed.push({
          unit: String(unit).trim(),
          farm: farm,
          section: section,
          fishNo: Math.round(fishNo),
          avgWt: Math.round(avgWt*10)/10,
          startWt: parseFloat(row['UTD Start Av. Wt.'] || row['Start Wt'] || 0),
          biomass: Math.round(biomass*10)/10,
          density: Math.round(density*100)/100,
          startDate: String(startDate).slice(0,10),
          alarm: density > 25,
          warn: density >= 15 && density <= 25
        });
      });
      if(!parsed.length){ toast(isAr?'❌ لم يتم العثور على بيانات في الملف':'❌ No valid data found in file'); return; }
      uploadState.parsed = parsed;
      uploadState.date = new Date().toISOString().slice(0,10);
      toast(isAr?'✅ تم قراءة '+parsed.length+' وحدة':'✅ Read '+parsed.length+' units');
      show('upload');
    } catch(err){
      toast(isAr?'❌ خطأ في قراءة الملف: '+err.message:'❌ Error reading file: '+err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function applyUpdate(){
  if(!uploadState.parsed) return;
  var newRows = uploadState.parsed;
  // save snapshot of current data first
  var changed = newRows.filter(function(r){
    var old=RAW.find(function(x){return x.unit===r.unit;});
    return !old||old.avgWt!==r.avgWt||old.fishNo!==r.fishNo;
  }).length;
  saveSnapshot({date: uploadState.date, units: newRows.length, changed: changed, data: RAW.map(function(r){return Object.assign({},r);})}).catch(function(e){console.warn('saveSnapshot:',e);});
  // apply updates
  newRows.forEach(function(r){
    var idx = RAW.findIndex(function(x){return x.unit===r.unit;});
    if(idx>=0){ Object.assign(RAW[idx], r); }
    else { RAW.push(r); }
  });
  uploadState.parsed = null;
  toast(isAr?'✅ تم تحديث البيانات — '+changed+' تغيير':'✅ Data updated — '+changed+' changes');
  show('dashboard');
  // Unregister any cached service workers to ensure fresh content
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(function(regs){
      regs.forEach(function(r){ r.unregister(); });
    });
  }

}

function restoreSnapshot(date){
  if(!confirm(isAr?'استعادة بيانات '+date+'؟':'Restore data from '+date+'?')) return;
  var snaps = getSnapshots();
  var snap = snaps.find(function(s){return s.date===date;});
  if(!snap||!snap.data) return;
  RAW.length=0;
  snap.data.forEach(function(r){RAW.push(r);});
  toast(isAr?'✅ تم استعادة بيانات '+date:'✅ Restored data from '+date);
  show('dashboard');
}

// ── Calculations: FCR · SGR · Feeding Rate ──────
function renderCalcs(){
  var rs = rows();
  var logs = getLogs();
  var snaps = getSnapshots();

  // ── Per-unit calculations ──
  // SGR = (ln(W2) - ln(W1)) / days * 100
  // FCR = total feed / weight gain (biomass)
  // Feeding Rate = daily feed / biomass * 100

  // Get previous snapshot for SGR
  var prevSnap = snaps.length ? snaps[0] : null;
  var prevData  = prevSnap ? prevSnap.data : null;

  // Days since last snapshot (default 7)
  var daysSince = 7;
  if(prevSnap){
    var d1 = new Date(prevSnap.date), d2 = new Date();
    var diff = Math.round((d2-d1)/(1000*60*60*24));
    if(diff>0 && diff<60) daysSince = diff;
  }

  // Total feed per unit from logs
  var feedByUnit = {};
  logs.filter(function(l){return l.type==='feed';}).forEach(function(l){
    feedByUnit[l.unit] = (feedByUnit[l.unit]||0) + (l.kg||0);
  });

  // Build calc rows
  var calcRows = rs.map(function(r){
    var prev = prevData ? prevData.find(function(p){return p.unit===r.unit;}) : null;

    // SGR
    var sgr = null;
    if(prev && prev.avgWt>0 && r.avgWt>0 && daysSince>0){
      sgr = (Math.log(r.avgWt) - Math.log(prev.avgWt)) / daysSince * 100;
      sgr = Math.round(sgr*100)/100;
    }

    // Weight gain
    var gainG = prev ? r.avgWt - prev.avgWt : null;
    var gainBio = (gainG && r.fishNo) ? gainG * r.fishNo / 1000 : null; // kg

    // FCR = feed consumed / biomass gained
    var feedUsed = feedByUnit[r.unit] || 0;
    var fcr = (feedUsed>0 && gainBio && gainBio>0) ? Math.round(feedUsed/gainBio*100)/100 : null;

    // Feeding Rate % BW/day
    var fr = (feedUsed>0 && r.biomass>0 && daysSince>0)
      ? Math.round(feedUsed/r.biomass/daysSince*100*100)/100 : null;

    // Recommended daily feed (2% BW typical for tilapia at this size)
    var recPct = r.avgWt<50?5: r.avgWt<150?4: r.avgWt<300?3:2;
    var recFeed = Math.round(r.biomass * recPct / 100 * 10)/10;

    return {
      unit:r.unit, section:r.section, farm:r.farm,
      fishNo:r.fishNo, avgWt:r.avgWt, biomass:r.biomass,
      prevWt: prev?prev.avgWt:null,
      gainG: gainG, gainBio: gainBio,
      sgr: sgr, fcr: fcr, fr: fr,
      feedUsed: feedUsed, recFeed: recFeed, recPct: recPct,
      days: daysSince
    };
  });

  // Summaries
  var withSGR = calcRows.filter(function(r){return r.sgr!==null;});
  var avgSGR  = withSGR.length ? Math.round(withSGR.reduce(function(s,r){return s+r.sgr;},0)/withSGR.length*100)/100 : null;
  var withFCR = calcRows.filter(function(r){return r.fcr!==null;});
  var avgFCR  = withFCR.length ? Math.round(withFCR.reduce(function(s,r){return s+r.fcr;},0)/withFCR.length*100)/100 : null;
  var totalFeed = calcRows.reduce(function(s,r){return s+r.feedUsed;},0);
  var totalRecFeed = calcRows.reduce(function(s,r){return s+r.recFeed;},0);

  var sgrClass = function(v){ if(v===null)return ''; return v>=1.5?'diff-up':v>=0.8?'':v>=0?'diff-same':'diff-down'; };
  var fcrClass = function(v){ if(v===null)return ''; return v<=1.5?'diff-up':v<=2.5?'':v<=4?'diff-same':'diff-down'; };
  var frClass  = function(v){ if(v===null)return ''; return v>=1&&v<=3?'diff-up':v>3&&v<=5?'diff-same':'diff-down'; };

  var h='';
  h+='<div class="ph"><div><h2>🧮 '+(isAr?'الحسابات التلقائية':'Auto Calculations')+'</h2>';
  h+='<p>'+(isAr?'FCR · SGR · Feeding Rate — مبنية على سجلات العلف واليومي':'Based on feed logs & weekly sampling')+'</p></div></div>';

  // Info notice if no prev snapshot
  if(!prevSnap){
    h+='<div style="background:#f0f9ff;border-inline-start:3px solid #0ea5e9;border-radius:9px;padding:12px 14px;margin-bottom:16px;font-size:13px;color:#0c4a6e">';
    h+='💡 '+(isAr?'لحساب SGR و FCR بدقة، ارفع تقرير XLS أسبوعي أولاً ثم ارفع تقرير الأسبوع الجديد — الأداة ستقارن تلقائياً':'To calculate SGR & FCR accurately, upload one XLS report first, then upload next week\'s report — the tool will compare automatically')+'</div>';
  }

  // KPI row
  h+='<div class="kpis" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px">';

  // SGR
  var sgrVal = avgSGR!==null ? n(avgSGR,2)+'%/day' : (isAr?'يحتاج أسبوعين':'Need 2 weeks');
  var sgrSub = avgSGR!==null ? (avgSGR>=1.5?(isAr?'نمو ممتاز':'Excellent growth'):avgSGR>=0.8?(isAr?'نمو جيد':'Good growth'):(isAr?'نمو بطيء':'Slow growth')) : '';
  h+='<div class="kpi '+(avgSGR>=1.5?'kok':avgSGR>=0.8?'':avgSGR!==null?'kwarn':'')+'">';
  h+='<div class="kpi-lbl">SGR — '+(isAr?'معدل النمو اليومي':'Daily Growth Rate')+'</div>';
  h+='<div class="kpi-val" style="font-size:20px">'+sgrVal+'</div>';
  h+='<div class="kpi-sub">'+sgrSub+'</div></div>';

  // FCR
  var fcrVal = avgFCR!==null ? n(avgFCR,2) : (isAr?'سجّل علف أولاً':'Log feed first');
  var fcrSub = avgFCR!==null ? (avgFCR<=1.5?(isAr?'ممتاز':'Excellent'):avgFCR<=2.5?(isAr?'جيد':'Good'):avgFCR<=4?(isAr?'مقبول':'Acceptable'):(isAr?'مرتفع — راجع التغذية':'High — review feeding')) : '';
  h+='<div class="kpi '+(avgFCR!==null&&avgFCR<=1.5?'kok':avgFCR!==null&&avgFCR<=2.5?'':avgFCR!==null?'kwarn':'')+'">';
  h+='<div class="kpi-lbl">FCR — '+(isAr?'معامل التحويل الغذائي':'Feed Conversion Ratio')+'</div>';
  h+='<div class="kpi-val" style="font-size:20px">'+fcrVal+'</div>';
  h+='<div class="kpi-sub">'+fcrSub+'</div></div>';

  // Total feed logged
  h+='<div class="kpi">';
  h+='<div class="kpi-lbl">'+(isAr?'إجمالي العلف المسجّل':'Total Feed Logged')+'</div>';
  h+='<div class="kpi-val" style="font-size:20px">'+n(totalFeed,1)+'</div>';
  h+='<div class="kpi-sub">كجم · '+daysSince+' '+(isAr?'يوم':'days')+'</div></div>';

  // Recommended feed today
  h+='<div class="kpi kok">';
  h+='<div class="kpi-lbl">'+(isAr?'العلف الموصى به / يوم':'Recommended Feed / Day')+'</div>';
  h+='<div class="kpi-val" style="font-size:20px">'+n(totalRecFeed,1)+'</div>';
  h+='<div class="kpi-sub">كجم · '+(isAr?'بناءً على الكتلة الحيوية الحالية':'Based on current biomass')+'</div></div>';
  h+='</div>'; // end kpis

  // Reference card
  h+='<div class="grid2" style="margin-bottom:16px">';
  h+='<div class="card"><div style="font-weight:700;font-size:14px;color:var(--deep);margin-bottom:12px">📖 '+(isAr?'مرجع السيلفر بلطي':'Silver Tilapia Reference')+'</div>';
  h+='<table style="font-size:12px;width:100%"><thead><tr>';
  h+='<th style="background:#edf4f1;padding:7px 10px;text-align:start">'+(isAr?'الوزن':'Weight')+'</th>';
  h+='<th style="background:#edf4f1;padding:7px 10px;text-align:start">'+(isAr?'نسبة التغذية':'Feeding %')+'</th>';
  h+='<th style="background:#edf4f1;padding:7px 10px;text-align:start">SGR '+(isAr?'المتوقع':'Expected')+'</th>';
  h+='<th style="background:#edf4f1;padding:7px 10px;text-align:start">FCR '+(isAr?'المثالي':'Ideal')+'</th>';
  h+='</tr></thead><tbody>';
  [
    {wt:'< 50g',   fr:'4-5%', sgr:'2.0-3.0', fcr:'1.2-1.5'},
    {wt:'50-150g', fr:'3-4%', sgr:'1.5-2.0', fcr:'1.3-1.6'},
    {wt:'150-300g',fr:'2-3%', sgr:'1.0-1.5', fcr:'1.4-1.7'},
    {wt:'> 300g',  fr:'1-2%', sgr:'0.5-1.0', fcr:'1.5-1.8'},
  ].forEach(function(row){
    h+='<tr><td style="padding:7px 10px;border-bottom:1px solid var(--line)">'+row.wt+'</td>';
    h+='<td style="padding:7px 10px;border-bottom:1px solid var(--line);color:var(--teal);font-weight:600">'+row.fr+'</td>';
    h+='<td style="padding:7px 10px;border-bottom:1px solid var(--line)">'+row.sgr+'</td>';
    h+='<td style="padding:7px 10px;border-bottom:1px solid var(--line)">'+row.fcr+'</td></tr>';
  });
  h+='</tbody></table></div>';

  // Today's recommended feed per unit (top 10 by biomass)
  h+='<div class="card"><div style="font-weight:700;font-size:14px;color:var(--deep);margin-bottom:12px">🌾 '+(isAr?'العلف الموصى به اليوم (أعلى 10)':'Recommended Feed Today (Top 10)')+'</div>';
  var top10 = calcRows.slice().sort(function(a,b){return b.biomass-a.biomass;}).slice(0,10);
  h+='<div style="display:flex;flex-direction:column;gap:8px">';
  top10.forEach(function(r){
    var pct = Math.round(r.recFeed / totalRecFeed * 100);
    h+='<div style="display:grid;grid-template-columns:85px 1fr 80px;gap:8px;align-items:center;font-size:12px">';
    h+='<span style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(r.unit)+'</span>';
    h+='<div class="bar-outer"><div class="bar-inner" style="width:'+pct+'%;background:linear-gradient(90deg,var(--teal),var(--lime))"></div></div>';
    h+='<span style="text-align:end;font-weight:700">'+n(r.recFeed,1)+' <span style="font-weight:400;color:var(--muted)">كجم</span></span>';
    h+='</div>';
  });
  h+='</div></div></div>'; // end grid2

  // Full unit table
  h+='<div class="card" style="padding:0">';
  h+='<div style="padding:14px 16px;font-weight:700;font-size:14px;color:var(--deep);border-bottom:1px solid var(--line)">📊 '+(isAr?'تفاصيل كل وحدة':'Per-Unit Details')+'</div>';
  h+='<div style="overflow-x:auto;max-height:480px;overflow-y:auto"><table style="border-collapse:collapse;width:100%;font-size:12px">';
  h+='<thead><tr style="position:sticky;top:0;z-index:2">';
  ['الوحدة','وزن سابق','وزن حالي','نمو (جم)','SGR %/day','علف مسجّل','علف موصى','FCR','FR %BW'].forEach(function(col){
    h+='<th style="background:#edf4f1;color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;padding:9px 10px;white-space:nowrap;text-align:start">'+col+'</th>';
  });
  h+='</tr></thead><tbody>';

  calcRows.sort(function(a,b){return b.biomass-a.biomass;}).forEach(function(r){
    h+='<tr>';
    h+='<td style="padding:8px 10px;border-bottom:1px solid var(--line)"><strong>'+esc(r.unit)+'</strong></td>';
    h+='<td style="padding:8px 10px;border-bottom:1px solid var(--line)">'+(r.prevWt!==null?n(r.prevWt,0)+'g':'—')+'</td>';
    h+='<td style="padding:8px 10px;border-bottom:1px solid var(--line)"><strong>'+n(r.avgWt,0)+'g</strong></td>';
    // gain
    var gainStr = r.gainG!==null ? (r.gainG>0?'<span class="diff-up">+'+n(r.gainG,1)+'g</span>':r.gainG<0?'<span class="diff-down">'+n(r.gainG,1)+'g</span>':'<span class="diff-same">0g</span>') : '<span style="color:var(--muted)">—</span>';
    h+='<td style="padding:8px 10px;border-bottom:1px solid var(--line)">'+gainStr+'</td>';
    // SGR
    var sgrStr = r.sgr!==null ? '<span class="'+sgrClass(r.sgr)+'">'+n(r.sgr,2)+'</span>' : '<span style="color:var(--muted)">—</span>';
    h+='<td style="padding:8px 10px;border-bottom:1px solid var(--line)">'+sgrStr+'</td>';
    // feed used
    h+='<td style="padding:8px 10px;border-bottom:1px solid var(--line)">'+(r.feedUsed>0?n(r.feedUsed,1)+' كجم':'<span style="color:var(--muted)">—</span>')+'</td>';
    // rec feed
    h+='<td style="padding:8px 10px;border-bottom:1px solid var(--line);color:var(--teal);font-weight:600">'+n(r.recFeed,1)+' كجم <span style="font-size:10px;color:var(--muted)">('+r.recPct+'%)</span></td>';
    // FCR
    var fcrStr = r.fcr!==null ? '<span class="'+fcrClass(r.fcr)+'">'+n(r.fcr,2)+'</span>' : '<span style="color:var(--muted)">—</span>';
    h+='<td style="padding:8px 10px;border-bottom:1px solid var(--line)">'+fcrStr+'</td>';
    // FR
    var frStr = r.fr!==null ? '<span class="'+frClass(r.fr)+'">'+n(r.fr,2)+'%</span>' : '<span style="color:var(--muted)">—</span>';
    h+='<td style="padding:8px 10px;border-bottom:1px solid var(--line)">'+frStr+'</td>';
    h+='</tr>';
  });
  h+='</tbody></table></div></div>';

  return h;
}

// ── Smart Alerts Engine ────────────────────────
function generateAlerts(){
  var rs = rows();
  var logs = getLogs();
  var alerts = [];
  var today = new Date().toISOString().slice(0,10);
  var snaps = getSnapshots();
  var prevData = snaps.length ? snaps[0].data : null;
  var daysSince = 7;
  if(snaps.length){ var d=Math.round((new Date()-new Date(snaps[0].date))/(864e5)); if(d>0&&d<60) daysSince=d; }

  // Feed logs per unit (last 7 days)
  var last7days = [];
  for(var i=0;i<7;i++){ var d=new Date(); d.setDate(d.getDate()-i); last7days.push(d.toISOString().slice(0,10)); }

  var feedByUnit = {};
  var feedDaysByUnit = {};
  logs.filter(function(l){return l.type==='feed';}).forEach(function(l){
    if(!feedByUnit[l.unit]) feedByUnit[l.unit]=0;
    if(!feedDaysByUnit[l.unit]) feedDaysByUnit[l.unit]=[];
    feedByUnit[l.unit]+=(l.kg||0);
    if(feedDaysByUnit[l.unit].indexOf(l.date)<0) feedDaysByUnit[l.unit].push(l.date);
  });

  // Mortality per unit last 7 days
  var mortByUnit = {};
  logs.filter(function(l){return l.type==='mortality'&&last7days.indexOf(l.date)>=0;}).forEach(function(l){
    mortByUnit[l.unit]=(mortByUnit[l.unit]||0)+(l.count||0);
  });

  // Water readings per unit last 7 days
  var waterByUnit = {};
  logs.filter(function(l){return l.type==='water';}).forEach(function(l){
    if(!waterByUnit[l.unit]) waterByUnit[l.unit]=[];
    waterByUnit[l.unit].push(l);
  });

  // Load all thresholds from settings
  var cfg = getSettings();
  var LIM = {
    densAlarm:  cfg.densAlarm  || 25,   // kg/m³
    densWarn:   cfg.densWarn   || 15,   // kg/m³
    cntAlarm:   cfg.cntAlarm   || 120,  // fish/m³ critical
    cntWarn:    cfg.cntWarn    || 80,   // fish/m³ warning
    frLow:      cfg.frLow      || 60,   // % of recommended (under = underfeed)
    frHigh:     cfg.frHigh     || 150,  // % of recommended (over = overfeed)
    mortCrit:   cfg.mortCrit   || 1,    // % mortality critical
    mortWarn:   cfg.mortWarn   || 0.3,  // % mortality warning
    doCrit:     cfg.doCrit     || 4,    // mg/L critical low
    doWarn:     cfg.doWarn     || 5,    // mg/L warning
    ammCrit:    cfg.ammCrit    || 0.5,  // mg/L critical
    ammWarn:    cfg.ammWarn    || 0.1,  // mg/L warning
    phLo:       cfg.phMin      || 6.5,
    phHi:       cfg.phMax      || 9,
    sgrSlow:    cfg.sgrSlow    || 0.5,  // %/day slow growth threshold
    tempHi:     cfg.tempHi     || 32,
    tempLo:     cfg.tempLo     || 22,
  };

  rs.forEach(function(r){
    // 1. DENSITY ALARM — from settings
    // Weight density (kg/m³)
    if(r.density >= LIM.densAlarm){
      alerts.push({level:'critical',unit:r.unit,section:r.section,
        title: isAr?'كثافة وزن خطرة':'Critical Weight Density',
        msg: isAr?'الكثافة '+n(r.density,2)+' كجم/م³ — تجاوزت الحد '+LIM.densAlarm:'Density '+n(r.density,2)+' kg/m³ — exceeds limit '+LIM.densAlarm,
        action: isAr?'قلّل الكثافة فوراً بالفرز أو النقل':'Reduce density immediately via grading or transfer',
        icon:'🔴'});
    } else if(r.density >= LIM.densWarn){
      alerts.push({level:'warn',unit:r.unit,section:r.section,
        title: isAr?'كثافة وزن مرتفعة':'High Weight Density',
        msg: isAr?'الكثافة '+n(r.density,2)+' كجم/م³ — تجاوزت حد التحذير '+LIM.densWarn:'Density '+n(r.density,2)+' kg/m³ — exceeds warning '+LIM.densWarn,
        action: isAr?'راقب وخطط للفرز خلال أسبوعين':'Monitor and plan grading within 2 weeks',
        icon:'🟡'});
    }
    // Count density (fish/m³)
    var vol = r.volume || (r.biomass && r.density ? Math.round(r.biomass/r.density*10)/10 : 0);
    var cntDens = vol > 0 ? Math.round(r.fishNo/vol) : 0;
    if(cntDens > 0){
      if(cntDens >= LIM.cntAlarm){
        alerts.push({level:'critical',unit:r.unit,section:r.section,
          title: isAr?'🐟 كثافة عدد خطرة':'🐟 Critical Count Density',
          msg: isAr?cntDens+' سمكة/م³ — تجاوزت الحد '+LIM.cntAlarm:cntDens+' fish/m³ — exceeds critical '+LIM.cntAlarm,
          action: isAr?'فرز فوري — الكثافة العددية عالية جداً':'Immediate grading — count density too high',
          icon:'🐟'});
      } else if(cntDens >= LIM.cntWarn){
        alerts.push({level:'warn',unit:r.unit,section:r.section,
          title: isAr?'🐟 كثافة عدد مرتفعة':'🐟 High Count Density',
          msg: isAr?cntDens+' سمكة/م³ — تجاوزت حد التحذير '+LIM.cntWarn:cntDens+' fish/m³ — exceeds warning '+LIM.cntWarn,
          action: isAr?'خطط للفرز قريباً':'Plan grading soon',
          icon:'🐠'});
      }
    }

    // 2. FEEDING RATE ALERT — from settings
    var recPct = r.avgWt<50?(cfg.fr1||5):r.avgWt<150?(cfg.fr2||4):r.avgWt<300?(cfg.fr3||3):(cfg.fr4||2);
    var recFeedTotal = r.biomass * recPct / 100 * daysSince;
    var actualFeed = feedByUnit[r.unit] || 0;
    if(recFeedTotal>0){
      var frRatio = actualFeed / recFeedTotal * 100;
      if(actualFeed===0){
        alerts.push({level:'warn',unit:r.unit,section:r.section,
          title:isAr?'لا يوجد علف مسجّل':'No Feed Logged',
          msg:isAr?'لم يُسجَّل أي علف — الموصى '+n(recFeedTotal,1)+' كجم / '+daysSince+' يوم':'No feed recorded — recommended '+n(recFeedTotal,1)+' kg / '+daysSince+' days',
          action:isAr?'سجّل العلف اليومي من صفحة التسجيل':'Log daily feed from the Daily Log page',
          icon:'⚠️'});
      } else if(frRatio < LIM.frLow){
        alerts.push({level:'warn',unit:r.unit,section:r.section,
          title:isAr?'علف أقل من الموصى به':'Underfeeding Alert',
          msg:isAr?'العلف '+n(actualFeed,1)+' كجم = '+n(frRatio,0)+'% من الموصى (حد التنبيه: '+LIM.frLow+'%)':'Feed '+n(actualFeed,1)+' kg = '+n(frRatio,0)+'% of recommended (threshold: '+LIM.frLow+'%)',
          action:isAr?'زيادة كمية العلف قد تحسّن معدل النمو':'Increasing feed may improve growth rate',
          icon:'📉'});
      } else if(frRatio > LIM.frHigh){
        alerts.push({level:'warn',unit:r.unit,section:r.section,
          title:isAr?'علف أكثر من الموصى به':'Overfeeding Alert',
          msg:isAr?'العلف '+n(actualFeed,1)+' كجم = '+n(frRatio,0)+'% من الموصى (حد التنبيه: '+LIM.frHigh+'%)':'Feed '+n(actualFeed,1)+' kg = '+n(frRatio,0)+'% of recommended (threshold: '+LIM.frHigh+'%)',
          action:isAr?'التغذية الزائدة تلوّث الماء وترفع FCR':'Overfeeding pollutes water and raises FCR',
          icon:'📈'});
      }
    }

    // 3. MORTALITY ALERT — from settings
    var mortCount = mortByUnit[r.unit] || 0;
    if(mortCount>0 && r.fishNo>0){
      var mortPct = mortCount/r.fishNo*100;
      if(mortPct >= LIM.mortCrit){
        alerts.push({level:'critical',unit:r.unit,section:r.section,
          title:isAr?'نفوق مرتفع':'High Mortality',
          msg:isAr?mortCount+' سمكة = '+n(mortPct,2)+'% — تجاوز الحد الحرج '+LIM.mortCrit+'%':mortCount+' fish = '+n(mortPct,2)+'% — exceeds critical limit '+LIM.mortCrit+'%',
          action:isAr?'افحص جودة الماء ومستوى الأكسجين فوراً':'Check water quality and oxygen level immediately',
          icon:'💀'});
      } else if(mortPct >= LIM.mortWarn){
        alerts.push({level:'warn',unit:r.unit,section:r.section,
          title:isAr?'نفوق ملحوظ':'Notable Mortality',
          msg:isAr?mortCount+' سمكة = '+n(mortPct,2)+'% — تجاوز حد التحذير '+LIM.mortWarn+'%':mortCount+' fish = '+n(mortPct,2)+'% — exceeds warning '+LIM.mortWarn+'%',
          action:isAr?'راقب الوضع وسجّل السبب':'Monitor situation and log cause',
          icon:'⚠️'});
      }
    }

    // 4. WATER QUALITY ALERT — from settings
    var wLogs = waterByUnit[r.unit];
    if(wLogs && wLogs.length){
      var latest = wLogs[0];
      if(latest.doVal!==null && latest.doVal < LIM.doCrit){
        alerts.push({level:'critical',unit:r.unit,section:r.section,
          title:isAr?'أكسجين منخفض جداً':'Critical Low DO',
          msg:isAr?'DO = '+n(latest.doVal,1)+' mg/L — أقل من الحد الحرج '+LIM.doCrit:'DO = '+n(latest.doVal,1)+' mg/L — below critical '+LIM.doCrit,
          action:isAr?'شغّل التهوية فوراً':'Start aeration immediately',
          icon:'🫧'});
      } else if(latest.doVal!==null && latest.doVal < LIM.doWarn){
        alerts.push({level:'warn',unit:r.unit,section:r.section,
          title:isAr?'أكسجين منخفض':'Low DO Warning',
          msg:isAr?'DO = '+n(latest.doVal,1)+' mg/L — أقل من حد التحذير '+LIM.doWarn:'DO = '+n(latest.doVal,1)+' mg/L — below warning '+LIM.doWarn,
          action:isAr?'راجع التهوية وقلل التغذية مؤقتاً':'Check aeration and reduce feeding temporarily',
          icon:'💨'});
      }
      if(latest.ammonia!==null && latest.ammonia > LIM.ammCrit){
        alerts.push({level:'critical',unit:r.unit,section:r.section,
          title:isAr?'أمونيا مرتفعة جداً':'Critical Ammonia',
          msg:isAr?'NH₃ = '+n(latest.ammonia,2)+' mg/L — تجاوز الحد الحرج '+LIM.ammCrit:'NH₃ = '+n(latest.ammonia,2)+' mg/L — exceeds critical '+LIM.ammCrit,
          action:isAr?'غيّر ماء فوراً وقلل التغذية':'Do water exchange immediately and reduce feeding',
          icon:'☣️'});
      } else if(latest.ammonia!==null && latest.ammonia > LIM.ammWarn){
        alerts.push({level:'warn',unit:r.unit,section:r.section,
          title:isAr?'أمونيا مرتفعة':'Elevated Ammonia',
          msg:isAr?'NH₃ = '+n(latest.ammonia,2)+' mg/L — تجاوز حد التحذير '+LIM.ammWarn:'NH₃ = '+n(latest.ammonia,2)+' mg/L — exceeds warning '+LIM.ammWarn,
          action:isAr?'قلّل كمية العلف وراقب يومياً':'Reduce feeding and monitor daily',
          icon:'⚗️'});
      }
      if(latest.ph!==null && (latest.ph < LIM.phLo || latest.ph > LIM.phHi)){
        alerts.push({level:'critical',unit:r.unit,section:r.section,
          title:isAr?'pH خارج النطاق':'pH Out of Range',
          msg:isAr?'pH = '+n(latest.ph,2)+' — النطاق الآمن '+LIM.phLo+' – '+LIM.phHi:'pH = '+n(latest.ph,2)+' — safe range '+LIM.phLo+' – '+LIM.phHi,
          action:isAr?'عالج الماء وراجع مصادر التلوث':'Treat water and check pollution sources',
          icon:'⚗️'});
      }
      if(latest.temp!==null && (latest.temp < LIM.tempLo || latest.temp > LIM.tempHi)){
        alerts.push({level:'warn',unit:r.unit,section:r.section,
          title:isAr?'درجة حرارة خارج النطاق':'Temperature Out of Range',
          msg:isAr?'الحرارة '+n(latest.temp,1)+'°C — النطاق المثالي '+LIM.tempLo+' – '+LIM.tempHi+'°C':'Temp '+n(latest.temp,1)+'°C — ideal range '+LIM.tempLo+' – '+LIM.tempHi+'°C',
          action:isAr?'راجع نظام التبريد أو التدفئة':'Check cooling or heating system',
          icon:'🌡️'});
      }
    } else if(r.biomass>50){
      alerts.push({level:'info',unit:r.unit,section:r.section,
        title:isAr?'لا توجد قراءات ماء':'No Water Readings',
        msg:isAr?'لم تُسجَّل قراءات جودة ماء لهذه الوحدة':'No water quality readings logged for this unit',
        action:isAr?'سجّل قراءات الماء يومياً للكشف المبكر':'Log water readings daily for early detection',
        icon:'💧'});
    }

    // 5. SGR ALERT — from settings
    if(prevData){
      var prev = prevData.find(function(p){return p.unit===r.unit;});
      if(prev && prev.avgWt>0 && r.avgWt>0 && daysSince>0){
        var sgr = (Math.log(r.avgWt)-Math.log(prev.avgWt))/daysSince*100;
        if(sgr<0){
          alerts.push({level:'warn',unit:r.unit,section:r.section,
            title:isAr?'وزن نقص!':'Weight Loss!',
            msg:isAr?'الوزن انخفض من '+n(prev.avgWt,0)+'g إلى '+n(r.avgWt,0)+'g — SGR = '+n(sgr,2)+'%':'Weight dropped from '+n(prev.avgWt,0)+'g to '+n(r.avgWt,0)+'g — SGR = '+n(sgr,2)+'%',
            action:isAr?'راجع كمية العلف وحالة صحة الأسماك':'Review feed amount and fish health status',
            icon:'📉'});
        } else if(sgr < LIM.sgrSlow && r.avgWt<400){
          alerts.push({level:'info',unit:r.unit,section:r.section,
            title:isAr?'نمو بطيء':'Slow Growth',
            msg:isAr?'SGR = '+n(sgr,2)+'%/day — أقل من حد التنبيه '+LIM.sgrSlow+'%':'SGR = '+n(sgr,2)+'%/day — below threshold '+LIM.sgrSlow+'%',
            action:isAr?'راجع جودة العلف ونسبة التغذية ودرجة الحرارة':'Review feed quality, feeding rate & temperature',
            icon:'🐌'});
        }
      }
    }
  });

  // Sort: critical first, then warn, then info
  var order = {critical:0, warn:1, info:2};
  alerts.sort(function(a,b){ return order[a.level]-order[b.level]; });
  return alerts;
}

var TX_KEY = 'daracqua_transactions_v1';
var _txCache = null;
function getTX(){
  if(_txCache) return _txCache;
  try{ _txCache=JSON.parse(localStorage.getItem(TX_KEY)||'[]'); return _txCache||[]; }
  catch(e){ return []; }
}
function saveTX(arr){
  _txCache=arr;
  try{ localStorage.setItem(TX_KEY,JSON.stringify(arr)); }catch(e){}
}
function addTX(obj){
  var arr=getTX();
  obj.id = obj.id||(Date.now()+'_'+Math.random().toString(36).slice(2,6));
  obj.ts = obj.ts||new Date().toISOString();
  arr.push(obj);
  if(arr.length>5000) arr=arr.slice(arr.length-5000);
  saveTX(arr);
  if(sbReady&&SB_FARM_ID) _txUpsertOne(obj);
  return obj;
}
function deleteTX(id){
  var arr=getTX().filter(function(t){return t.id!==id;});
  saveTX(arr);
  if(sbReady&&SB_FARM_ID) _txDeleteOne(id);
}

// ── Helper functions ──
function unitPropChange(uid,prop,val){
  var units=getFarmUnits();
  var u=units.find(function(x){return x.id===uid;});
  if(!u) return;
  if(['fishNo','startWt','volume','depth'].indexOf(prop)>=0) val=parseFloat(val)||0;
  u[prop]=val;
  _unitsCache=units;
}
function saveAllUnitProps(){
  saveFarmUnits(getFarmUnits());
  _txCache=null;
  buildFarmDD();
  toast('✅ تم حفظ كل تعديلات الأحواض');
}
function settingsAddUnitRow(){
  settingsTab='units';
  var units=getFarmUnits();
  units.push({id:Date.now()+'u',name:'',unitType:'tank',volume:0,depth:0,fishNo:0,startWt:0,source:'',farm:_settingsFarm||farmFilter||'F1'});
  saveFarmUnits(units);
  show('settings');
}
function saveSBConfig(){ saveSBConfigAndConnect(); }
function forceSyncTX(){
  if(sbReady&&SB_FARM_ID){ _txSyncToSB(getTX()); toast('🔄 جاري المزامنة...'); }
  else toast('⚠️ غير متصل بـ Supabase');
}

function applySettings(){
  var prev=getSettings(_settingsFarm);
  var s=Object.assign({},prev);
  var v;
  v=document.getElementById('st-fname');     if(v) s.farmName=v.value;
  v=document.getElementById('st-loc');       if(v) s.location=v.value;
  v=document.getElementById('st-species');   if(v) s.species=v.value;
  v=document.getElementById('st-temp');      if(v) s.optTemp=parseFloat(v.value)||28;
  v=document.getElementById('sw-harvestwt'); if(v) s.harvestTargetWt=parseFloat(v.value)||0;
  v=document.getElementById('sw-watertemp'); if(v) s.waterTemp=parseFloat(v.value)||28;
  v=document.getElementById('sw-cap');       if(v) s.targetCapacity=parseFloat(v.value)||null;
  v=document.getElementById('al-dalm');      if(v) s.densAlarm=parseFloat(v.value)||25;
  v=document.getElementById('al-dwrn');      if(v) s.densWarn=parseFloat(v.value)||15;
  v=document.getElementById('al-mort');      if(v) s.mortWarn=parseFloat(v.value)||0.5;
  v=document.getElementById('al-fcr');       if(v) s.fcrWarn=parseFloat(v.value)||2.5;
  v=document.getElementById('al-tmplo');     if(v) s.tempLo=parseFloat(v.value)||22;
  v=document.getElementById('al-tmphi');     if(v) s.tempHi=parseFloat(v.value)||32;
  v=document.getElementById('al-dolo');      if(v) s.doLo=parseFloat(v.value)||4;
  v=document.getElementById('al-phlo');      if(v) s.phLo=parseFloat(v.value)||6.5;
  v=document.getElementById('al-phhi');      if(v) s.phHi=parseFloat(v.value)||9;
  v=document.getElementById('al-amm');       if(v) s.ammCrit=parseFloat(v.value)||0.05;
  v=document.getElementById('al-tstop-hi');  if(v){s.tempStopHigh=parseFloat(v.value)||33;TEMP_STOP_HIGH=s.tempStopHigh;}
  v=document.getElementById('al-tstop-lo');  if(v){s.tempStopLow=parseFloat(v.value)||17;TEMP_STOP_LOW=s.tempStopLow;}

  saveSettings(s,_settingsFarm);
  toast('✅ تم حفظ إعدادات '+(_settingsFarm||'Global'));

function renderTxStocking(){

  var selFarm = _batchState.site || (farmIds[0]||'');

  // Header
  h += '<div style="background:#d1e9e2;display:contents">';
  ['Unit','Fish No','Av. Wt (g)','Input Date','Cost/Item','Group Tag','FCR/SFR Table'].forEach(function(c){
    h += '<div style="padding:7px 8px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#edf4f1;border-bottom:1px solid var(--line)">'+c+'</div>';

  } else {
    assigned.forEach(function(row, i){
      var bg = i%2===0?'#fff':'#fafdfb';
      h += '<div style="background:'+bg+';padding:5px 8px;border-bottom:1px solid var(--line);font-weight:700;font-size:12px;color:var(--teal);display:flex;align-items:center;gap:6px">';
      h += row.unit;
      h += '<button onclick="_batchState.rows.splice('+i+',1);renderBatchUnitTable()" style="border:0;background:transparent;color:var(--red);cursor:pointer;font-size:14px;line-height:1;padding:0 2px">×</button>';
      h += '</div>';
      h += '<div style="background:'+bg+';padding:3px 5px;border-bottom:1px solid var(--line)"><input type="number" class="sh-inp" placeholder="'+(st.fishNo||'Fish No')+'" value="'+(row.fishNo||'')+'" oninput="_batchState.rows['+i+'].fishNo=this.value" style="width:80px"/></div>';
      h += '<div style="background:'+bg+';padding:3px 5px;border-bottom:1px solid var(--line)"><input type="number" class="sh-inp" placeholder="'+(st.avgWt||'g')+'" value="'+(row.avgWt||'')+'" oninput="_batchState.rows['+i+'].avgWt=this.value" style="width:76px"/></div>';
      h += '<div style="background:'+bg+';padding:3px 5px;border-bottom:1px solid var(--line)"><input type="date" value="'+(row.inputDate||st.date)+'" oninput="_batchState.rows['+i+'].inputDate=this.value" style="width:96px;'+inp_style+'"/></div>';
      h += '<div style="background:'+bg+';padding:3px 5px;border-bottom:1px solid var(--line)"><input type="number" class="sh-inp" placeholder="BD" value="'+(row.costPerItem||'')+'" oninput="_batchState.rows['+i+'].costPerItem=this.value" style="width:80px"/></div>';
      h += '<div style="background:'+bg+';padding:3px 5px;border-bottom:1px solid var(--line)"><input class="sh-inp-text" placeholder="Tag" value="'+(row.groupTag||'')+'" oninput="_batchState.rows['+i+'].groupTag=this.value" style="width:72px"/></div>';
      h += '<div style="background:'+bg+';padding:3px 5px;border-bottom:1px solid var(--line)"><input class="sh-inp-text" placeholder="FCR/SFR" style="width:100%;font-size:11px"/></div>';
    });

  h += '<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">';
  h += '<span style="font-size:11px;font-weight:700;color:var(--muted)">+ إضافة حوض:</span>';
  h += '<select id="bi-add-unit" style="border:1.5px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit;font-size:12px">';
  h += '<option value="">— اختر حوض —</option>';

    if(!already) h += '<option>'+nm+'</option>';
  });
