function generateWhatsAppReport(){
  var today = new Date().toISOString().slice(0,10);
  var cfg   = getSettings();
  var live  = _txLiveRows().filter(function(r){return(r.fishNo||0)>0;});
  var allTX = getTX();
  var farm  = farmFilter==='all'?'All Farms':farmFilter;

  // Today's feeding
  var feedToday = allTX.filter(function(t){return t.type==='feeding'&&t.date===today;})
                       .reduce(function(s,t){return s+(t.kg||0);},0);
  // Today's mortality
  var mortToday = allTX.filter(function(t){return t.type==='mortality'&&t.date===today;})
                       .reduce(function(s,t){return s+(t.count||0);},0);

  // Farm totals
  var totFish = live.reduce(function(s,r){return s+(r.fishNo||0);},0);
  var totBio  = live.reduce(function(s,r){return s+(r.biomass||0);},0);
  var alarms  = live.filter(function(r){return(r.density||0)>=25;});
  var warns   = live.filter(function(r){return(r.density||0)>=20&&(r.density||0)<25;});

  var lines = [];
  lines.push('🐟 *'+daFarmName()+' — Daily Report*');
  lines.push('📅 '+today+' | 🏭 '+(daFarmName()));
  lines.push('─────────────────────');
  lines.push('🐟 Total Fish: *'+totFish.toLocaleString()+'*');
  lines.push('⚖️ Biomass: *'+(totBio/1000).toFixed(3)+' MT*');
  lines.push('🌾 Feed Today: *'+feedToday.toFixed(1)+' kg*');
  lines.push('💀 Mortality Today: *'+mortToday+'*');
  lines.push('🏊 Active Units: *'+live.length+'*');

  if(alarms.length){
    lines.push('─────────────────────');
    lines.push('⛔ *HIGH DENSITY ALERT ('+alarms.length+' units):*');
    alarms.slice(0,5).forEach(function(r){
      lines.push('  • '+r.unit+': '+( r.density||0).toFixed(1)+' kg/m³');
    });
    if(alarms.length>5) lines.push('  • ...and '+(alarms.length-5)+' more');
  }
  if(warns.length){
    lines.push('⚠️ *Monitor ('+warns.length+' units):*');
    warns.slice(0,3).forEach(function(r){
      lines.push('  • '+r.unit+': '+(r.density||0).toFixed(1)+' kg/m³');
    });
  }

  lines.push('─────────────────────');
  lines.push('📊 _Generated by Farm Manager_');

  return lines.join('\n');
}

// FEEDING SCHEDULE — Auto daily schedule from SFR
// ══════════════════════════════════════════════════════════

function generateDailySchedule(date){
  date = date || new Date().toISOString().slice(0,10);
  var cfg    = getSettings();
  var liveRs = _txLiveRows().filter(function(r){
    return (r.fishNo||0)>0 && (farmFilter==='all'||r.farm===farmFilter);
  });
  var waterTemp = cfg.waterTemp || cfg.optTemp || 28;
  var waterDO   = cfg.waterDO   || 7;
  var schedule  = [];

  liveRs.forEach(function(r){
    var sfr    = getSFRAdjusted(r.avgWt||0, r.farm||farmFilter, waterTemp, waterDO);
    var bio    = r.biomass || 0;
    var totalKg = bio * sfr / 100;
    if(totalKg <= 0) return;

    // Split into 3 meals
    var meals = [
      {meal:'صباح 8am',  pct:0.35, kg:+(totalKg*0.35).toFixed(2)},
      {meal:'ظهر 12pm', pct:0.35, kg:+(totalKg*0.35).toFixed(2)},
      {meal:'مساء 4pm', pct:0.30, kg:+(totalKg*0.30).toFixed(2)},
    ];

    // Get recommended feed type from inventory
    var availFeed = getAvailableFeedTypes();
    var feedType  = availFeed.length ? availFeed[0] : (cfg.defaultFeedType||'');

    schedule.push({
      unit:    r.unit,
      farm:    r.farm||'',
      fishNo:  r.fishNo||0,
      avgWt:   +(r.avgWt||0).toFixed(0),
      bio:     +bio.toFixed(1),
      sfr:     +(sfr*100).toFixed(2),
      totalKg: +totalKg.toFixed(2),
      meals:   meals,
      feedType:feedType,
      density: +(r.density||0).toFixed(1),
      blocked: isFeedingBlocked ? isFeedingBlocked(waterTemp, waterDO).blocked : false,
    });
  });

  return {date:date, waterTemp:waterTemp, waterDO:waterDO, schedule:schedule,
    totalKg:+schedule.reduce(function(s,r){return s+r.totalKg;},0).toFixed(1)};
}

function qfChangeFarm(v){ _qfState.farm=v; _qfState.section=''; show('quick-feed'); }
function qfChangeSec(v){ _qfState.section=v; show('quick-feed'); }
function qfChangeDate(v){ _qfState.date=v; show('quick-feed'); }
function qfApplySFR(){
  var sched = generateDailySchedule(_qfState.date);
  var applied = 0;
  sched.schedule.forEach(function(s){
    if(s.blocked) return;
    var unit = s.unit;
    if(_qfState.section && !unit.includes('.'+_qfState.section+'T')) return;
    var el = document.getElementById('qf-kg-'+unit);
    if(el){ el.value = (s.totalKg/3).toFixed(2); applied++; }
  });
  toast('✅ تم تطبيق SFR على '+applied+' وحدة');
}

function qfSaveOne(unit){
  var kgEl   = document.getElementById('qf-kg-'+unit);
  var feedEl = document.getElementById('qf-feed-'+unit);
  var kg     = parseFloat(kgEl?kgEl.value:0)||0;
  if(kg<=0){ toast('⚠️ ادخل الكمية'); return; }
  var feed = feedEl?feedEl.value:'';

  // Check inventory
  if(getFeedInv().length){
    var check = checkFeedAvailable(feed, kg);
    if(!check.ok){ toast(check.msg); return; }
  }

  addTX({type:'feeding', date:_qfState.date, unit:unit, kg:kg, feed:feed, meal:_qfState.meal});
  if(kgEl) kgEl.style.background='#dcfce7';
  toast('✅ '+unit+': '+kg+' كجم');
}

function qfSaveAll(){
  var units = _txLiveRows().filter(function(r){
    return (r.fishNo||0)>0 &&
      r.farm===_qfState.farm &&
      (!_qfState.section||r.unit.includes('.'+_qfState.section+'T'));
  });
  var saved=0, errors=[];

  // Calculate total needed
  var byFeed = {};
  units.forEach(function(r){
    var kgEl = document.getElementById('qf-kg-'+r.unit);
    var feedEl = document.getElementById('qf-feed-'+r.unit);
    var kg = parseFloat(kgEl?kgEl.value:0)||0;
    var feed = feedEl?feedEl.value:'';
    if(kg<=0) return;
    if(!byFeed[feed]) byFeed[feed]=0;
    byFeed[feed]+=kg;
  });

  // Check inventory
  if(getFeedInv().length){
    var blocked = [];
    Object.keys(byFeed).forEach(function(f){
      var check = checkFeedAvailable(f, byFeed[f]);
      if(!check.ok) blocked.push(f+': '+check.msg);
    });
    if(blocked.length){ toast('❌ '+blocked[0]); return; }
  }

  units.forEach(function(r){
    var kgEl   = document.getElementById('qf-kg-'+r.unit);
    var feedEl = document.getElementById('qf-feed-'+r.unit);
    var kg     = parseFloat(kgEl?kgEl.value:0)||0;
    if(kg<=0) return;
    var feed = feedEl?feedEl.value:'';
    addTX({type:'feeding', date:_qfState.date, unit:r.unit, kg:kg, feed:feed, meal:_qfState.meal});
    saved++;
  });

  if(saved) toast('✅ تم حفظ '+saved+' وحدة — '+_qfState.meal+' '+_qfState.date);
  show('quick-feed');
}

// OFFLINE MODE — Queue & Sync
// ══════════════════════════════════════════════════════════

var OFFLINE_QUEUE_KEY = 'daracqua_offline_queue_v1';

function getOfflineQueue(){
  try{ return JSON.parse(localStorage.getItem(OFFLINE_QUEUE_KEY)||'[]'); }catch(e){ return []; }
}
function saveOfflineQueue(q){
  try{ localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(q)); }catch(e){}
}

function addToOfflineQueue(op, data){
  var q = getOfflineQueue();
  q.push({op:op, data:data, ts:new Date().toISOString(), id:Date.now()+'_'+Math.random().toString(36).slice(2,5)});
  saveOfflineQueue(q);
  updateOfflineStatus();
}

async function syncOfflineQueue(){
  if(!sbReady||!SB_FARM_ID) return;
  var q = getOfflineQueue();
  if(!q.length) return;

  var failed = [];
  for(var i=0;i<q.length;i++){
    var item = q[i];
    try{
      if(item.op==='upsert_tx'){
        await _txUpsertOne(item.data);
      } else if(item.op==='delete_tx'){
        await _txDeleteOne(item.data.id);
      } else if(item.op==='upsert_feedinv'){
        await _feedInvUpsertOne(item.data);
      }
    }catch(e){
      failed.push(item);
    }
  }
  saveOfflineQueue(failed);
  updateOfflineStatus();
  if(q.length-failed.length>0){
    console.log('Synced '+(q.length-failed.length)+' offline operations');
    if(q.length-failed.length>0) toast('✅ تمت مزامنة '+(q.length-failed.length)+' عملية محفوظة');
  }
}

function updateOfflineStatus(){
  var isOnline  = navigator.onLine;
  var qLen      = getOfflineQueue().length;
  var statusEl  = document.getElementById('offline-status');
  if(!statusEl) return;

  if(!isOnline){
    statusEl.textContent = '📴 غير متصل';
    statusEl.style.background = '#fee2e2';
    statusEl.style.color = 'var(--red)';
  } else if(qLen>0){
    statusEl.textContent = '🔄 '+qLen+' في الانتظار';
    statusEl.style.background = '#fef3c7';
    statusEl.style.color = 'var(--amber)';
    // Try to sync
    syncOfflineQueue();
  } else {
    statusEl.textContent = '🟢 متصل';
    statusEl.style.background = '#dcfce7';
    statusEl.style.color = 'var(--green)';
  }
}

// Hook into addTX for offline support
var _origAddTXBase = addTX;
addTX = function(obj){
  var result = _origAddTXBase(obj);
  // If offline, queue for later sync
  if(!navigator.onLine || !sbReady){
    addToOfflineQueue('upsert_tx', obj);
  }
  return result;
};

// Monitor online/offline events
if(typeof window !== 'undefined'){
  window.addEventListener('online',  function(){ updateOfflineStatus(); if(currentUser && !_cloudStarted) startCloudSync(); else syncOfflineQueue(); });
  window.addEventListener('offline', function(){ updateOfflineStatus(); });
}

function applyScheduleToSheet(){

var _lastAlertSent = {};

function checkAndSendAlerts(){
  var alerts = generateAlerts();
  var critical = alerts.filter(function(a){return a.level==='critical';});
  if(!critical.length) return;

  var now = Date.now();
  var newAlerts = critical.filter(function(a){
    var lastSent = _lastAlertSent[a.id||a.title]||0;
    return now - lastSent > 3600000; // don't repeat within 1 hour
  });

  if(!newAlerts.length) return;

  // Generate WhatsApp alert message
  var lines = [];
  lines.push('⚠️ *تنبيه حرج — '+daFarmName()+'*');
  lines.push('📅 '+new Date().toISOString().slice(0,16).replace('T',' '));
  lines.push('─────────────────────');
  newAlerts.forEach(function(a){
    lines.push('🔴 *'+a.title+'*');
    lines.push('   '+a.msg);
  });
  lines.push('─────────────────────');
  lines.push('🔗 افتح الأداة للتفاصيل');

  var msg = lines.join('\n');

  // Mark as sent
  newAlerts.forEach(function(a){ _lastAlertSent[a.id||a.title] = now; });

  // Show in-app notification + WhatsApp link
  var waUrl = 'https://wa.me/?text='+encodeURIComponent(msg);

  // Show alert banner
  toast('🔴 '+newAlerts.length+' تنبيه حرج — افتح التنبيهات الذكية', 8000);

  // Browser notification if enabled
  if(isNotifEnabled() && typeof Notification !== 'undefined' && Notification.permission === 'granted'){
    new Notification('⚠️ '+daFarmName(), {
      body: newAlerts[0].msg,
      icon: '/icon-192.png'
    });
  }
}

// Auto-check alerts every 5 minutes

function startAlertMonitor(){
  if(_alertInterval) return;

// ══════════════════════════════════════════════════════════

function calcPL(){
  var cfg    = getSettings();
  var allTX  = getTX();
  var inv    = getFeedInv();
  var liveRs = _txLiveRows().filter(function(r){return(r.fishNo||0)>0&&(farmFilter==='all'||r.farm===farmFilter);});

  // Feed cost
  var feedCostMap = {};
  inv.filter(function(e){return e.txType==='purchase'&&e.price>0;}).forEach(function(e){
    feedCostMap[e.feedType] = e.price;
  });

  var feedTX = allTX.filter(function(t){return t.type==='feeding'&&(farmFilter==='all'||t.unit&&t.unit.startsWith(farmFilter+'.'));});
  var totalFeedKg   = feedTX.reduce(function(s,t){return s+(t.kg||0);},0);
  var totalFeedCost = feedTX.reduce(function(s,t){
    var price = feedCostMap[t.feed]||cfg.defaultFeedPrice||0;
    return s+(t.kg||0)*price;
  },0);

  // Harvest revenue
  var harvTX = allTX.filter(function(t){return (t.type==='harvesting'||t.type==='harvest')&&(farmFilter==='all'||!t.unit||t.unit.startsWith(farmFilter+'.'));});
  var totalHarvKg  = harvTX.reduce(function(s,t){return s+(t.kg||0);},0);
  var totalHarvRev = harvTX.reduce(function(s,t){return s+(t.kg||0)*(t.price||cfg.harvestPrice||0);},0);

  // Current inventory value (live biomass)
  var totBio   = liveRs.reduce(function(s,r){return s+(r.biomass||0);},0);
  var bioValue = totBio*(cfg.harvestPrice||3.5);

  // Mortality loss
  var mortTX    = allTX.filter(function(t){return t.type==='mortality'&&(farmFilter==='all'||t.unit&&t.unit.startsWith(farmFilter+'.'));});
  var mortCount = mortTX.reduce(function(s,t){return s+(t.count||0);},0);
  var avgWtAll  = liveRs.length?liveRs.reduce(function(s,r){return s+(r.avgWt||0);},0)/liveRs.length:0;
  var mortValue = mortCount*(avgWtAll/1000)*(cfg.harvestPrice||3.5);

  // P&L
  var totalRevenue = totalHarvRev + bioValue;
  var totalCost    = totalFeedCost;
  var grossProfit  = totalRevenue - totalCost;
  var profitMargin = totalRevenue>0?(grossProfit/totalRevenue*100):0;
  var costPerKg    = totalHarvKg>0?totalFeedCost/totalHarvKg:0;

  return {
    feedKg:+totalFeedKg.toFixed(1), feedCost:+totalFeedCost.toFixed(2),
    harvKg:+totalHarvKg.toFixed(1), harvRev:+totalHarvRev.toFixed(2),
    bioValue:+bioValue.toFixed(2), mortCount:mortCount, mortValue:+mortValue.toFixed(2),
    totalRevenue:+totalRevenue.toFixed(2), totalCost:+totalCost.toFixed(2),
    grossProfit:+grossProfit.toFixed(2), profitMargin:+profitMargin.toFixed(1),
    costPerKg:+costPerKg.toFixed(3), totBio:+totBio.toFixed(0)
  };
}

      +'</div>';
  }

  // Monthly aggregates from snapshots
  var byMonth = {};
  snaps.forEach(function(s){
    var m = (s.date||'').slice(0,7);
    if(!m) return;
    if(!byMonth[m]) byMonth[m]={month:m,snapCount:0,totFish:0,totBio:0,feed:0,mort:0,alarms:0};
    byMonth[m].snapCount++;
    byMonth[m].totFish += s.totFish||0;
    byMonth[m].totBio  += s.totBio||0;
    byMonth[m].alarms  += s.alarms||0;
    byMonth[m].mort    += s.mortLast24h||0;
  });
  // Average per month
  Object.values(byMonth).forEach(function(m){
    m.avgFish = +(m.totFish/m.snapCount).toFixed(0);
    m.avgBio  = +(m.totBio/m.snapCount).toFixed(3);
  });

  // Add feed from TX
  allTX.filter(function(t){return t.type==='feeding';}).forEach(function(t){
    var m = (t.date||'').slice(0,7);
    if(byMonth[m]) byMonth[m].feed+=t.kg||0;
  });

  var months = Object.values(byMonth).sort(function(a,b){return a.month>b.month?1:-1;});

  // Biomass trend chart
  h += '<div class="card" style="margin-bottom:14px">';
  h += '<div class="card-title">📈 متوسط Biomass الشهري (MT)</div>';
  var maxBio = Math.max.apply(null, months.map(function(m){return m.avgBio;}));
  h += '<div style="display:flex;align-items:flex-end;gap:4px;height:100px;padding:8px 0">';
  months.forEach(function(m,i){
    var pct = maxBio>0?(m.avgBio/maxBio*100):0;
    var isLast = i===months.length-1;
    h += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px">';
    h += '<div style="font-size:9px;color:var(--teal);font-weight:700">'+(m.avgBio/1000).toFixed(2)+'</div>';
    h += '<div style="width:100%;background:'+(isLast?'var(--teal)':'var(--deep)')+';opacity:'+(isLast?1:0.7)+';border-radius:2px 2px 0 0;height:'+Math.max(3,pct*0.8)+'px"></div>';
    h += '<div style="font-size:8px;color:var(--muted)">'+m.month.slice(5)+'</div>';
    h += '</div>';
  });
  h += '</div></div>';

  // Monthly comparison table
  h += '<div class="card"><div class="card-title">📊 مقارنة شهرية</div><div style="overflow-x:auto">';
  h += '<table style="width:100%;border-collapse:collapse;font-size:12px">';
  h += '<thead><tr style="background:var(--deep);color:#fff">';
  ['الشهر','متوسط Biomass (MT)','متوسط الأسماك','علف (kg)','نفوق','تنبيهات كثافة','snapshots'].forEach(function(c){
    h += '<th style="padding:8px;text-align:right;white-space:nowrap">'+c+'</th>';
  });
  h += '</tr></thead><tbody>';
  months.slice().reverse().forEach(function(m,i){
    var isLast = i===0;
    h += '<tr style="background:'+(isLast?'var(--light)':i%2===0?'#fff':'var(--paper)')+'">';
    h += '<td style="padding:7px 8px;font-weight:'+(isLast?700:400)+';color:'+(isLast?'var(--teal)':'var(--ink)')+'">'+m.month+(isLast?' 🔵':'')+'</td>';
    h += '<td style="padding:7px 8px;text-align:right;font-weight:700">'+(m.avgBio/1000).toFixed(3)+'</td>';
    h += '<td style="padding:7px 8px;text-align:right">'+m.avgFish.toLocaleString()+'</td>';

// 8. Survival Rate Tracker
// ════════════════════════════════════════════════════════════
function getSurvivalData(){
  var allTX = getTX();
  var result = [];
  
  _txLiveRows().forEach(function(r){
    var raw = RAW.find(function(x){return x.unit===r.unit;});
    if(!raw) return;
    
    var startFish = raw.fishNo||0;
    var startDate = raw.startDate||'';
    var batch     = raw.batch||'';
    
    // Mortality since stocking
    var mort = allTX.filter(function(t){return t.type==='mortality'&&t.unit===r.unit;})
                    .reduce(function(s,t){return s+(t.count||0);},0);
    
    // Days since stocking
    var days = startDate ? Math.floor((Date.now()-new Date(startDate).getTime())/864e5) : 0;
    
    // Survival rate
    var survRate = startFish > 0 ? ((startFish - mort) / startFish * 100) : 100;
    
    result.push({
      unit:      r.unit,
      farm:      r.farm||'',
      batch:     batch,
      startDate: startDate,
      startFish: startFish,
      currentFish: r.fishNo||0,
      mortality: mort,
      survRate:  +survRate.toFixed(1),
      days:      days,
      avgWt:     r.avgWt||0,
      biomass:   r.biomass||0,
    });
  });
  
  return result.sort(function(a,b){return a.survRate-b.survRate;});
}

  // Summary cards

   {icon:'⚠️',lbl:'وحدات < 90%',val:low,c:low>0?'var(--red)':'var(--green)'},
   {icon:'🐟',lbl:'إجمالي الوحدات',val:data.length,c:'var(--deep)'},
  ].forEach(function(k){
    h+='<div class="card" style="padding:14px;text-align:center"><div style="font-size:22px">'+k.icon+'</div>';

    h+='<div style="font-size:20px;font-weight:800;color:'+k.c+'">'+k.val+'</div></div>';
  });
  h += '</div>';

  h += '<div class="card"><div class="card-title">نسبة النجاة بالوحدة</div><div style="overflow-x:auto">';
  h += '<table style="width:100%;border-collapse:collapse;font-size:12px">';

  ['الوحدة','Batch','أيام','زريعة','نفوق','حالي','نسبة النجاة',''].forEach(function(c){

  });

  data.forEach(function(r,i){

    var pct   = r.survRate;
    h += '<tr style="background:'+(i%2===0?'var(--light)':'#fff')+'">';

    h += '<td style="padding:7px 8px;font-size:10px;color:var(--muted)">'+( r.batch||'—').slice(0,12)+'</td>';
    h += '<td style="padding:7px 8px;text-align:right">'+r.days+'</td>';

// 1. Growth Curves
// ════════════════════════════════════════════════════════════
var _growthUnit = '';

function renderGrowthCurves(){
  var allUnits = _txLiveRows().filter(function(r){return(r.fishNo||0)>0&&(farmFilter==='all'||r.farm===farmFilter);}).map(function(r){return r.unit;}).sort();
  if(!_growthUnit && allUnits.length) _growthUnit = allUnits[0];
  
  var allTX  = getTX();
  var raw    = RAW.find(function(x){return x.unit===_growthUnit;})||{};
  var samps  = allTX.filter(function(t){return t.type==='sampling'&&t.unit===_growthUnit;})
                    .sort(function(a,b){return a.date>b.date?1:-1;});
  var feeds  = allTX.filter(function(t){return t.type==='feeding'&&t.unit===_growthUnit;});

  var h = '<div class="ph"><div><h2>📈 Growth Curves</h2>';
  h += '<p style="font-size:11px;color:var(--muted)">نمو الوحدة من الزريعة لحد دلوقتي</p></div></div>';

  // Unit selector
  h += '<div class="card" style="margin-bottom:12px;padding:12px">';
  h += '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">';
  h += '<label style="font-size:12px;font-weight:600;color:var(--muted)">الوحدة:</label>';
  h += '<select onchange="_growthUnit=this.value;show(&quot;growth-curves&quot;)" style="padding:6px 12px;border:1.5px solid var(--line);border-radius:8px;font:inherit">';
  allUnits.forEach(function(u){
    h += '<option value="'+u+'"'+(u===_growthUnit?' selected':'')+'>'+u+'</option>';
  });
  h += '</select>';
  if(raw.batch) h += '<span style="font-size:11px;color:var(--muted);padding:4px 10px;background:var(--light);border-radius:6px">'+raw.batch+'</span>';
  if(raw.startDate) h += '<span style="font-size:11px;color:var(--muted)">📅 زريعة: '+raw.startDate+'</span>';
  h += '</div></div>';

  if(!samps.length){
    h += '<div class="card" style="text-align:center;padding:32px;color:var(--muted)">لا توجد بيانات sampling لهذه الوحدة</div>';
    return h;
  }

  // Build data points
  var points = [];
  if(raw.startDate && raw.startWt){
    points.push({date:raw.startDate, wt:raw.startWt, sgr:0, label:'زريعة', type:'start'});
  }
  samps.forEach(function(s){
    var prev = points[points.length-1];
    var days = prev ? Math.floor((new Date(s.date)-new Date(prev.date))/864e5) : 0;
    var sgr  = prev && prev.wt && days>0 ? computeSGR(prev.wt, s.avgWt||0, days) : 0;
    var feedPeriod = feeds.filter(function(f){return prev && f.date>=prev.date && f.date<=s.date;}).reduce(function(a,f){return a+(f.kg||0);},0);
    var bioGain = prev ? (s.biomass||0) - ((prev.biomass)||0) : 0;
    var fcr = bioGain>0 ? feedPeriod/bioGain : 0;
    points.push({date:s.date, wt:s.avgWt||0, sgr:+sgr.toFixed(3), fcr:fcr>0?+fcr.toFixed(2):null, biomass:s.biomass||0, feedPeriod:+feedPeriod.toFixed(1), type:'sample', label:s.date});
  });

  // Expected growth line (using last SGR)
  var lastSGR = 0;
  points.filter(function(p){return p.sgr>0;}).forEach(function(p){lastSGR=p.sgr;});
  var lastPt  = points[points.length-1];
  var expPts  = [];
  if(lastSGR>0 && lastPt){
    for(var d=1;d<=60;d++){
      var dt = new Date(lastPt.date); dt.setDate(dt.getDate()+d);
      var expWt = lastPt.wt * Math.exp(lastSGR/100*d);
      expPts.push({date:dt.toISOString().slice(0,10), wt:+expWt.toFixed(1)});
    }
  }

  // Summary KPIs
  var totalDays = points.length>1 ? Math.floor((new Date(points[points.length-1].date)-new Date(points[0].date))/864e5) : 0;
  var overallSGR = points.length>1&&points[0].wt ? computeSGR(points[0].wt, lastPt.wt, totalDays) : 0;
  var totalFeed  = feeds.reduce(function(s,f){return s+(f.kg||0);},0);
  var live = _txLiveRows().find(function(r){return r.unit===_growthUnit;});
  var curBio = live ? live.biomass : 0;
  var startBio = raw.fishNo&&raw.startWt ? raw.fishNo*raw.startWt/1000 : 0;
  var bioGainTotal = curBio - startBio;
  var overallFCR = bioGainTotal>0 ? totalFeed/bioGainTotal : 0;

  h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px">';
  [{icon:'🎯',lbl:'SGR الكلي',val:overallSGR.toFixed(3)+'%/day',c:'var(--teal)'},
   {icon:'📦',lbl:'FCR الكلي',val:overallFCR>0?overallFCR.toFixed(2):'—',c:overallFCR>0&&overallFCR<1.5?'var(--green)':overallFCR<2?'var(--amber)':'var(--red)'},
   {icon:'⚖️',lbl:'Av.Wt الحالي',val:(lastPt.wt||0).toFixed(0)+'g',c:'var(--deep)'},
   {icon:'📅',lbl:'أيام في الدورة',val:totalDays,c:'var(--muted)'},
   {icon:'🌾',lbl:'علف كلي',val:totalFeed.toFixed(0)+' kg',c:'var(--amber)'},
  ].forEach(function(k){
    h+='<div class="card" style="padding:12px;text-align:center"><div style="font-size:20px">'+k.icon+'</div>';
    h+='<div style="font-size:10px;color:var(--muted);margin:3px 0">'+k.lbl+'</div>';
    h+='<div style="font-size:16px;font-weight:800;color:'+k.c+'">'+k.val+'</div></div>';
  });
  h += '</div>';

  // Weight growth chart (SVG bar chart)
  h += '<div class="card" style="margin-bottom:12px">';
  h += '<div class="card-title">📈 تطور الوزن (جرام)</div>';
  var maxWt = Math.max.apply(null, points.map(function(p){return p.wt;}));
  maxWt = Math.max(maxWt, expPts.length ? expPts[expPts.length-1].wt : 0);
  h += '<div style="display:flex;align-items:flex-end;gap:4px;height:100px;padding:8px 0;overflow-x:auto">';
  points.forEach(function(p,i){
    var pct = maxWt>0?(p.wt/maxWt*100):0;
    var isLast = i===points.length-1;
    h += '<div style="flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:36px">';
    h += '<div style="font-size:9px;color:var(--deep);font-weight:700">'+p.wt.toFixed(0)+'g</div>';
    h += '<div style="width:28px;background:'+(p.type==='start'?'var(--muted)':'var(--teal)')+';border-radius:3px 3px 0 0;height:'+Math.max(4,pct*0.8)+'px"></div>';
    h += '<div style="font-size:7px;color:var(--muted);white-space:nowrap">'+p.date.slice(5)+'</div>';
    h += '</div>';
  });
  // Expected (next 30 days, every 10)
  [10,20,30].forEach(function(d){
    var ep = expPts[d-1];
    if(!ep) return;
    var pct = maxWt>0?(ep.wt/maxWt*100):0;
    h += '<div style="flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:36px">';
    h += '<div style="font-size:9px;color:var(--amber);font-weight:700">'+ep.wt.toFixed(0)+'g</div>';
    h += '<div style="width:28px;background:var(--amber);opacity:0.5;border-radius:3px 3px 0 0;height:'+Math.max(4,pct*0.8)+'px;border:1px dashed var(--amber)"></div>';
    h += '<div style="font-size:7px;color:var(--amber)">+'+d+'d</div>';
    h += '</div>';
  });
  h += '</div>';
  h += '<div style="font-size:10px;color:var(--muted);margin-top:4px">■ فعلي &nbsp; <span style="color:var(--amber)">■ متوقع (بناءً على SGR حالي)</span></div>';
  h += '</div>';

  // SGR per period table
  h += '<div class="card"><div class="card-title">📊 SGR وFCR لكل فترة</div><div style="overflow-x:auto">';
  h += '<table style="width:100%;border-collapse:collapse;font-size:12px">';
  h += '<thead><tr style="background:var(--deep);color:#fff"><th style="padding:8px;text-align:right">الفترة</th><th style="padding:8px;text-align:right">Av.Wt (g)</th><th style="padding:8px;text-align:right">SGR (%/day)</th><th style="padding:8px;text-align:right">FCR</th><th style="padding:8px;text-align:right">علف (kg)</th></tr></thead><tbody>';
  points.filter(function(p){return p.type==='sample';}).forEach(function(p,i){
    var sgrColor = p.sgr>=0.8?'var(--green)':p.sgr>=0.5?'var(--amber)':'var(--red)';
    var fcrColor = p.fcr&&p.fcr<1.5?'var(--green)':p.fcr&&p.fcr<2?'var(--amber)':p.fcr?'var(--red)':'var(--muted)';
    h += '<tr style="background:'+(i%2===0?'var(--light)':'#fff')+'">';
    h += '<td style="padding:7px 8px">'+p.date+'</td>';
    h += '<td style="padding:7px 8px;text-align:right;font-weight:700">'+p.wt.toFixed(1)+'</td>';
    h += '<td style="padding:7px 8px;text-align:right;color:'+sgrColor+';font-weight:700">'+( p.sgr||0).toFixed(3)+'</td>';
    h += '<td style="padding:7px 8px;text-align:right;color:'+fcrColor+';font-weight:700">'+(p.fcr||'—')+'</td>';
    h += '<td style="padding:7px 8px;text-align:right">'+( p.feedPeriod||0)+'</td>';
    h += '</tr>';
  });
  h += '</tbody></table></div></div>';
  return h;
}

// ════════════════════════════════════════════════════════════
// 2. Harvest Planner
// ════════════════════════════════════════════════════════════
function renderHarvestPlanner(){
  var cfg    = getSettings();
  var target = parseFloat(cfg.harvestTargetWt)||450; // g
  var price  = parseFloat(cfg.harvestPrice)||3.5;    // BD/kg
  var allTX  = getTX();
  var live   = _txLiveRows().filter(function(r){return(r.fishNo||0)>0&&(farmFilter==='all'||r.farm===farmFilter);});

  var h = '<div class="ph"><div><h2>🎣 Harvest Planner</h2>';
  h += '<p style="font-size:11px;color:var(--muted)">توقعات الحصاد بناءً على SGR الحالي</p></div></div>';

  // Settings row
  h += '<div class="card" style="margin-bottom:12px;padding:12px">';
  h += '<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">';
  h += '<div class="field" style="margin:0"><label style="font-size:11px">وزن الحصاد المستهدف (g)</label>';
  h += '<input type="number" id="hp-target" value="'+target+'" min="200" max="1000" step="10" oninput="show(&quot;harvest-planner&quot;)" style="width:90px;padding:6px 10px;border:1.5px solid var(--line);border-radius:8px;font:inherit"/></div>';
  h += '<div class="field" style="margin:0"><label style="font-size:11px">السعر (BD/kg)</label>';
  h += '<input type="number" id="hp-price" value="'+price+'" min="0" max="20" step="0.1" oninput="show(&quot;harvest-planner&quot;)" style="width:80px;padding:6px 10px;border:1.5px solid var(--line);border-radius:8px;font:inherit"/></div>';
  h += '<button class="savebtn" style="width:auto;padding:8px 18px" onclick="saveHarvestSettings()">💾 حفظ</button>';
  h += '</div></div>';

  // Calculate for each unit
  var rows = [];
  live.forEach(function(r){
    // Get latest SGR from sampling
    var samps = allTX.filter(function(t){return t.type==='sampling'&&t.unit===r.unit;}).sort(function(a,b){return a.date>b.date?1:-1;});
    var sgr = 0;
    if(samps.length>=2){
      var s1=samps[samps.length-2], s2=samps[samps.length-1];
      var days=Math.floor((new Date(s2.date)-new Date(s1.date))/864e5);
      if(days>0) sgr=computeSGR(s1.avgWt||1, s2.avgWt||1, days);
    } else if(samps.length===1 && (RAW.find(function(x){return x.unit===r.unit;})||{}).startWt){
      var raw=RAW.find(function(x){return x.unit===r.unit;});
      var days=Math.floor((new Date(samps[0].date)-new Date(raw.startDate))/864e5);
      if(days>0) sgr=computeSGR(raw.startWt, samps[0].avgWt||1, days);
    }

    var curWt  = r.avgWt||0;
    var tWt    = parseFloat((document.getElementById('hp-target')||{}).value)||target;
    var pr     = parseFloat((document.getElementById('hp-price')||{}).value)||price;
    var daysToHarvest = sgr>0&&curWt>0&&tWt>curWt ? Math.ceil(Math.log(tWt/curWt)/(sgr/100)) : null;
    var harvestDate   = daysToHarvest ? new Date(Date.now()+daysToHarvest*864e5).toISOString().slice(0,10) : null;
    var expBio        = daysToHarvest ? (r.fishNo||0)*tWt/1000 : (r.fishNo||0)*(r.avgWt||0)/1000;
    var expRev        = expBio * pr;

    rows.push({
      unit:r.unit, farm:r.farm||'', curWt:curWt, sgr:+sgr.toFixed(3),
      daysToHarvest:daysToHarvest, harvestDate:harvestDate,
      expBio:+expBio.toFixed(1), expRev:+expRev.toFixed(1),
      fishNo:r.fishNo||0, density:r.density||0,
      ready: curWt >= tWt*0.95
    });
  });

  // Sort: ready first, then by harvest date
  rows.sort(function(a,b){
    if(a.ready&&!b.ready) return -1;
    if(!a.ready&&b.ready) return 1;
    if(a.daysToHarvest&&b.daysToHarvest) return a.daysToHarvest-b.daysToHarvest;
    return 0;
  });

  // Summary
  var readyUnits  = rows.filter(function(r){return r.ready;});
  var readyBio    = readyUnits.reduce(function(s,r){return s+r.expBio;},0);
  var readyRev    = readyUnits.reduce(function(s,r){return s+r.expRev;},0);

   {icon:'⚖️',lbl:'Biomass جاهز',val:readyBio.toFixed(1)+' MT',c:'var(--teal)'},
   {icon:'💰',lbl:'إيراد متوقع',val:'BD '+readyRev.toFixed(0),c:'var(--amber)'},
   {icon:'📅',lbl:'< 30 يوم',val:next30.length+' وحدة',c:'var(--deep)'},

    h+='<div style="font-size:16px;font-weight:800;color:'+k.c+'">'+k.val+'</div></div>';
  });
  h += '</div>';

  // Table
  h += '<div class="card"><div style="overflow-x:auto">';
  h += '<table style="width:100%;border-collapse:collapse;font-size:12px">';
  h += '<thead><tr style="background:var(--deep);color:#fff">';
  ['الوحدة','Av.Wt (g)','SGR','أيام للحصاد','تاريخ الحصاد','Bio (MT)','إيراد (BD)','الحالة'].forEach(function(c){

  });

    h += '<tr style="background:'+bg+'">';
    h += '<td style="padding:7px 8px;font-weight:700;color:var(--teal)">'+r.unit+'</td>';
    h += '<td style="padding:7px 8px;text-align:right;font-weight:700">'+r.curWt.toFixed(0)+'</td>';
    h += '<td style="padding:7px 8px;text-align:right;color:'+(r.sgr>=0.8?'var(--green)':r.sgr>=0.5?'var(--amber)':'var(--red)')+'">'+( r.sgr||'—')+'</td>';
    h += '<td style="padding:7px 8px;text-align:right;font-weight:700;color:'+(r.daysToHarvest<=30?'var(--green)':r.daysToHarvest<=60?'var(--amber)':'var(--muted)')+'">'+( r.daysToHarvest||'—')+'</td>';

    h += '<td style="padding:7px 8px;text-align:right;font-weight:700;color:var(--teal)">'+r.expRev.toFixed(0)+'</td>';

    h += '</tr>';
  });
  h += '</tbody></table></div></div>';
  return h;
}

// ════════════════════════════════════════════════════════════
// 3. Batch Comparison
// ════════════════════════════════════════════════════════════
function renderBatchComparison(){
  var allTX = getTX();
  var batches = {};

  _txLiveRows().forEach(function(r){
    var raw = RAW.find(function(x){return x.unit===r.unit;});
    if(!raw||!raw.batch) return;
    var b = raw.batch;
    if(!batches[b]) batches[b]={batch:b,units:[],totalFish:0,totalBio:0,mortality:0,startFish:0,feed:0,samples:[]};
    batches[b].units.push(r.unit);
    batches[b].totalFish += r.fishNo||0;
    batches[b].totalBio  += r.biomass||0;
    batches[b].startFish += raw.fishNo||0;

    // Mortality
    allTX.filter(function(t){return t.type==='mortality'&&t.unit===r.unit;}).forEach(function(t){batches[b].mortality+=t.count||0;});
    // Feed
    allTX.filter(function(t){return t.type==='feeding'&&t.unit===r.unit;}).forEach(function(t){batches[b].feed+=t.kg||0;});
    // Samples
    allTX.filter(function(t){return t.type==='sampling'&&t.unit===r.unit;}).forEach(function(t){batches[b].samples.push(t);});
  });

  var rows = Object.values(batches).map(function(b){
    var survRate = b.startFish>0?((b.startFish-b.mortality)/b.startFish*100):100;
    var samps    = b.samples.sort(function(a,c){return a.date>c.date?1:-1;});
    var latestWt = samps.length?(samps[samps.length-1].avgWt||0):0;
    var startWt  = (RAW.find(function(x){return x.batch===b.batch;})||{}).startWt||0;
    var days     = startWt&&latestWt&&samps.length ? Math.floor((new Date(samps[samps.length-1].date)-new Date((RAW.find(function(x){return x.batch===b.batch;})||{}).startDate||samps[0].date))/864e5) : 0;
    var sgr      = startWt&&latestWt&&days>0 ? computeSGR(startWt, latestWt, days) : 0;
    var bioGain  = b.totalBio - b.startFish*(startWt/1000||0);
    var fcr      = bioGain>0 ? b.feed/bioGain : 0;
    return Object.assign(b, {survRate:+survRate.toFixed(1), latestWt:latestWt, sgr:+sgr.toFixed(3), fcr:fcr>0?+fcr.toFixed(2):0, days:days});
  });

  var h = '<div class="ph"><div><h2>🔬 Batch Comparison</h2>';
  h += '<p style="font-size:11px;color:var(--muted)">مقارنة أداء الـ batches</p></div></div>';

  if(!rows.length){
    return h+'<div class="card" style="text-align:center;padding:48px;color:var(--muted)">لا توجد batch data</div>';
  }

  h += '<div class="card"><div style="overflow-x:auto">';
  h += '<table style="width:100%;border-collapse:collapse;font-size:12px">';
  h += '<thead><tr style="background:var(--deep);color:#fff">';
  ['Batch','وحدات','أيام','Fish','Biomass (MT)','Mortality','Survival %','SGR','FCR','علف (kg)'].forEach(function(c){
    h+='<th style="padding:8px;text-align:right;white-space:nowrap">'+c+'</th>';
  });
  h += '</tr></thead><tbody>';
  rows.sort(function(a,b){return b.sgr-a.sgr;}).forEach(function(r,i){
    var survColor = r.survRate>=95?'var(--green)':r.survRate>=90?'var(--amber)':'var(--red)';
    var sgrColor  = r.sgr>=0.8?'var(--green)':r.sgr>=0.5?'var(--amber)':'var(--red)';
    var fcrColor  = r.fcr>0&&r.fcr<1.5?'var(--green)':r.fcr<2?'var(--amber)':r.fcr?'var(--red)':'var(--muted)';
    h += '<tr style="background:'+(i%2===0?'var(--light)':'#fff')+'">';
    h += '<td style="padding:7px 8px;font-weight:700;color:var(--teal);font-size:11px">'+r.batch.slice(0,18)+'</td>';
    h += '<td style="padding:7px 8px;text-align:right">'+r.units.length+'</td>';
    h += '<td style="padding:7px 8px;text-align:right">'+r.days+'</td>';
    h += '<td style="padding:7px 8px;text-align:right">'+r.totalFish.toLocaleString()+'</td>';
    h += '<td style="padding:7px 8px;text-align:right;font-weight:700">'+(r.totalBio/1000).toFixed(3)+'</td>';
    h += '<td style="padding:7px 8px;text-align:right;color:var(--red)">'+r.mortality+'</td>';
    h += '<td style="padding:7px 8px;text-align:right;font-weight:700;color:'+survColor+'">'+r.survRate+'%</td>';
    h += '<td style="padding:7px 8px;text-align:right;font-weight:700;color:'+sgrColor+'">'+( r.sgr||'—')+'</td>';
    h += '<td style="padding:7px 8px;text-align:right;font-weight:700;color:'+fcrColor+'">'+( r.fcr||'—')+'</td>';
    h += '<td style="padding:7px 8px;text-align:right">'+r.feed.toFixed(0)+'</td>';
    h += '</tr>';
  });
  h += '</tbody></table></div></div>';
  return h;
}

// ════════════════════════════════════════════════════════════
// 5. Mortality Analysis
// ════════════════════════════════════════════════════════════
function renderMortalityAnalysis(){
  var allTX = getTX();
  var morts  = allTX.filter(function(t){return t.type==='mortality'&&(farmFilter==='all'||t.unit&&t.unit.startsWith(farmFilter+'.'));});
  var h = '<div class="ph"><div><h2>💀 Mortality Analysis</h2>';
  h += '<p style="font-size:11px;color:var(--muted)">تحليل النفوق — الأسباب والأكثر تأثراً</p></div></div>';

  if(!morts.length){
    return h+'<div class="card" style="text-align:center;padding:48px;color:var(--muted)">✅ لا يوجد نفوق مسجل</div>';
  }

  // By cause
  var byCause={};
  morts.forEach(function(t){var c=t.cause||'غير محدد';byCause[c]=(byCause[c]||0)+(t.count||0);});
  // By unit
  var byUnit={};
  morts.forEach(function(t){var u=t.unit||'?';byUnit[u]=(byUnit[u]||0)+(t.count||0);});
  // By month
  var byMonth={};
  morts.forEach(function(t){var m=(t.date||'').slice(0,7);byMonth[m]=(byMonth[m]||0)+(t.count||0);});

  var total = morts.reduce(function(s,t){return s+(t.count||0);},0);

  h += '<div class="card" style="margin-bottom:12px;text-align:center"><div style="font-size:32px;font-weight:800;color:var(--red)">'+total.toLocaleString()+'</div><div style="font-size:12px;color:var(--muted)">إجمالي النفوق</div></div>';

  // Cause breakdown
  h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">';
  h += '<div class="card"><div class="card-title">🔍 الأسباب</div>';
  Object.entries(byCause).sort(function(a,b){return b[1]-a[1];}).forEach(function(e){
    var pct = total>0?(e[1]/total*100):0;
    h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">';
    h += '<div style="flex:1;font-size:12px">'+e[0]+'</div>';
    h += '<div style="width:80px;height:6px;background:#eee;border-radius:3px"><div style="width:'+pct.toFixed(0)+'%;height:6px;background:var(--red);border-radius:3px"></div></div>';
    h += '<div style="font-size:12px;font-weight:700;width:40px;text-align:right">'+e[1]+'</div></div>';
  });
  h += '</div>';

  // Top units
  h += '<div class="card"><div class="card-title">⚠️ الأكثر تأثراً</div>';
  Object.entries(byUnit).sort(function(a,b){return b[1]-a[1];}).slice(0,8).forEach(function(e){
    h += '<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px;border-bottom:1px solid var(--line)">';
    h += '<span style="color:var(--teal);font-weight:600">'+e[0]+'</span>';
    h += '<span style="color:var(--red);font-weight:700">'+e[1]+'</span></div>';
  });
  h += '</div></div>';

  // Monthly trend
  h += '<div class="card"><div class="card-title">📅 النفوق الشهري</div>';
  var months = Object.entries(byMonth).sort(function(a,b){return a[0]>b[0]?1:-1;});
  var maxM   = Math.max.apply(null, months.map(function(m){return m[1];}));
  h += '<div style="display:flex;align-items:flex-end;gap:4px;height:80px;padding:8px 0">';
  months.forEach(function(m){
    var pct = maxM>0?(m[1]/maxM*100):0;
    h += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px">';
    h += '<div style="font-size:9px;color:var(--red)">'+m[1]+'</div>';
    h += '<div style="width:100%;background:var(--red);opacity:0.7;border-radius:2px 2px 0 0;height:'+Math.max(3,pct*0.7)+'px"></div>';
    h += '<div style="font-size:8px;color:var(--muted)">'+m[0].slice(5)+'</div>';
    h += '</div>';
  });
  h += '</div></div>';
  return h;
}

// 4. Water Quality Trends
// ════════════════════════════════════════════════════════════
var _wqTrendUnit = '';

function renderWQTrends(){
  var allTX   = getTX();
  var allUnits = _txLiveRows().filter(function(r){return farmFilter==='all'||r.farm===farmFilter;}).map(function(r){return r.unit;}).sort();
  if(!_wqTrendUnit && allUnits.length) _wqTrendUnit = allUnits[0];
  var wqData  = allTX.filter(function(t){return (t.type==='water-quality'||t.type==='wq'||t.type==='water_quality')&&t.unit===_wqTrendUnit;}).sort(function(a,b){return a.date>b.date?1:-1;});

  var h = '<div class="ph"><div><h2>💧 Water Quality Trends</h2>';
  h += '<p style="font-size:11px;color:var(--muted)">DO · Temp · pH على مدار الوقت</p></div></div>';

  h += '<div class="card" style="margin-bottom:12px;padding:12px">';
  h += '<div style="display:flex;align-items:center;gap:10px">';
  h += '<label style="font-size:12px;font-weight:600;color:var(--muted)">الوحدة:</label>';
  h += '<select onchange="_wqTrendUnit=this.value;show(&quot;wq-trends&quot;)" style="padding:6px 12px;border:1.5px solid var(--line);border-radius:8px;font:inherit">';
  allUnits.forEach(function(u){ h+='<option value="'+u+'"'+(u===_wqTrendUnit?' selected':'')+'>'+u+'</option>'; });
  h += '</select></div></div>';

  if(!wqData.length){
    return h+'<div class="card" style="text-align:center;padding:32px;color:var(--muted)">لا توجد بيانات Water Quality لهذه الوحدة</div>';
  }

  // Latest readings
  var latest = wqData[wqData.length-1];
  h += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px">';
  [{lbl:'🌡️ Temp',val:(latest.temp||'—')+'°C',c:(latest.temp>33||latest.temp<17)?'var(--red)':(latest.temp>30?'var(--amber)':'var(--green)')},
   {lbl:'💨 DO',val:(latest.do||'—')+' mg/L',c:(latest.do<=2)?'var(--red)':(latest.do<5?'var(--amber)':'var(--green)')},
   {lbl:'⚗️ pH',val:latest.ph||'—',c:(latest.ph<6.5||latest.ph>9)?'var(--amber)':'var(--green)'},
  ].forEach(function(k){
    h+='<div class="card" style="padding:14px;text-align:center"><div style="font-size:14px;color:var(--muted);margin-bottom:6px">'+k.lbl+'</div>';
    h+='<div style="font-size:24px;font-weight:800;color:'+k.c+'">'+k.val+'</div>';
    h+='<div style="font-size:10px;color:var(--muted)">آخر قراءة: '+latest.date+'</div></div>';
  });
  h += '</div>';

  // Chart for each parameter
  ['temp','do','ph'].forEach(function(param){
    var label = param==='temp'?'Temp (°C)':param==='do'?'DO (mg/L)':'pH';
    var color = param==='temp'?'var(--red)':param==='do'?'var(--teal)':'var(--amber)';
    var vals  = wqData.map(function(t){return parseFloat(t[param])||0;}).filter(function(v){return v>0;});
    if(!vals.length) return;
    var mx = Math.max.apply(null,vals), mn = Math.min.apply(null,vals);
    
    h += '<div class="card" style="margin-bottom:10px"><div class="card-title" style="color:'+color+'">'+label+'</div>';
    h += '<div style="display:flex;align-items:flex-end;gap:3px;height:60px;padding:4px 0">';
    wqData.slice(-30).forEach(function(t,i){
      var v = parseFloat(t[param])||0; if(!v) return;
      var pct = mx>mn?(v-mn)/(mx-mn)*100:50;
      var isLast = i===Math.min(wqData.length,30)-1;
      h += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:1px">';
      h += '<div style="width:100%;background:'+color+';opacity:'+(isLast?1:0.6)+';border-radius:2px 2px 0 0;height:'+Math.max(3,pct*0.55)+'px"></div>';
      if(i%7===0||isLast) h += '<div style="font-size:7px;color:var(--muted);white-space:nowrap">'+t.date.slice(5)+'</div>';
      else h += '<div></div>';
      h += '</div>';
    });
    h += '</div>';
    h += '<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted)">';
    h += '<span>Min: '+mn.toFixed(1)+'</span><span>Max: '+mx.toFixed(1)+'</span><span>Avg: '+(vals.reduce(function(a,b){return a+b;},0)/vals.length).toFixed(1)+'</span></div>';
    h += '</div>';
  });
  return h;
}

// 7. Feed Cost Calculator
// ════════════════════════════════════════════════════════════
function renderFeedCostCalc(){
  var allTX  = getTX();
  var inv    = getFeedInv();
  var live   = _txLiveRows().filter(function(r){return(r.fishNo||0)>0&&(farmFilter==='all'||r.farm===farmFilter);});

  // Feed cost per type from inventory
  var feedCost = {};
  inv.filter(function(e){return e.txType==='purchase'&&e.price;}).forEach(function(e){
    feedCost[e.feedType] = e.price; // BD per kg
  });

  var h = '<div class="ph"><div><h2>💰 Feed Cost Calculator</h2>';
  h += '<p style="font-size:11px;color:var(--muted)">تكلفة العلف مقابل الكيلو المنتج</p></div></div>';

  // Per unit analysis
  var rows = [];
  live.forEach(function(r){
    var raw = RAW.find(function(x){return x.unit===r.unit;})||{};
    var feed = allTX.filter(function(t){return t.type==='feeding'&&t.unit===r.unit;});
    var totalFeedKg  = feed.reduce(function(s,t){return s+(t.kg||0);},0);
    
    // Feed cost calculation
    var totalFeedCost = 0;
    var byFeedType = {};
    feed.forEach(function(t){
      var tp = t.feed||''; 
      byFeedType[tp]=(byFeedType[tp]||0)+(t.kg||0);
    });
    Object.keys(byFeedType).forEach(function(tp){
      totalFeedCost += byFeedType[tp]*(feedCost[tp]||0);
    });

    // Bio gain
    var startBio = raw.fishNo&&raw.startWt ? raw.fishNo*raw.startWt/1000 : 0;
    var bioGain  = (r.biomass||0) - startBio;
    var fcr      = bioGain>0 ? totalFeedKg/bioGain : 0;
    var costPerKg = bioGain>0&&totalFeedCost>0 ? totalFeedCost/bioGain : 0;
    
    rows.push({unit:r.unit, farm:r.farm||'', totalFeedKg:+totalFeedKg.toFixed(1), totalFeedCost:+totalFeedCost.toFixed(2), bioGain:+bioGain.toFixed(1), fcr:fcr>0?+fcr.toFixed(2):0, costPerKg:+costPerKg.toFixed(3)});
  });

  var totFeed = rows.reduce(function(s,r){return s+r.totalFeedKg;},0);
  var totCost = rows.reduce(function(s,r){return s+r.totalFeedCost;},0);
  var totBioG = rows.reduce(function(s,r){return s+r.bioGain;},0);
  var avgFCR  = rows.filter(function(r){return r.fcr>0;}).reduce(function(s,r){return s+r.fcr;},0) / (rows.filter(function(r){return r.fcr>0;}).length||1);

  h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px">';
  [{icon:'🌾',lbl:'إجمالي العلف',val:totFeed.toFixed(0)+' kg',c:'var(--deep)'},
   {icon:'💰',lbl:'تكلفة العلف',val:'BD '+totCost.toFixed(0),c:'var(--amber)'},
   {icon:'⚖️',lbl:'نمو Biomass',val:totBioG.toFixed(0)+' kg',c:'var(--teal)'},
   {icon:'📊',lbl:'متوسط FCR',val:avgFCR.toFixed(2),c:avgFCR<1.5?'var(--green)':avgFCR<2?'var(--amber)':'var(--red)'},
  ].forEach(function(k){
    h+='<div class="card" style="padding:12px;text-align:center"><div style="font-size:20px">'+k.icon+'</div>';
    h+='<div style="font-size:10px;color:var(--muted);margin:3px 0">'+k.lbl+'</div>';
    h+='<div style="font-size:16px;font-weight:800;color:'+k.c+'">'+k.val+'</div></div>';
  });
  h += '</div>';

  if(!inv.filter(function(e){return e.price;}).length){
    h += '<div style="background:#fef3c7;border:1px solid var(--amber);border-radius:8px;padding:12px;margin-bottom:12px;font-size:12px">⚠️ لم يتم إدخال أسعار العلف في المخزون — أضف السعر عند إدخال مشتريات العلف لحساب التكلفة بدقة</div>';
  }

  h += '<div class="card"><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">';
  h += '<thead><tr style="background:var(--deep);color:#fff">';
  ['الوحدة','علف (kg)','تكلفة (BD)','نمو Bio (kg)','FCR','تكلفة/kg'].forEach(function(c){
    h+='<th style="padding:8px;text-align:right;white-space:nowrap">'+c+'</th>';
  });
  h += '</tr></thead><tbody>';
  rows.sort(function(a,b){return b.costPerKg-a.costPerKg;}).forEach(function(r,i){
    h += '<tr style="background:'+(i%2===0?'var(--light)':'#fff')+'">';
    h += '<td style="padding:7px 8px;font-weight:700;color:var(--teal)">'+r.unit+'</td>';
    h += '<td style="padding:7px 8px;text-align:right">'+r.totalFeedKg+'</td>';
    h += '<td style="padding:7px 8px;text-align:right;color:var(--amber);font-weight:700">'+(r.totalFeedCost||'—')+'</td>';
    h += '<td style="padding:7px 8px;text-align:right">'+r.bioGain+'</td>';
    h += '<td style="padding:7px 8px;text-align:right;color:'+(r.fcr>0&&r.fcr<1.5?'var(--green)':r.fcr<2?'var(--amber)':'var(--red)')+';font-weight:700">'+( r.fcr||'—')+'</td>';
    h += '<td style="padding:7px 8px;text-align:right;font-weight:700;color:'+(r.costPerKg>0?'var(--deep)':'var(--muted)')+'">'+( r.costPerKg||'—')+'</td>';
    h += '</tr>';
  });
  h += '</tbody></table></div></div>';
  return h;
}

function renderUnitTrend(){
  var allUnits = allUnitNames().filter(function(n){
    return farmFilter==='all'||n.startsWith(farmFilter+'.');
  });
  // Default to first unit with sampling data
  var allSamps = getTX().filter(function(t){ return t.type==='sampling'&&t.sgr; });
  var unitsWithData = [];
  allUnits.forEach(function(u){ if(allSamps.some(function(s){return s.unit===u;})) unitsWithData.push(u); });
  if(!_trendUnit && unitsWithData.length) _trendUnit = unitsWithData[0];

  var uid    = _trendUnit;
  var samps  = getTX().filter(function(t){ return t.unit===uid&&t.type==='sampling'; })
                      .sort(function(a,b){ return a.date>b.date?1:-1; });
  var feeds  = getTX().filter(function(t){ return t.unit===uid&&t.type==='feeding'; });

  var h = '';
  h += '<div class="ph" style="margin-bottom:10px"><div>';
  h += '<h2>📈 FCR / SGR Trend</h2>';
  h += '<p style="font-size:11px;color:var(--muted)">مؤشرات النمو وكفاءة التغذية لكل وحدة</p>';
  h += '</div></div>';

  // Unit selector
  h += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center">';
  h += '<span style="font-size:12px;font-weight:700;color:var(--muted)">الوحدة:</span>';
  h += '<select onchange="_trendUnit=this.value;show(\'unit-trend\')" style="border:1.5px solid var(--teal);border-radius:8px;padding:7px 12px;font:inherit;font-size:13px;font-weight:700;color:var(--deep)">';
  h += '<option value="">— اختر وحدة —</option>';
  allUnits.forEach(function(u){
    var hasSamp = allSamps.some(function(s){return s.unit===u;});
    h += '<option value="'+u+'"'+(u===uid?' selected':'')+'>'+u+(hasSamp?' ✓':'')+'</option>';
  });
  h += '</select>';
  if(uid){
    var u = _txLiveRows().find(function(r){return r.unit===uid;})||{};
    h += '<div style="background:var(--paper);border-radius:8px;padding:7px 14px;font-size:12px">';
    h += '🐟 '+fmtK(u.fishNo||0)+' سمكة · ';
    h += '⚖️ '+n(u.avgWt||0,1)+' g · ';
    h += '📦 '+n(u.biomass||0,1)+' كجم';
    h += '</div>';
  }
  h += '</div>';

  if(!uid){
    h += '<div style="text-align:center;padding:60px;color:var(--muted);background:#fff;border-radius:12px;border:1px solid var(--line)">اختر وحدة لعرض مؤشراتها</div>';
    return h;
  }
  if(!samps.length){
    h += '<div style="text-align:center;padding:60px;color:var(--muted);background:#fff;border-radius:12px;border:1px solid var(--line)">لا توجد عينات مسجلة لهذه الوحدة بعد 🔬</div>';
    return h;
  }

  // ── KPI strip from latest sampling ──
  var latest = samps[0];
  var totFeed = feeds.reduce(function(s,t){return s+(t.kg||0);},0);
  h += '<div class="kpis" style="margin-bottom:14px">';
  h += '<div class="kpi '+(latest.sgr>2?'kok':latest.sgr>1?'kwarn':'kalarm')+'"><div class="kpi-lbl">📈 Latest SGR</div><div class="kpi-val">'+(latest.sgr?n(latest.sgr,3):'—')+'</div><div class="kpi-sub">%/يوم</div></div>';
  h += '<div class="kpi '+(latest.fcr&&latest.fcr<2?'kok':latest.fcr&&latest.fcr<3?'kwarn':'')+'"><div class="kpi-lbl">🎯 Latest FCR</div><div class="kpi-val">'+(latest.fcr?n(latest.fcr,2):'—')+'</div><div class="kpi-sub">كجم علف / كجم وزن</div></div>';
  h += '<div class="kpi"><div class="kpi-lbl">⚖️ Latest Wt</div><div class="kpi-val">'+n(latest.avgWt,1)+'</div><div class="kpi-sub">g · '+latest.date+'</div></div>';
  h += '<div class="kpi"><div class="kpi-lbl">🌾 إجمالي العلف</div><div class="kpi-val">'+n(totFeed,1)+'</div><div class="kpi-sub">كجم</div></div>';
  h += '<div class="kpi"><div class="kpi-lbl">🔬 عدد العينات</div><div class="kpi-val">'+samps.length+'</div></div>';
  h += '</div>';

  // ── SVG Charts — Weight + SGR + FCR over time ──
  var W=720, H=160, padL=42, padR=12, padT=16, padB=32;
  var plotW=W-padL-padR, plotH=H-padT-padB;
  var dates = samps.map(function(s){return s.date;}).reverse();
  var n2  = dates.length;
  var xStep = n2>1 ? plotW/(n2-1) : plotW;

  function xPos(i){ return padL + i*xStep; }
  function yPos(val,mn,mx){ return padT + plotH*(1-(mx===mn?0.5:(val-mn)/(mx-mn))); }

  function svgChart(vals, label, color, unit, decimals){
    var filtered = vals.map(function(v){return parseFloat(v)||0;});
    var mn = Math.min.apply(null,filtered), mx = Math.max.apply(null,filtered);
    if(mx===mn){ mn=mn-1; mx=mx+1; }
    var pts = filtered.map(function(v,i){return xPos(i)+','+yPos(v,mn,mx);});
    var area = 'M'+pts.join(' L')+' L'+xPos(n2-1)+','+(padT+plotH)+' L'+padL+','+(padT+plotH)+' Z';
    var line = 'M'+pts.join(' L');
    var svg = '<svg width="100%" viewBox="0 0 '+W+' '+H+'" style="display:block">';
    // Grid
    [0,0.25,0.5,0.75,1].forEach(function(p){
      var y = padT+plotH*(1-p);
      svg += '<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="#e5e7eb" stroke-width="1"/>';
      svg += '<text x="'+(padL-4)+'" y="'+(y+4)+'" text-anchor="end" font-size="9" fill="#9ca3af">'+n(mn+(mx-mn)*p,decimals)+'</text>';
    });
    // Area fill
    svg += '<defs><linearGradient id="g'+label+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+color+'" stop-opacity="0.25"/><stop offset="100%" stop-color="'+color+'" stop-opacity="0.02"/></linearGradient></defs>';
    svg += '<path d="'+area+'" fill="url(#g'+label+')"/>';
    svg += '<path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    // Points + values
    filtered.forEach(function(v,i){
      var cx=xPos(i), cy=yPos(v,mn,mx);
      svg += '<circle cx="'+cx+'" cy="'+cy+'" r="4" fill="'+color+'" stroke="#fff" stroke-width="1.5"/>';
      svg += '<text x="'+cx+'" y="'+(cy-8)+'" text-anchor="middle" font-size="9" font-weight="700" fill="'+color+'">'+n(v,decimals)+'</text>';
      // X label
      if(i<dates.length) svg += '<text x="'+cx+'" y="'+(padT+plotH+18)+'" text-anchor="middle" font-size="8" fill="#9ca3af">'+dates[i].slice(5)+'</text>';
    });
    // Label
    svg += '<text x="'+(padL+4)+'" y="'+(padT+10)+'" font-size="11" font-weight="700" fill="'+color+'">'+label+' ('+unit+')</text>';
    svg += '</svg>';
    return svg;
  }

  var wtVals  = samps.slice().reverse().map(function(s){return s.avgWt||0;});
  var sgrVals = samps.slice().reverse().map(function(s){return s.sgr||0;});
  var fcrVals = samps.slice().reverse().map(function(s){return s.fcr||0;});
  var bioVals = samps.slice().reverse().map(function(s){return s.biomass||0;});

  h += '<div class="card" style="margin-bottom:12px"><div class="card-title">📏 Average Weight over Time</div>';
  h += svgChart(wtVals,'Avg Weight','#067b72','g',1);
  h += '</div>';

  h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">';
  h += '<div class="card"><div class="card-title">📈 SGR (%/day)</div>';
  h += svgChart(sgrVals,'SGR','#7c3aed','%/d',3);
  h += '</div>';
  h += '<div class="card"><div class="card-title">🎯 FCR</div>';
  h += svgChart(fcrVals,'FCR','#d97706','',2);
  h += '</div>';
  h += '</div>';

  h += '<div class="card" style="margin-bottom:12px"><div class="card-title">⚖️ Biomass (kg)</div>';
  h += svgChart(bioVals,'Biomass','#0ea5e9','kg',1);
  h += '</div>';

  // ── Detailed sampling table ──
  h += '<div class="card"><div class="card-title">🔬 سجل العينات — '+uid+'</div>';
  h += '<div class="tbl-scroll"><table><thead><tr>';
  ['#','Date','Avg Wt (g)','Biomass (kg)','SGR %/d','FCR','أيام','علف الفترة (kg)','ملاحظات'].forEach(function(c){
    h += '<th>'+c+'</th>';
  });
  h += '</tr></thead><tbody>';
  samps.forEach(function(s,i){
    var sgrColor = s.sgr>2?'var(--green)':s.sgr>1?'var(--amber)':'var(--red)';
    var fcrColor = s.fcr&&s.fcr<2?'var(--green)':s.fcr&&s.fcr<3?'var(--amber)':'var(--red)';
    h += '<tr>';
    h += '<td style="color:var(--muted)">'+(i+1)+'</td>';
    h += '<td>'+s.date+'</td>';
    h += '<td><strong>'+n(s.avgWt,1)+'</strong></td>';
    h += '<td>'+n(s.biomass,1)+'</td>';
    h += '<td style="font-weight:700;color:'+(s.sgr?sgrColor:'var(--muted)')+'">'+(s.sgr?n(s.sgr,3):'—')+'</td>';
    h += '<td style="font-weight:700;color:'+(s.fcr?fcrColor:'var(--muted)')+'">'+(s.fcr?n(s.fcr,2):'—')+'</td>';
    h += '<td>'+(s.daysSinceLast||'—')+'</td>';
    h += '<td>'+(s.feedSinceLast?n(s.feedSinceLast,1):'—')+'</td>';
    h += '<td style="font-size:11px;color:var(--muted)">'+(s.notes||'—')+'</td>';
    h += '</tr>';
  });
  h += '</tbody></table></div></div>';
  return h;
}


// ══════════════════════════════════════════════════════════
//  UPGRADE #7 — Professional PDF Report
//  Full farm report: cover + KPIs + per-unit table +
//  TX summary + WQ + charts — print-ready A4 layout.

function renderPDFReport(){
  var today    = new Date().toISOString().slice(0,10);
  var cfg      = getSettings();
  var liveRs   = _txLiveRows().filter(function(r){
    return (r.fishNo||0)>0 && (farmFilter==='all'||r.farm===farmFilter);
  });
  var allTX    = getTX();
  var reportDate = new Date().toLocaleDateString('ar-BH',{year:'numeric',month:'long',day:'numeric'});

  // ── Aggregates ──
  var totFish  = liveRs.reduce(function(s,r){return s+(r.fishNo||0);},0);
  var totBio   = liveRs.reduce(function(s,r){return s+(r.biomass||0);},0);
  var alarmCnt = liveRs.filter(function(r){return r.alarm;}).length;
  var warnCnt  = liveRs.filter(function(r){return r.warn;}).length;

  // Last 30 days TX summary
  var d30 = new Date(); d30.setDate(d30.getDate()-30);
  var from30 = d30.toISOString().slice(0,10);
  var recentTX = allTX.filter(function(t){return (t.date||'')>=from30;});
  var totFeedKg  = recentTX.filter(function(t){return t.type==='feeding';}).reduce(function(s,t){return s+(t.kg||0);},0);
  var totMort    = recentTX.filter(function(t){return t.type==='mortality';}).reduce(function(s,t){return s+(t.count||0);},0);
  var totHarvKg  = recentTX.filter(function(t){return t.type==='harvesting';}).reduce(function(s,t){return s+(t.kg||0);},0);
  var totHarvRev = recentTX.filter(function(t){return t.type==='harvesting';}).reduce(function(s,t){return s+(t.kg||0)*(t.price||0);},0);
  var latestSamp = {};
  allTX.filter(function(t){return t.type==='sampling';}).sort(function(a,b){return a.date>b.date?1:-1;}).forEach(function(t){
    if(!latestSamp[t.unit]) latestSamp[t.unit]=t;
  });
  var avgSGR = (function(){
    var v=Object.values(latestSamp).filter(function(s){return s.sgr;}).map(function(s){return s.sgr;});
    return v.length?v.reduce(function(a,b){return a+b;},0)/v.length:0;
  })();
  var avgFCR = (function(){
    var v=Object.values(latestSamp).filter(function(s){return s.fcr;}).map(function(s){return s.fcr;});
    return v.length?v.reduce(function(a,b){return a+b;},0)/v.length:0;
  })();

  var h = '';

  // Print CSS
  h += '<style id="pdf-pro-style">@media print{';
  h += '.top,.sidebar,.mob-nav,.drawer,.no-print,#back-btn{display:none!important}';
  h += '.content{padding:0!important;max-width:100%!important}.shell{display:block!important}';
  h += '.pdf-page{page-break-before:always}.pdf-avoid{page-break-inside:avoid}';
  h += '@page{margin:1.5cm 1.8cm;size:A4}body{font-size:11px!important}';
  h += '.pdf-kpi-grid{grid-template-columns:repeat(4,1fr)!important}';
  h += '}</style>';

  // Screen toolbar
  h += '<div class="no-print" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px">';
  h += '<div>';
  h += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">';
  h += '<button class="ibtn" onclick="show(\'tx-reports\')" style="font-size:12px;padding:6px 12px">← رجوع</button>';
  h += '<h2 style="font-size:20px;font-weight:700;color:var(--deep);margin:0">📄 تقرير المزرعة الشامل</h2>';
  h += '</div>';
  h += '<p style="color:var(--muted);font-size:12px;margin:0">'+reportDate+' · لطباعة PDF: اضغط 🖨️ ثم اختر "Save as PDF" من الطابعة</p>';
  h += '</div>';
  h += '<div style="display:flex;gap:8px">';
  h += '<button class="savebtn" style="width:auto;padding:10px 22px;font-size:14px;background:var(--deep)" onclick="window.print()">🖨️ طباعة / حفظ PDF</button>';
  h += '<button class="ibtn" onclick="exportTxReportExcel()">📊 Excel</button>';
  h += '</div></div>';

  // ── COVER PAGE ──
  h += '<div class="pdf-avoid" style="background:var(--deep);color:#fff;border-radius:14px;padding:32px 36px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px">';
  h += '<div>';
  h += '<div style="font-size:32px;font-weight:900;letter-spacing:-1px;margin-bottom:4px">'+(daFarmName())+'</div>';
  h += '<div style="font-size:14px;opacity:.7;margin-bottom:12px">'+(cfg.location||'Bahrain')+' · '+(cfg.species||'Silver Tilapia')+' · '+(cfg.productionSystem||'RAS')+'</div>';
  h += '<div style="font-size:13px;opacity:.6">📅 تاريخ التقرير: '+reportDate+'</div>';
  h += '<div style="font-size:12px;opacity:.5;margin-top:4px">📊 يغطي آخر 30 يوم: '+from30+' → '+today+'</div>';
  h += '</div>';
  h += '<div style="text-align:end">';
  h += '<div style="font-size:11px;opacity:.6;margin-bottom:6px">إعداد: Farm Manager</div>';
  h += '<div style="background:var(--lime);color:var(--deep);border-radius:8px;padding:8px 16px;font-weight:800;font-size:14px">Farm Report</div>';
  h += '</div></div>';

  // ── KPI GRID ──
  h += '<div class="pdf-avoid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:20px" id="pdf-kpi-grid">';
  var kpis = [
    {lbl:'🐟 إجمالي الأسماك',  val:fmtK(totFish)+' سمكة', sub:liveRs.length+' وحدة نشطة', cls:''},
    {lbl:'⚖️ إجمالي Biomass',   val:n(totBio/1000,2)+' طن', sub:n(totBio,0)+' كجم', cls:''},
    {lbl:'🔴 تنبيهات كثافة',    val:alarmCnt,   sub:'وحدات > '+(cfg.densAlarm||25)+' كجم/م³', cls:alarmCnt?'kalarm':''},
    {lbl:'🟡 تحذيرات',          val:warnCnt,    sub:'وحدات > '+(cfg.densWarn||15)+' كجم/م³', cls:warnCnt?'kwarn':''},
    {lbl:'🌾 العلف (30 يوم)',   val:n(totFeedKg,1)+' كجم', sub:'', cls:''},
    {lbl:'💀 النفوق (30 يوم)',  val:totMort+' سمكة', sub:'', cls:totMort>50?'kalarm':''},
    {lbl:'🎣 الحصاد (30 يوم)', val:n(totHarvKg,1)+' كجم', sub:n(totHarvRev,2)+' BD إيراد', cls:'kok'},
    {lbl:'📈 متوسط SGR',        val:avgSGR?n(avgSGR,3)+'%/d':'—', sub:'من آخر عينة', cls:avgSGR>2?'kok':avgSGR>1?'kwarn':''},
    {lbl:'🎯 متوسط FCR',        val:avgFCR?n(avgFCR,2):'—',        sub:'كجم علف/كجم وزن', cls:avgFCR&&avgFCR<2?'kok':avgFCR?'kwarn':''},
  ];
  kpis.forEach(function(k){
    h += '<div class="kpi pdf-avoid '+(k.cls||'')+'">'; 
    h += '<div class="kpi-lbl">'+k.lbl+'</div>';
    h += '<div class="kpi-val" style="font-size:20px">'+k.val+'</div>';
    if(k.sub) h += '<div class="kpi-sub">'+k.sub+'</div>';
    h += '</div>';
  });
  h += '</div>';

  // ── UNIT PRODUCTION TABLE ──
  h += '<div class="card pdf-avoid" style="margin-bottom:20px">';
  h += '<div class="card-title" style="font-size:15px">📋 جدول الوحدات الإنتاجية</div>';
  h += '<div class="tbl-scroll"><table><thead><tr>';
  ['الوحدة','القسم','عدد الأسماك','متوسط الوزن (g)','Biomass (kg)','الكثافة','SGR','FCR','آخر عينة','الحالة'].forEach(function(c){
    h += '<th>'+c+'</th>';
  });
  h += '</tr></thead><tbody>';
  liveRs.sort(function(a,b){return (a.section||'')>(b.section||'')?1:-1;}).forEach(function(r){
    var ls = latestSamp[r.unit];
    h += '<tr>';
    h += '<td><strong style="color:var(--teal)">'+r.unit+'</strong></td>';
    h += '<td style="font-size:11px;color:var(--muted)">'+( r.section||'—')+'</td>';
    h += '<td>'+fmtK(r.fishNo||0)+'</td>';
    h += '<td><strong>'+n(r.avgWt||0,1)+'</strong></td>';
    h += '<td>'+n(r.biomass,1)+'</td>';
    h += '<td style="color:'+(r.alarm?'var(--red)':r.warn?'var(--amber)':'var(--green)')+';font-weight:700">'+n(r.density,2)+'</td>';
    h += '<td style="color:'+(ls&&ls.sgr>2?'var(--green)':ls&&ls.sgr>1?'var(--amber)':'var(--muted)')+'">'+(ls&&ls.sgr?n(ls.sgr,3):'—')+'</td>';
    h += '<td style="color:'+(ls&&ls.fcr&&ls.fcr<2?'var(--green)':ls&&ls.fcr?'var(--amber)':'var(--muted)')+'">'+(ls&&ls.fcr?n(ls.fcr,2):'—')+'</td>';
    h += '<td style="font-size:11px">'+(ls?ls.date:'—')+'</td>';
    h += '<td>'+pill(r)+'</td>';
    h += '</tr>';
  });
  h += '</tbody></table></div></div>';

  // ── TX SUMMARY (last 30 days) by type ──
  h += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:20px">';

  // Feeding by unit
  var feedMap={};
  recentTX.filter(function(t){return t.type==='feeding';}).forEach(function(t){feedMap[t.unit]=(feedMap[t.unit]||0)+(t.kg||0);});
  h += '<div class="card pdf-avoid"><div class="card-title">🌾 العلف — آخر 30 يوم</div>';
  h += '<table style="width:100%;font-size:11px"><tbody>';
  Object.keys(feedMap).sort(function(a,b){return feedMap[b]-feedMap[a];}).slice(0,12).forEach(function(u){
    h += '<tr><td style="color:var(--teal);font-weight:600">'+u+'</td><td style="text-align:end;font-weight:700">'+n(feedMap[u],1)+' كجم</td></tr>';
  });
  h += '<tr style="border-top:1px solid var(--line)"><td><strong>الإجمالي</strong></td><td style="text-align:end;font-weight:700;color:var(--teal)">'+n(totFeedKg,1)+' كجم</td></tr>';
  h += '</tbody></table></div>';

  // Mortality by cause
  var mortMap={};
  recentTX.filter(function(t){return t.type==='mortality';}).forEach(function(t){mortMap[t.cause||'غير محدد']=(mortMap[t.cause||'غير محدد']||0)+(t.count||0);});
  h += '<div class="card pdf-avoid"><div class="card-title">💀 النفوق — آخر 30 يوم</div>';
  h += '<table style="width:100%;font-size:11px"><tbody>';
  Object.keys(mortMap).sort(function(a,b){return mortMap[b]-mortMap[a];}).forEach(function(c){
    h += '<tr><td>'+c+'</td><td style="text-align:end;font-weight:700;color:var(--red)">'+mortMap[c]+'</td></tr>';
  });
  if(!Object.keys(mortMap).length) h += '<tr><td colspan="2" style="text-align:center;color:var(--muted);padding:16px">✅ لا نفوق مسجل</td></tr>';
  h += '<tr style="border-top:1px solid var(--line)"><td><strong>الإجمالي</strong></td><td style="text-align:end;font-weight:700;color:var(--red)">'+totMort+'</td></tr>';
  h += '</tbody></table></div>';

  // Harvest summary

var FEED_INV_KEY = 'daracqua_feed_inventory_v1';
var _feedInvCache = null;

function getFeedInv(){
  if(_feedInvCache) return _feedInvCache;
  try{ _feedInvCache=JSON.parse(localStorage.getItem(FEED_INV_KEY)||'[]'); return _feedInvCache||[]; }catch(e){ return []; }
}
function saveFeedInv(arr){
  _feedInvCache=arr;
  try{ localStorage.setItem(FEED_INV_KEY,JSON.stringify(arr)); }catch(e){}
}
// addFeedInv defined above with SB sync
function deleteFeedInv(id){
  saveFeedInv(getFeedInv().filter(function(x){return x.id!==id;}));
}

// Feed types in inventory
function getFeedTypes(){
  var types={};
  getFeedInv().forEach(function(e){ if(e.feedType) types[e.feedType]=1; });
  getTX().filter(function(t){return t.type==='feeding'&&t.feed;}).forEach(function(t){ types[t.feed]=1; });
  var def=['Starter 0.5mm','Starter 1mm','Starter 1.5mm','Grower 2mm','Grower 3mm','Finisher 4mm','Finisher 6mm'];
  def.forEach(function(d){ types[d]=1; });
  return Object.keys(types).sort();
}

// Compute running balance per feed type

// All feed types balance summary
function getAllFeedBalances(){
  var types = getFeedTypes();
  return types.map(function(ft){
    var b = getFeedBalance(ft);
    return Object.assign({feedType:ft}, b);
  }).filter(function(b){return b.purchased>0||b.consumed>0;});
}

// Check if enough feed is available
function checkFeedAvailable(feedType, kgNeeded){
  if(!feedType) return {ok:false, msg:'اختر نوع العلف'};
  var bal = getFeedBalance(feedType);
  if(bal <= 0) return {ok:false, msg:'❌ '+feedType+' غير متوفر في المخزون'};
  if(bal < kgNeeded) return {ok:false, msg:'⚠️ المخزون ('+bal.toFixed(1)+' كجم) أقل من المطلوب ('+kgNeeded.toFixed(1)+' كجم)'};
  return {ok:true, bal:bal};
}

      dateRows.forEach(function(d,i){
        var cx=padL+i*xStep, cy=padT+ph*(1-(byDate[d]||0)/maxDay);
        h+='<circle cx="'+cx+'" cy="'+cy+'" r="3" fill="#067b72" stroke="#fff" stroke-width="1.5"/>';

          h+='<text x="'+cx+'" y="'+(padT+ph+16)+'" text-anchor="middle" font-size="8" fill="#9ca3af">'+d.slice(5)+'</text>';
        }
      });
      h+='</svg>';
      // Avg per day
      var totalLast30=dateRows.reduce(function(s,d){return s+(byDate[d]||0);},0);
      h+='<div style="text-align:center;font-size:12px;color:var(--muted);margin-top:8px">متوسط يومي: <strong style="color:var(--teal)">'+n(totalLast30/Math.max(1,dateRows.length),1)+' كجم</strong></div>';
    } else {
      h+='<div style="text-align:center;padding:24px;color:var(--muted)">لا توجد بيانات كافية</div>';
    }
    h+='</div>';
    h+='</div>'; // end grid2

    // Days remaining per type
    h+='<div class="card" style="margin-top:0"><div class="card-title">⏳ تقدير أيام المخزون المتبقية</div>';

    getFeedTypes().forEach(function(ft){
      var bal=getFeedBalance(ft).balance;
      if(bal<=0) return;
      var consumed30=getTX().filter(function(t){return t.type==='feeding'&&t.feed===ft&&t.date>=from30;}).reduce(function(s,t){return s+(t.kg||0);},0);
      var dailyAvg=consumed30/30;
      var daysLeft=dailyAvg>0?Math.round(bal/dailyAvg):999;
      var runOutDate=dailyAvg>0?(function(){var d=new Date();d.setDate(d.getDate()+daysLeft);return d.toISOString().slice(0,10);})():'—';

      h+='<tr>';
      h+='<td><strong>'+ft+'</strong></td>';
      h+='<td>'+n(bal,1)+' كجم</td>';
      h+='<td>'+n(dailyAvg,1)+' كجم</td>';
      h+='<td style="font-weight:700;color:'+urgency+'">'+(daysLeft>=999?'> 99':daysLeft)+' يوم</td>';
      h+='<td style="color:'+urgency+'">'+(dailyAvg>0?runOutDate:'—')+'</td>';
      h+='</tr>';
    });
    h+='</tbody></table></div></div>';
  }

  // ── Add Stock Modal (inline) ──
  h+='<div id="feed-inv-modal" style="display:none;margin-top:16px;background:#fff;border:1.5px solid var(--teal);border-radius:12px;padding:18px">';
  h+='<div style="font-size:14px;font-weight:700;color:var(--deep);margin-bottom:14px">➕ تسجيل شحنة علف جديدة</div>';

  h+='<div class="fg3" style="margin-bottom:14px">';
  h+='<div class="field"><label>التاريخ</label><input type="date" id="inv-date" value="'+today+'" style="width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font:inherit;font-size:13px"/></div>';
  h+='<div class="field"><label>المورد / المصدر</label><input type="text" id="inv-supplier" placeholder="اسم المورد" style="width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font:inherit;font-size:13px"/></div>';
  h+='<div class="field"><label>رقم الفاتورة</label><input type="text" id="inv-invoice" placeholder="اختياري" style="width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font:inherit;font-size:13px"/></div>';
  h+='</div>';

  // Feed lines table
  h+='<div style="margin-bottom:12px">';
  h+='<div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px">📦 أحجام العلف في الشحنة:</div>';
  h+='<div id="inv-lines-wrap">';

  // Default 3 lines
  var defaultFeedTypes=['Starter 1mm','Grower 3mm','Finisher 4mm'];
  var invExistingTypes=getAvailableFeedTypes().concat(feedTypes);
  var allFeedTypes=[...new Set(invExistingTypes)];

  for(var li=0;li<3;li++){
    h+=invBuildLine(li, allFeedTypes, defaultFeedTypes[li]||'');
  }
  h+='</div>';
  h+='<button onclick="invAddLine()" style="margin-top:8px;padding:7px 16px;background:var(--light);border:1.5px dashed var(--teal);border-radius:8px;font:inherit;font-size:13px;cursor:pointer;color:var(--teal)">➕ إضافة حجم آخر</button>';
  h+='</div>';

  // Notes
  h+='<div class="field" style="margin-bottom:14px"><label>ملاحظات</label><input type="text" id="inv-notes" placeholder="اختياري" style="width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font:inherit;font-size:13px"/></div>';

  h+='<button class="savebtn" style="flex:1" onclick="saveShipment()">💾 حفظ الشحنة</button>';
  h+='<button class="ibtn" onclick="hideFeedModal()">إلغاء</button>';
  h+='</div>';
  h+='</div>';
  return h;
}

function hideFeedModal(){

// ── Feed Inventory — Multi-line Shipment ─────────────────

var _invLineCount = 3;

function invBuildLine(idx, allFeedTypes, defaultType){
  var h = '<div id="inv-line-'+idx+'" style="display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px;padding:8px;background:var(--light);border-radius:8px">';
  h += '<select id="inv-ft-'+idx+'" style="padding:7px 10px;border:1.5px solid var(--line);border-radius:8px;font:inherit;font-size:13px">';
  h += '<option value="">-- نوع العلف --</option>';
  allFeedTypes.forEach(function(ft){
    h += '<option value="'+ft+'"'+(ft===defaultType?' selected':'')+'>'+ft+'</option>';
  });
  h += '<option value="__new">+ نوع جديد...</option>';
  h += '</select>';
  h += '<input type="number" id="inv-kg-'+idx+'" placeholder="الكمية (كجم)" min="0" step="0.1" style="padding:7px 10px;border:1.5px solid var(--line);border-radius:8px;font:inherit;font-size:13px"/>';
  h += '<input type="number" id="inv-price-'+idx+'" placeholder="السعر (BD/كجم)" min="0" step="0.01" style="padding:7px 10px;border:1.5px solid var(--line);border-radius:8px;font:inherit;font-size:13px"/>';
  h += '<button data-line="'+idx+'" onclick="invRemoveLine(this.dataset.line)" style="padding:7px 10px;background:#fee2e2;border:0;border-radius:8px;cursor:pointer;font-size:14px;color:var(--red)">✕</button>';
  h += '</div>';
  return h;
}

function invAddLine(){
  var wrap = document.getElementById('inv-lines-wrap');
  if(!wrap) return;
  var inv = getFeedInv();
  var existingTypes = getAvailableFeedTypes();
  var allTypes = ['Starter 0.5mm','Starter 1mm','Starter 1.5mm','Grower 2mm','Grower 3mm','Finisher 4mm','Finisher 6mm'].concat(existingTypes);
  allTypes = [...new Set(allTypes)];
  var newDiv = document.createElement('div');
  newDiv.innerHTML = invBuildLine(_invLineCount, allTypes, '');
  wrap.appendChild(newDiv.firstChild);
  _invLineCount++;
}

function invRemoveLine(idx){
  var el = document.getElementById('inv-line-'+idx);
  if(el) el.style.display = 'none';
}

function saveShipment(){
  var date     = (document.getElementById('inv-date')||{}).value||new Date().toISOString().slice(0,10);
  var supplier = (document.getElementById('inv-supplier')||{}).value||'';
  var invoice  = (document.getElementById('inv-invoice')||{}).value||'';
  var notes    = (document.getElementById('inv-notes')||{}).value||'';
  var saved    = 0;

  // Loop through all lines
  for(var i=0; i<_invLineCount+5; i++){
    var lineEl = document.getElementById('inv-line-'+i);
    if(!lineEl || lineEl.style.display==='none') continue;
    var ftEl  = document.getElementById('inv-ft-'+i);
    var kgEl  = document.getElementById('inv-kg-'+i);
    var prEl  = document.getElementById('inv-price-'+i);
    if(!ftEl||!kgEl) continue;
    var feedType = ftEl.value;
    if(!feedType || feedType==='__new' || feedType==='') continue;
    var kg    = parseFloat(kgEl.value)||0;
    var price = parseFloat(prEl?prEl.value:0)||0;
    if(kg<=0) continue;

    addFeedInv({
      feedType:feedType, kg:kg, txType:'purchase',
      date:date, supplier:supplier, invoice:invoice, price:price, notes:notes
    });
    saved++;
  }

  if(!saved){ toast('⚠️ ادخل كمية لحجم واحد على الأقل'); return; }
  toast('✅ تم حفظ الشحنة — '+saved+' نوع علف');
  _feedInvCache = null;
  hideFeedModal();
  show('feed-inventory');
}

function saveFeedInvEntry(){
  var entryType=document.getElementById('inv-entry-type').value;
  var date=document.getElementById('inv-date').value;
  var ftEl=document.getElementById('inv-feed-type');
  var feedType=ftEl.value==='__new'?(document.getElementById('inv-new-type').value.trim()):ftEl.value;
  var kg=parseFloat(document.getElementById('inv-kg').value||0);
  var supplier=document.getElementById('inv-supplier').value.trim();
  var invoice=document.getElementById('inv-invoice').value.trim();
  var price=parseFloat(document.getElementById('inv-price').value||0);
  var notes=document.getElementById('inv-notes').value.trim();
  if(!feedType||!kg){ toast('⚠️ نوع العلف والكمية مطلوبان'); return; }
  addFeedInv({entryType:entryType,date:date,feedType:feedType,kg:kg,supplier:supplier,invoice:invoice,price:price,notes:notes});
  toast('✅ تم تسجيل '+n(kg,1)+' كجم — '+feedType);
  hideFeedModal();
  _feedInvCache=null;
  show('feed-inventory');
}
